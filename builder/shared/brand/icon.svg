<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Clip to rounded square shape -->
    <clipPath id="clip">
      <rect width="200" height="200" rx="40"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#g)"/>

  <g clip-path="url(#clip)">
    <!-- Giant P — dominant, left-anchored, fills the icon -->
    <text
      x="6"
      y="168"
      font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-size="155"
      fill="white">P</text>

    <!-- Outlined A — bottom-right, secondary, outline only for modern contrast -->
    <text
      x="124"
      y="188"
      font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-size="78"
      fill="none"
      stroke="white"
      stroke-width="3.5"
      opacity="0.65">A</text>
  </g>

  <!-- Accent dot — references the "." punctuation mark in PUT.A. -->
  <circle cx="174" cy="28" r="11" fill="#A5B4FC" opacity="0.9"/>
</svg>

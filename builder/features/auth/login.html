<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Presentation Builder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    .glow {
      position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none;
    }
    .glow-a { width: 600px; height: 600px; background: rgba(245,166,35,.07); top: -200px; right: -100px; }
    .glow-b { width: 500px; height: 500px; background: rgba(59,130,246,.06); bottom: -150px; left: -100px; }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px;
      padding: 40px 36px 36px;
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 52px; height: 52px;
      display: block; flex-shrink: 0;
    }
    .logo-img {
      height: 80px; width: auto; display: block;
      filter: brightness(0) invert(1);
    }

    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: rgba(255,255,255,.45); margin-bottom: 28px; }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em;
            text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: 7px; }
    input {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; color: #fff; font-size: 14px; font-family: inherit;
      outline: none; transition: border-color .2s, background .2s;
    }
    input:focus { border-color: rgba(245,166,35,.6); background: rgba(255,255,255,.08); }
    input::placeholder { color: rgba(255,255,255,.25); }

    .error {
      background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.30);
      color: #f87171; font-size: 12px; font-weight: 600;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }

    button[type="submit"] {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #f5a623, #e8711a);
      border: none; border-radius: 10px;
      color: #000; font-size: 14px; font-weight: 800;
      letter-spacing: .04em; cursor: pointer; font-family: inherit;
      transition: opacity .2s, transform .1s;
      margin-top: 4px;
    }
    button[type="submit"]:hover { opacity: .9; }
    button[type="submit"]:active { transform: scale(.98); }

    .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px;
               color: rgba(255,255,255,.3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.10); }
    .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px;
                  width: 100%; padding: 11px; background: rgba(255,255,255,.06);
                  border: 1px solid rgba(255,255,255,.12); border-radius: 10px; color: #fff;
                  font-size: 14px; font-weight: 600; font-family: inherit; text-decoration: none;
                  transition: background .2s, border-color .2s; }
    .social-btn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.2); }
    .social-btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div class="card">
    <div class="logo">
      <img class="logo-icon" src="/shared/brand/icon.svg" alt="PA">
      <img class="logo-img" src="/shared/brand/logo.svg" alt="PUT.A. Presentation">
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to access your presentations</p>

    <div class="error" id="errorMsg">Invalid email or password.</div>

    <form method="POST" action="/auth/login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
    </form>

    <div class="divider"><span>or</span></div>

    <a class="social-btn" href="/auth/login/google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>

    <a class="social-btn" href="/auth/login/linkedin" style="margin-top:10px;">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#0A66C2" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.8 0 0 .78 0 1.75v20.5C0 23.22.8 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.75V1.75C24 .78 23.2 0 22.22 0z"/></svg>
      Continue with LinkedIn
    </a>
  </div>

  <script>
    // Show an error if redirected back with ?error=… ("disabled" and "notallowed"
    // come from the social-login allowlist gate in auth.js).
    var ERRORS = {
      disabled:   'Social login is not configured. Set ALLOWED_EMAILS in .env to enable it.',
      notallowed: 'That account is not allowed to sign in. Ask an admin to add it to ALLOWED_EMAILS.'
    };
    var err = new URLSearchParams(location.search).get('error');
    if (err) {
      var box = document.getElementById('errorMsg');
      if (ERRORS[err]) box.textContent = ERRORS[err];
      box.classList.add('show');
    }
  </script>
</body>
</html>

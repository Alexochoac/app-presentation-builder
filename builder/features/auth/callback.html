<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signing you in…</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0a0a0a;color:rgba(255,255,255,.7);
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
  </style>
</head>
<body>
  <div>Signing you in…</div>
  <script>
    // The provider returns the session in the URL hash (#access_token=…). Read it,
    // exchange it for an app session on the server, then continue into the app.
    (function () {
      var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      var token  = params.get('access_token');
      var errMsg = params.get('error_description') || params.get('error');
      if (!token) {
        location.replace('/auth/login?error=1' + (errMsg ? '&msg=' + encodeURIComponent(errMsg) : ''));
        return;
      }
      fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token })
      })
        .then(function (r) {
          // 403 = the account authenticated fine but isn't on the allowlist —
          // worth its own message, since retrying won't help.
          var code = r.status === 403 ? 'notallowed' : '1';
          return r.json().then(function (res) {
            location.replace(res && res.success ? '/' : '/auth/login?error=' + code);
          });
        })
        .catch(function () { location.replace('/auth/login?error=1'); });
    })();
  </script>
</body>
</html>

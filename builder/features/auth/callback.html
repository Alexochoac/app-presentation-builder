<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signing you in…</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#0a0a0a;color:rgba(255,255,255,.7);
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
  </style>
</head>
<body>
  <div>Signing you in…</div>
  <script>
    // The provider returns the session in the URL hash (#access_token=…). Read it,
    // exchange it for an app session on the server, then continue into the app.
    (function () {
      var params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      var token  = params.get('access_token');
      var errMsg = params.get('error_description') || params.get('error');
      if (!token) {
        location.replace('/auth/login?error=1' + (errMsg ? '&msg=' + encodeURIComponent(errMsg) : ''));
        return;
      }
      fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token })
      })
        .then(function (r) {
          return r.json().then(function (res) {
            if (res && res.success) return location.replace('/');
            // 403 = authenticated fine, but refused — either not on the sign-in
            // allowlist or not a member of any team. Retrying won't help, so say
            // which it was. The server tags the team case with code:'noteam'.
            var code = '1';
            if (r.status === 403) code = (res && res.code === 'noteam') ? 'noteam' : 'notallowed';
            location.replace('/auth/login?error=' + code);
          });
        })
        .catch(function () { location.replace('/auth/login?error=1'); });
    })();
  </script>
</body>
</html>

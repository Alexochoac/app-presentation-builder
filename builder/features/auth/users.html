<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — Presentation Builder</title>
  <style>
    :root{
      --bg:#0b0d10; --surface:#14181d; --surface-2:#1b2027; --line:#272e37;
      --text:#e8edf3; --muted:#8b98a6; --accent:#f5a623; --accent-2:#e8711a;
      --danger:#f87171; --ok:#34d399;
    }
    @media (prefers-color-scheme:light){
      :root{
        --bg:#f3f5f7; --surface:#ffffff; --surface-2:#f6f8fa; --line:#e2e7ec;
        --text:#16202b; --muted:#5b6b7a; --accent:#e8711a; --accent-2:#d15f0f;
        --danger:#d64545; --ok:#0f9d76;
      }
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text); min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      line-height:1.5; padding:40px 20px;
    }
    .wrap{max-width:760px;margin:0 auto}
    .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:6px}
    h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
    .back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
    .back:hover{color:var(--text)}
    .sub{color:var(--muted);font-size:13px;margin-bottom:28px}

    .card{
      background:var(--surface);border:1px solid var(--line);border-radius:14px;
      padding:22px 22px 24px;margin-bottom:22px;
    }
    .card h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
             color:var(--muted);margin-bottom:16px}
    form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
    .field{flex:1;min-width:180px}
    label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
          color:var(--muted);margin-bottom:6px}
    input{
      width:100%;padding:10px 13px;background:var(--surface-2);border:1px solid var(--line);
      border-radius:9px;color:var(--text);font-size:14px;font-family:inherit;outline:none;
      transition:border-color .15s;
    }
    input:focus{border-color:var(--accent)}
    button{
      padding:10px 18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
      border:none;border-radius:9px;color:#000;font-size:14px;font-weight:800;cursor:pointer;
      font-family:inherit;white-space:nowrap;transition:opacity .15s,transform .1s;
    }
    button:hover{opacity:.92}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.5;cursor:default}
    .hint{font-size:12px;color:var(--muted);margin-top:10px}

    .msg{font-size:13px;font-weight:600;padding:10px 14px;border-radius:8px;margin-top:14px;display:none}
    .msg.show{display:block}
    .msg.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--danger)}
    .msg.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--ok)}

    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       color:var(--muted);padding:0 8px 10px;border-bottom:1px solid var(--line)}
    td{padding:12px 8px;border-bottom:1px solid var(--line);font-size:14px}
    tr:last-child td{border-bottom:none}
    td.email{font-weight:600}
    td.dim{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
    .empty{color:var(--muted);font-size:14px;padding:16px 8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Users</h1>
      <a class="back" href="/">← Back to builder</a>
    </div>
    <p class="sub">Login accounts for the builder. New accounts are active immediately — no confirmation email.</p>

    <div class="card">
      <h2>Add a user</h2>
      <form id="addForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
        <button type="submit" id="addBtn">Create user</button>
      </form>
      <p class="hint">Password must be at least 6 characters.</p>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <h2>Existing users</h2>
      <table>
        <thead>
          <tr><th>Email</th><th>Created</th><th>Last sign-in</th></tr>
        </thead>
        <tbody id="userRows">
          <tr><td colspan="3" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    var rows = document.getElementById('userRows');
    var msg  = document.getElementById('msg');

    function showMsg(text, kind){
      msg.textContent = text;
      msg.className = 'msg show ' + kind;
    }
    function fmt(ts){
      if(!ts) return '—';
      var d = new Date(ts);
      return isNaN(d.getTime()) ? '—' : d.toLocaleDateString();
    }
    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
      });
    }

    function loadUsers(){
      fetch('/api/users').then(function(r){ return r.json(); }).then(function(res){
        if(!res.success){
          rows.innerHTML = '<tr><td colspan="3" class="empty">' + esc(res.error || 'Could not load users.') + '</td></tr>';
          return;
        }
        if(!res.data.length){
          rows.innerHTML = '<tr><td colspan="3" class="empty">No users yet.</td></tr>';
          return;
        }
        rows.innerHTML = res.data.map(function(u){
          return '<tr><td class="email">' + esc(u.email) + '</td>' +
                 '<td class="dim">' + fmt(u.createdAt) + '</td>' +
                 '<td class="dim">' + fmt(u.lastSignInAt) + '</td></tr>';
        }).join('');
      }).catch(function(){
        rows.innerHTML = '<tr><td colspan="3" class="empty">Could not load users.</td></tr>';
      });
    }

    document.getElementById('addForm').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = document.getElementById('addBtn');
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      btn.disabled = true;
      fetch('/api/users', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ email: email, password: password })
      }).then(function(r){ return r.json(); }).then(function(res){
        btn.disabled = false;
        if(!res.success){ showMsg(res.error || 'Could not create user.', 'err'); return; }
        showMsg('Created ' + res.data.email + '.', 'ok');
        document.getElementById('addForm').reset();
        loadUsers();
      }).catch(function(){
        btn.disabled = false;
        showMsg('Network error — could not create user.', 'err');
      });
    });

    loadUsers();
  </script>
</body>
</html>

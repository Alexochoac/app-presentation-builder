  <!-- ── Scoped Styles ── -->
  <style>
    .ls13 { padding: 70px 16px 80px !important; }
    @media (min-width: 769px) {
      .ls13 { padding: 52px 80px 0 !important; }
    }

    /* Header: text left, logo rectangle right */
    .ls15-head { flex-direction: row !important; align-items: flex-start !important; gap: 24px; width: 100%; }
    .ls15-head-text { flex: 1; min-width: 0; }

    /* Customer logo rectangle */
    .ls15-cust-logo {
      flex-shrink: 0; width: 160px; height: 100px;
      background: #ffffff; border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden; transition: border-color .2s;
    }
    .ls15-cust-logo:hover { border-color: rgba(var(--accent-rgb),.5); }
    .ls15-cust-logo::after {
      content: 'Change Logo'; position: absolute; inset: 0; border-radius: 14px;
      background: rgba(0,0,0,.50); color: #fff; font-size: 11px; font-weight: 700;
      letter-spacing: .06em; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .ls15-cust-logo:hover::after { opacity: 1; }
    .ls15-cust-img { width: 90%; height: 90%; object-fit: contain; display: block; }
    .ls15-cust-logo.ls15-no-logo .ls15-cust-img { display: none; }
    .ls15-cust-logo.ls15-no-logo .ls15-cust-placeholder { display: flex; }
    .ls15-cust-placeholder {
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      width: 100%; height: 100%; border: 2px dashed rgba(150,150,180,.35); border-radius: 12px;
      cursor: pointer; color: rgba(150,150,180,.7); text-align: center; padding: 8px;
    }
    .ls15-cust-placeholder span { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .ls15-cust-placeholder small { font-size: 10px; opacity: .65; }

    /* Card delete button — show on hover */
    .int-card { position: relative; }
    .ls15-card-del {
      position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
      border-radius: 50%; background: rgba(180,30,30,.8); border: 1px solid rgba(255,100,100,.3);
      color: #fff; font-size: 13px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s, background .2s; font-family: inherit; padding: 0;
    }
    .int-card:hover .ls15-card-del { opacity: 1; }
    .ls15-card-del:hover { background: rgba(220,40,40,1); }

    /* Add card button */
    .ls15-add-card {
      display: block; margin: 10px auto 0;
      font-size: 12px; font-weight: 700; letter-spacing: .05em; padding: 6px 18px;
      border-radius: 20px; cursor: pointer; background: rgba(255,255,255,.06);
      border: 1px dashed rgba(255,255,255,.25); color: rgba(255,255,255,.55);
      font-family: inherit; transition: background .2s, border-color .2s, color .2s;
    }
    .ls15-add-card:hover { background: rgba(var(--accent-rgb),.12); border-color: var(--accent); color: var(--accent); }

    @media (max-width: 768px) {
      .ls15-head { flex-direction: column !important; }
      .ls15-cust-logo { width: 120px; height: 76px; }
    }
  </style>

  <script>
  (function () {
    var s = document.currentScript;
    setTimeout(function () {
      var slide = s ? s.closest('.slide') : document;
      var grid  = slide.querySelector('#ls15-grid');

      // applyEditsToHtml adds contenteditable to [data-edit] elements — remove it from the
      // grid wrapper so the whole grid doesn't become a freeform text editor.
      grid.removeAttribute('contenteditable');
      grid.removeAttribute('spellcheck');

      // ── Grid save ─────────────────────────────────────────────────────────
      function saveGrid() {
        var clone = grid.cloneNode(true);
        clone.querySelectorAll('[data-builder-only]').forEach(function (n) { n.remove(); });
        clone.querySelectorAll('[contenteditable]').forEach(function (n) {
          n.removeAttribute('contenteditable'); n.removeAttribute('spellcheck');
        });
        document.dispatchEvent(new CustomEvent('slide-carousel-save', {
          detail: { editKey: 'integration-grid', html: clone.innerHTML }
        }));
      }

      // ── Card init ─────────────────────────────────────────────────────────
      function initCard(card) {
        if (card._ls15) return;
        card._ls15 = true;
        // Ensure cells are editable in builder
        card.querySelectorAll('.int-name, .int-type').forEach(function (el) {
          el.setAttribute('contenteditable', '');
          el.setAttribute('spellcheck', 'false');
        });
        var del = card.querySelector('.ls15-card-del');
        if (del) del.onclick = function (e) {
          e.stopPropagation();
          if (grid.querySelectorAll('.int-card').length <= 1) return;
          card.remove();
          saveGrid();
        };
      }

      // Save on text edit
      grid.addEventListener('focusout', function (e) {
        if (e.target && e.target.isContentEditable) saveGrid();
      });

      // Init existing cards
      grid.querySelectorAll('.int-card').forEach(initCard);

      // ── Add card ──────────────────────────────────────────────────────────
      var addBtn = slide.querySelector('#ls15-add-btn');
      if (addBtn) addBtn.onclick = function () {
        var card = document.createElement('div');
        card.className = 'int-card anim-in';
        card.innerHTML =
          '<div class="int-name">New Integration</div>' +
          '<div class="int-type">Type</div>' +
          '<button class="ls15-card-del" data-builder-only="" title="Delete card">×</button>';
        grid.appendChild(card);
        initCard(card);
        card.querySelector('.int-name').focus();
        saveGrid();
      };

      // ── Logo upload ───────────────────────────────────────────────────────
      var logoBox = slide.querySelector('.ls15-cust-logo');
      var logoImg = slide.querySelector('.ls15-cust-img');
      var logoFile = slide.querySelector('#ls15-logo-file');

      function showPlaceholder(show) {
        if (logoBox) logoBox.classList.toggle('ls15-no-logo', show);
      }

      // Click on box triggers file picker
      if (logoBox && logoFile) {
        logoBox.onclick = function (e) {
          if (e.target === logoFile) return;
          logoFile.click();
        };
      }

      // Check if logo loaded
      if (logoImg) {
        if (!logoImg.src || logoImg.naturalWidth === 0) {
          if (logoImg.complete) { showPlaceholder(true); }
          else { logoImg.onload = function () { showPlaceholder(false); }; }
        }
        logoImg.onerror = function () { showPlaceholder(true); };
      }

      // Initial placeholder state when src is empty
      if (logoImg && (!logoImg.getAttribute('src') || logoImg.getAttribute('src') === '')) {
        showPlaceholder(true);
      }

      if (logoFile) {
        logoFile.addEventListener('change', function (e) {
          var file = e.target.files[0];
          if (!file) return;
          var previewUrl = URL.createObjectURL(file);
          logoImg.src = previewUrl;
          showPlaceholder(false);
          var reader = new FileReader();
          reader.onload = function (ev) {
            fetch('/api/upload-image', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filename: file.name, data: ev.target.result })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.path) {
                logoImg.src = data.path;
                document.dispatchEvent(new CustomEvent('slide-image-change', {
                  detail: { editKey: 'customer-logo', src: data.path }
                }));
              }
            });
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });
      }

      if (window.PE && s) PE.initSlide(s.closest('.slide'));
    }, 0);
  })();
  </script>
</div>

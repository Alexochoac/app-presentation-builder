<div class="slide content ls24">
  <div class="slide-logo-row"><img src="/slides/shared/LOGO SoftSolution grays.png" alt="Softsolution"><span class="slide-logo-sep"></span><img src="/slides/shared/LOGO LiteSentry Greys.png" alt="LiteSentry" class="slide-logo-ls"></div>

  <div class="slide-layout">
    <header class="slide-head">
      <div class="section-label" data-edit="section-label" contenteditable="" spellcheck="false">Installation</div>
      <h1 class="slide-title" data-edit="headline" contenteditable="" spellcheck="false">Modular based — <span class="blue">minimum footprint</span></h1>
      <p class="slide-subtitle" data-edit="subtitle" contenteditable="" spellcheck="false" style="margin-bottom:12px; margin-top:-6px;">unique · worldwide</p>
    </header>

    <div class="slide-body">

      <!-- Diagram: carousel + overlaid spec badges -->
      <div class="ls24-wrap">

        <div class="ls-carousel" id="ls24-carousel" data-counter="" data-edit="footprint-diagram" data-track="ls24:carousel:footprint">
          <div class="ls-carousel-track">
            <div class="ls-carousel-slide">
              <img src="/slides/uploads/Slide66.jpg" alt="LineScanner footprint diagram" data-zoom="" data-track="ls24:zoom:footprint-diagram">

            <div class="ls-carousel-slide">
              <img src="/slides/uploads/CostOfQualityDefects.png" alt="Cost of Quality Defects" data-zoom="">
            </div>
          </div>
        </div>

        <!-- Spec badges overlaid -->
        <div class="ls24-badge ls24-badge-h">
          <div class="ls24-badge-title" data-edit="badge-h-title" contenteditable="" spellcheck="false">Horizontal</div>
          <div class="ls24-badge-spec" data-edit="badge-h-spec1" contenteditable="" spellcheck="false">Depth ~475 mm</div>
          <div class="ls24-badge-spec" data-edit="badge-h-spec2" contenteditable="" spellcheck="false">Individual width as required</div>

        </div>

      </div><!-- ls24-wrap -->

    </div><!-- slide-body -->
  </div><!-- slide-layout -->

  <!-- ── Scoped Styles ── -->
  <style>
    .ls24 { padding: 52px 16px 80px !important; }

    .ls24-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 860px;
    }

    /* Force carousel to fill the wrapper via absolute positioning,
       bypassing the height:100% chain that collapses in flex contexts */
    .ls24-wrap .ls-carousel {
      position: absolute !important;
      inset: 0;
      width: auto !important;
      height: auto !important;
    }

    @media (max-width: 768px) {
      .ls24-wrap { min-height: 300px; }
      .ls24-badge { display: none; }
    }

    @media (min-width: 769px) {
      .ls24 { padding: 52px 80px 0 !important; }
    }

    /* Spec badges */
    .ls24-badge {
      position: absolute;
      background: var(--accent); color: #fff;
      border-radius: 20px; padding: 10px 18px;
      display: flex; flex-direction: column; gap: 2px;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      pointer-events: none;
    }
    .ls24-badge-title { font-size: 13px; font-weight: 800; letter-spacing: .02em; }
    .ls24-badge-spec  { font-size: 11px; opacity: .9; }

    .ls24-badge-h { top: 12%; right: 4%; }
    .ls24-badge-v { bottom: 12%; left: 26%; }
  </style>

  <script>
  (function () { var s = document.currentScript;
    setTimeout(function () { if (window.PE && s) PE.initSlide(s.closest('.slide')); }, 0); })();
  </script>

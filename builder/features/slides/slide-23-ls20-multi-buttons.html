<div class="slide content ls20-multi-buttons"
     data-slide="ls20-multi-buttons"
     data-slide-mode="sequence">
  <div class="slide-logo-row"><img src="/slides/shared/LOGO SoftSolution grays.png" alt="Softsolution"><span class="slide-logo-sep"></span><img src="/slides/shared/LOGO LiteSentry Greys.png" alt="LiteSentry" class="slide-logo-ls"></div>

  <div class="slide-layout">
  <header class="slide-head">
    <div class="section-label"
         data-edit="section-label"
         data-lang-key="ls20-multi-buttons.section-label"
         contenteditable="" spellcheck="false">Surface Quality</div>
    <h1 class="slide-title"
        data-edit="headline"
        data-lang-key="ls20-multi-buttons.headline"
        contenteditable="" spellcheck="false">Defect detection with <span class="blue">Artificial Intelligence</span></h1>
    <p class="slide-subtitle"
       data-edit="subtitle"
       data-lang-key="ls20-multi-buttons.subtitle"
       contenteditable="" spellcheck="false">Neural network trained to automatically classify every defect type.</p>
  </header>

  <div class="slide-body">

    <!--
      Config blob — stores button definitions as JSON.
      contenteditable so it's picked up by the standard focusout→save pipeline.
      Rendered visually invisible; the JS reads/writes textContent.
    -->
    <div id="ls20-config" data-edit="ls20-config" contenteditable="" spellcheck="false" aria-hidden="true"
         style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;left:-9999px;top:0;"></div>

    <!-- Button selector strip — populated by JS -->
    <div class="ls20-mb-selector anim-in" id="ls20-selector"></div>

    <!-- Default carousel (shown when no button selected) -->
    <div class="ls-carousel ls20-car-default" id="ls20CarDefault"
         data-counter="" data-edit="ls20-default-carousel"
         data-track="ls20-multi-buttons:carousel:default" data-autoplay="5000"
         style="flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;">
      <div class="ls-carousel-track">
        <div class="ls-carousel-slide"><img src="" alt=""></div>
      </div>
    </div>

    <!-- Defect carousels — static slots matched to config items by data-defect-id -->
    <div class="ls20-carousels" style="display:contents">
      <div class="ls-carousel ls20-car" data-defect-id="item-0" data-counter="" data-edit="ls20-car-0" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-1" data-counter="" data-edit="ls20-car-1" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-2" data-counter="" data-edit="ls20-car-2" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-3" data-counter="" data-edit="ls20-car-3" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-4" data-counter="" data-edit="ls20-car-4" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-5" data-counter="" data-edit="ls20-car-5" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-6" data-counter="" data-edit="ls20-car-6" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-7" data-counter="" data-edit="ls20-car-7" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-8" data-counter="" data-edit="ls20-car-8" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-9" data-counter="" data-edit="ls20-car-9" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-10" data-counter="" data-edit="ls20-car-10" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
      <div class="ls-carousel ls20-car" data-defect-id="item-11" data-counter="" data-edit="ls20-car-11" style="display:none;flex:1;min-height:0;width:100%;max-width:960px;margin-top:12px;"><div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div></div>
    </div>

  </div><!-- slide-body -->
  </div><!-- slide-layout -->

  <!-- ── Scoped Styles ── -->
  <style>
    .ls20-multi-buttons { }

    /* ── Selector strip ── */
    .ls20-mb-selector {
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      width: 100%; max-width: 960px; flex-shrink: 0;
    }

    /* ── Button ── */
    .ls20-multi-buttons .ls20-btn {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 8px 10px; border-radius: 12px; cursor: pointer;
      background: var(--bg-card); border: 1px solid var(--border);
      transition: all .2s; min-width: 76px; font-family: inherit;
    }
    .ls20-multi-buttons .ls20-btn:hover { border-color: rgba(var(--accent-rgb),.4); background: var(--bg-card-hover); }
    .ls20-multi-buttons .ls20-btn.active {
      border-color: var(--accent); background: rgba(var(--accent-rgb),.12);
      box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.25);
    }
    .ls20-multi-buttons .ls20-btn .ls20-label {
      font-size: 10px; font-weight: 600; letter-spacing: .03em;
      color: var(--text-muted); white-space: nowrap; transition: color .2s;
    }
    .ls20-multi-buttons .ls20-btn.active .ls20-label { color: var(--accent); }

    /* ── Icon variants ── */
    .ls20-multi-buttons .ls20-icon-wrap { position: relative; }
    .ls20-multi-buttons .ls20-icon-sprite {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
      background-image: url('/slides/shared/defect-icons-sprite.png');
      background-size: 200% 1000%; background-repeat: no-repeat;
      transition: background-position .15s;
    }
    .ls20-multi-buttons .ls20-icon-img {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
      object-fit: cover;
    }
    .ls20-multi-buttons .ls20-icon-placeholder {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.06); border: 1.5px dashed rgba(255,255,255,.15);
    }

    /* ── Edit-mode icon overlay ── */
    .ls20-multi-buttons .ls20-icon-edit {
      position: absolute; inset: 0; border-radius: 8px;
      background: rgba(0,0,0,.55); display: flex; align-items: center;
      justify-content: center; opacity: 0; transition: opacity .15s;
      cursor: pointer; font-size: 14px; color: #fff; pointer-events: auto;
    }
    .ls20-multi-buttons .ls20-icon-wrap:hover .ls20-icon-edit { opacity: 1; }

    /* ── Delete button (edit mode) ── */
    .ls20-multi-buttons .ls20-del {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(239,68,68,.85); border: none; cursor: pointer;
      font-size: 12px; line-height: 18px; text-align: center;
      color: #fff; font-weight: 700; padding: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s;
    }
    .ls20-multi-buttons .ls20-btn:hover .ls20-del { opacity: 1; }

    /* ── Add button (edit mode) ── */
    .ls20-multi-buttons .ls20-add-btn {
      border-style: dashed !important;
      border-color: rgba(255,255,255,.2) !important;
      opacity: .65;
    }
    .ls20-multi-buttons .ls20-add-btn:hover { opacity: 1 !important; border-color: rgba(var(--accent-rgb),.5) !important; }
    .ls20-multi-buttons .ls20-add-icon {
      width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: rgba(255,255,255,.4); background: rgba(255,255,255,.04);
    }

    /* ── Label editable ── */
    .ls20-multi-buttons .ls20-label[contenteditable] { outline: none; cursor: text; min-width: 20px; }
    .ls20-multi-buttons .ls20-label[contenteditable]:focus { color: var(--text); }

    /* ── Mobile ── */
    .ls20-multi-buttons .ls20-btn { min-width: 60px; padding: 6px; }
    .ls20-multi-buttons .ls20-btn .ls20-label { font-size: 11px; }
    .ls20-multi-buttons { padding: 52px 16px 80px !important; }
    @media(max-width:768px) { .ls20-multi-buttons .ls-carousel { min-height: 260px; } }

    /* ── Desktop ── */
    @media(min-width:769px) {
      .ls20-multi-buttons .ls20-btn { min-width: 76px; padding: 8px 10px; }
      .ls20-multi-buttons .ls20-btn .ls20-label { font-size: 10px; }
      .ls20-multi-buttons { padding: 52px 80px 0 !important; }
    }
  </style>

  <!-- ── Scoped Script ── -->
  <script>
  (function () {
    var slide   = document.currentScript.closest('[data-slide]');
    var slideId = slide ? slide.dataset.slide : 'ls20-multi-buttons';

    var EDIT_MODE   = !window.PB_READONLY;
    var TOTAL_SLOTS = 12;

    var EMPTY_TRACK = '<div class="ls-carousel-track"><div class="ls-carousel-slide"><img src="" alt=""></div></div>';

    var DEFAULT_CONFIG = [
      { id: 'item-0', label: 'Button 1', spriteRow: 0, icon: null, carouselHtml: EMPTY_TRACK },
      { id: 'item-1', label: 'Button 2', spriteRow: 1, icon: null, carouselHtml: EMPTY_TRACK },
      { id: 'item-2', label: 'Button 3', spriteRow: 2, icon: null, carouselHtml: EMPTY_TRACK }
    ];

    var config     = [];
    var currentIdx = -1;

    var root      = slide || document;
    var selector  = root.querySelector('#ls20-selector');
    var carDefault = root.querySelector('#ls20CarDefault');
    var configEl  = root.querySelector('#ls20-config');

    /* ── Config I/O ── */
    function loadConfig() {
      var raw = configEl ? configEl.textContent.trim() : '';
      try { config = raw ? JSON.parse(raw) : clone(DEFAULT_CONFIG); }
      catch (e) { config = clone(DEFAULT_CONFIG); }
    }

    function persistConfig() {
      if (!configEl) return;
      configEl.textContent = JSON.stringify(config);
      configEl.dispatchEvent(new Event('focusout', { bubbles: true }));
    }

    function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

    /* ── Icon helpers ── */
    function setSpritePos(el, row, active) {
      if (row == null) return;
      el.style.backgroundPosition = (active ? '100%' : '0%') + ' ' + (row / 9 * 100).toFixed(2) + '%';
    }

    function makeIconEl(item) {
      if (item.icon) {
        var img = document.createElement('img');
        img.className = 'ls20-icon-img';
        img.src = item.icon; img.alt = item.label;
        return img;
      }
      if (item.spriteRow != null) {
        var div = document.createElement('div');
        div.className = 'ls20-icon-sprite';
        setSpritePos(div, item.spriteRow, false);
        return div;
      }
      var ph = document.createElement('div');
      ph.className = 'ls20-icon-placeholder';
      ph.textContent = '◈';
      return ph;
    }

    function attachIconPicker(iconWrap, item) {
      var overlay = document.createElement('div');
      overlay.className = 'ls20-icon-edit';
      overlay.setAttribute('data-builder-only', '');
      overlay.title = 'Change icon';
      overlay.innerHTML = '&#9998;';
      iconWrap.appendChild(overlay);

      overlay.addEventListener('click', function (e) {
        e.stopPropagation();
        var input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = function () {
          var file = input.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            window.PBUpload(file.name, ev.target.result)
            .then(function (d) {
              d = { path: d };
              if (!d.path) return;
              item.icon = d.path;
              var old = iconWrap.querySelector('.ls20-icon-sprite,.ls20-icon-img,.ls20-icon-placeholder');
              var fresh = makeIconEl(item);
              if (old) iconWrap.replaceChild(fresh, old); else iconWrap.insertBefore(fresh, overlay);
              persistConfig();
            });
          };
          reader.readAsDataURL(file);
        };
        input.click();
      });
    }

    /* ── Build a single button ── */
    function makeBtn(item, idx) {
      var btn = document.createElement('button');
      btn.className = 'ls20-btn';

      var iconWrap = document.createElement('div');
      iconWrap.className = 'ls20-icon-wrap';
      iconWrap.appendChild(makeIconEl(item));
      if (EDIT_MODE) attachIconPicker(iconWrap, item);
      btn.appendChild(iconWrap);

      var labelEl = document.createElement('span');
      labelEl.className = 'ls20-label';
      labelEl.textContent = item.label;
      labelEl.setAttribute('data-lang-key', slideId + '.btn-' + item.id);
      if (EDIT_MODE) {
        labelEl.contentEditable = 'true';
        labelEl.spellcheck = false;
        labelEl.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); labelEl.blur(); }
        });
        labelEl.addEventListener('blur', function () {
          var v = labelEl.textContent.trim();
          if (v) item.label = v;
          persistConfig();
        });
      }
      btn.appendChild(labelEl);

      if (EDIT_MODE) {
        var delBtn = document.createElement('button');
        delBtn.className = 'ls20-del';
        delBtn.setAttribute('data-builder-only', '');
        delBtn.innerHTML = '&times;';
        delBtn.title = 'Remove button';
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (!confirm('Remove "' + item.label + '"?')) return;
          config.splice(idx, 1);
          renderSelector();
          persistConfig();
        });
        btn.appendChild(delBtn);
      }

      btn.addEventListener('click', function () {
        if (document.activeElement && document.activeElement.isContentEditable) return;
        showDefect(idx);
        if (window.Track) Track.click(slideId, item.label);
      });

      return btn;
    }

    /* ── Render the full selector strip ── */
    function renderSelector() {
      currentIdx = -1;
      selector.innerHTML = '';

      config.forEach(function (item, idx) {
        selector.appendChild(makeBtn(item, idx));
      });

      if (EDIT_MODE) {
        var addBtn = document.createElement('button');
        addBtn.className = 'ls20-btn ls20-add-btn';
        addBtn.setAttribute('data-builder-only', '');
        addBtn.title = 'Add button';

        var addIcon = document.createElement('div');
        addIcon.className = 'ls20-add-icon';
        addIcon.textContent = '+';
        addBtn.appendChild(addIcon);

        var addLabel = document.createElement('span');
        addLabel.className = 'ls20-label';
        addLabel.textContent = 'Add';
        addBtn.appendChild(addLabel);

        addBtn.addEventListener('click', function () {
          var nextSlot = config.length;
          config.push({
            id: 'item-' + nextSlot,
            label: 'Button ' + (config.length + 1),
            spriteRow: null, icon: null,
            carouselHtml: EMPTY_TRACK
          });
          renderSelector();
          persistConfig();
        });

        selector.appendChild(addBtn);
      }

      showDefault();
    }

    function findCar(item) {
      return root.querySelector('.ls20-car[data-defect-id="' + item.id + '"]');
    }

    function showDefault() {
      root.querySelectorAll('.ls20-car').forEach(function (c) { c.style.display = 'none'; });
      currentIdx = -1;
      carDefault.style.display = '';
      if (!carDefault._lsCarouselInit) {
        if (window.Carousel) Carousel.init(carDefault.parentElement || document.body);
        if (window.Lightbox) Lightbox.init(carDefault);
      }
      updateBtnStates();
    }

    function showDefect(idx) {
      if (idx === currentIdx) { showDefault(); return; }
      if (currentIdx >= 0) {
        var prev = findCar(config[currentIdx]);
        if (prev) prev.style.display = 'none';
      }
      carDefault.style.display = 'none';
      currentIdx = idx;
      var car = findCar(config[idx]);
      if (car) {
        car.style.display = '';
        if (car._lsCarouselInit) {
          if (car._lsGoTo) car._lsGoTo(0);
        } else {
          if (window.Carousel) Carousel.init(car.parentElement || document.body);
          if (window.Lightbox) Lightbox.init(car);
        }
      }
      updateBtnStates();
    }

    function updateBtnStates() {
      var btns = selector.querySelectorAll('.ls20-btn:not(.ls20-add-btn)');
      btns.forEach(function (btn, i) {
        var active = i === currentIdx;
        btn.classList.toggle('active', active);
        var sprite = btn.querySelector('.ls20-icon-sprite');
        if (sprite && config[i]) setSpritePos(sprite, config[i].spriteRow, active);
      });
    }

    function applyCarouselsFromConfig() {
      config.forEach(function (item) {
        if (!item.carouselHtml) return;
        var car = root.querySelector('.ls20-car[data-defect-id="' + item.id + '"]');
        if (car) car.innerHTML = item.carouselHtml;
      });
    }

    /* Capture carousel image changes and store in config (capture phase — runs before doSave) */
    document.addEventListener('slide-carousel-save', function (e) {
      var detail  = e.detail || {};
      var editKey = detail.editKey || '';
      var match = editKey.match(/^ls20-car-(\d+)$/);
      if (!match) return;
      var slotIdx  = parseInt(match[1], 10);
      var defectId = 'item-' + slotIdx;
      var btnIdx   = config.findIndex(function (c) { return c.id === defectId; });
      if (btnIdx < 0) return;
      var carEl = root.querySelector('.ls20-car[data-defect-id="' + defectId + '"]');
      if (!carEl) return;
      var trackEl = carEl.querySelector('.ls-carousel-track');
      if (trackEl) {
        var cl = trackEl.cloneNode(true);
        cl.querySelectorAll('[data-builder-only]').forEach(function (n) { n.remove(); });
        cl.querySelectorAll('[data-zoom-init]').forEach(function (n) { n.removeAttribute('data-zoom-init'); });
        cl.querySelectorAll('.ls-carousel-counter,.ls-carousel-btn,.ls-carousel-add,.ls-carousel-del').forEach(function (n) { n.remove(); });
        cl.style.transform = '';
        config[btnIdx].carouselHtml = cl.outerHTML;
      }
      if (configEl) configEl.textContent = JSON.stringify(config);
    }, true);

    /* ── Init ── */
    loadConfig();
    applyCarouselsFromConfig();
    renderSelector();

    setTimeout(function () { if (window.PE && slide) PE.initSlide(slide); }, 0);
  })();
  </script>

</div>

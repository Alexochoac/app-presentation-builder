<div class="slide content ls24-test-simple"
     data-slide="ls24-test-simple"
     data-slide-mode="sequence">

  <div class="slide-logo-row" data-edit="logo-row">
    <img src="/shared/brand/logo.svg" alt="Your Logo">
  </div>

  <div class="slide-layout">
    <header class="slide-head">
      <div class="section-label"
           data-edit="section-label"
           data-lang-key="ls24-test-simple.section-label"
           contenteditable spellcheck="false">Section Label</div>
      <h1 class="slide-title"
          data-edit="headline"
          data-lang-key="ls24-test-simple.headline"
          contenteditable spellcheck="false">Your Headline <span class="blue">Goes Here</span></h1>
      <p class="slide-subtitle"
         data-edit="subtitle"
         data-lang-key="ls24-test-simple.subtitle"
         contenteditable spellcheck="false">A short supporting sentence that describes this slide.</p>
    </header>

    <div class="slide-body">
      <div class="ls-carousel"
           data-edit="main-carousel"
           data-counter=""
           data-autoplay="4000"
           style="flex:1;min-height:0;width:100%;max-width:960px;">
        <div class="ls-carousel-track">
          <div class="ls-carousel-slide">
            <img src="" alt="First image caption" data-zoom>
          </div>
          <div class="ls-carousel-slide">
            <img src="" alt="Second image caption" data-zoom>
          </div>
        </div>
      </div>
    </div>
  </div>

  <style>
    .ls24-test-simple { }
    .ls24-test-simple .slide-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    @media(min-width:769px) {
      .ls24-test-simple .slide-body { padding: 0 80px; }
    }
  </style>

  <script>
  (function () {
    var slide   = document.currentScript.closest('[data-slide]');
    var slideId = slide ? slide.dataset.slide : 'ls24-test-simple';

    setTimeout(function () { if (window.PE && slide) PE.initSlide(slide); }, 0);
  })();
  </script>

</div>

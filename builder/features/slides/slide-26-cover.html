<div class="slide content ls26-cover"
     data-slide="ls26-cover"
     data-slide-mode="sequence">

  <!-- Hero background — full bleed, server injects deck.heroBg -->
  <img class="hero-bg" src="" alt="Hero background">

  <!-- Company logo row — top left -->
  <div class="slide-logo-row ls26-logos" data-edit="logo-row">
    <img src="/shared/brand/logo.svg" alt="Your Logo">
  </div>

  <!-- Customer logo — centered in right half -->
  <div class="ls26-customer-logo" data-edit="customer-logo" data-edit-type="image" title="Click to change logo">
    <button class="ls26-logo-del" data-builder-only="" contenteditable="false" onclick="ls26ClearLogo()" title="Remove logo">&#x2715;</button>
    <img class="ls26-cust-img" src="" alt="Customer Logo" onerror="this.classList.add('ls26-cust-img--missing')">
    <label class="ls26-cust-placeholder" for="ls26-logo-file" title="Click to upload logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span>Customer Logo</span>
      <small>Click to upload</small>
    </label>
    <input type="file" id="ls26-logo-file" accept="image/*" style="display:none;">
  </div>

  <!-- Main content — left half -->
  <div class="ls26-content">
    <div class="ls26-badge"
         data-edit="badge"
         data-lang-key="ls26-cover.badge"
         contenteditable spellcheck="false">Product · Solution</div>
    <h1 class="ls26-headline"
        data-edit="headline"
        data-lang-key="ls26-cover.headline"
        contenteditable spellcheck="false">Your Presentation <span class="ls26-accent">Headline</span></h1>
    <p class="ls26-subheadline"
       data-edit="subheadline"
       data-lang-key="ls26-cover.subheadline"
       contenteditable spellcheck="false">Proposal for [Customer] · [Name], [Title]</p>
  </div>

  <!-- Gallery button -->
  <button class="ls26-gallery-btn" onclick="ls26OpenGallery()" title="Show installation gallery">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
    </svg>
    Gallery
  </button>

  <!-- Gallery overlay -->
  <div class="ls26-gallery-overlay" id="ls26GalleryOverlay" style="display:none;">
    <div class="ls26-gallery-popup">
      <button class="ls26-gallery-close" onclick="ls26CloseGallery()">&#x2715;</button>
      <div class="ls26-car-wrap" id="ls26CarWrap">
        <div class="ls26-car-track" id="ls26CarTrack" data-edit="carousel-track" data-autoplay="7">

          <div class="ls26-car-slide">
            <button class="ls26-car-del" data-builder-only="" contenteditable="false" onclick="ls26DeleteCarSlide(this)">&#x2715;</button>
            <img src="" alt="">
            <div class="ls26-car-caption" contenteditable spellcheck="false">Image caption</div>
            <div class="ls26-car-img-overlay" data-builder-only="" onclick="ls26ChangeCarImage(this)">Change Image</div>
            <button class="ls26-car-move ls26-car-move--l" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,-1)">&#8249;</button>
            <button class="ls26-car-move ls26-car-move--r" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,1)">&#8250;</button>
          </div>

        </div>
        <button class="ls26-car-prev" onclick="ls26CarMove(-1)">&#8249;</button>
        <button class="ls26-car-next" onclick="ls26CarMove(1)">&#8250;</button>
      </div>

      <!-- Thumbnail strip -->
      <div class="ls26-thumb-strip" id="ls26ThumbStrip"></div>

      <!-- Footer — builder only -->
      <div class="ls26-car-footer" data-builder-only="">
        <span class="ls26-autoplay-ctrl">
          Auto <span id="ls26AutoVal" contenteditable spellcheck="false">7</span>s
        </span>
        <div class="ls26-add-btns">
          <button class="ls26-add-btn" onclick="ls26AddImage()">+ Image</button>
          <button class="ls26-add-btn" onclick="ls26AddText()">+ Text</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared file input for carousel image swaps -->
  <input type="file" id="ls26-carousel-file" accept="image/*" style="display:none;">

  <style>
    /* ── Layout ── */
    .ls26-cover {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Hero bg — full bleed */
    .ls26-cover .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Company logo row — inherits absolute top-left from style.css */
    .ls26-cover .slide-logo-row {
      z-index: 2;
    }

    /* ── Customer logo box ── */
    .ls26-customer-logo {
      position: absolute;
      left: 74%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      border: 1px solid rgba(0,0,0,.09);
      border-radius: 20px;
      padding: 20px;
      width: 160px; height: 160px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0,0,0,.14);
    }
    .ls26-customer-logo::after {
      content: 'Change Logo';
      position: absolute; inset: 0; border-radius: 20px;
      background: rgba(0,0,0,.52);
      color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .06em;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .ls26-customer-logo:hover::after { opacity: 1; }
    /* hide change-logo hover and pointer in readonly/preview */
    .ls26-cover.ls26-readonly .ls26-customer-logo { cursor: default; pointer-events: none; }
    .ls26-cover.ls26-readonly .ls26-customer-logo::after { display: none; }
    .ls26-cust-img { width: 90%; height: 90%; object-fit: contain; }
    .ls26-cust-img--missing { display: none; }
    .ls26-cust-img--missing ~ .ls26-cust-placeholder { display: flex; }
    .ls26-cust-placeholder {
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 100%;
      border: 2px dashed rgba(0,0,0,.14); border-radius: 14px;
      cursor: pointer; color: rgba(0,0,0,.38); text-align: center;
      transition: border-color .2s, color .2s;
    }
    .ls26-cust-placeholder:hover { border-color: var(--accent); color: var(--accent); }
    .ls26-cust-placeholder span { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .ls26-cust-placeholder small { font-size: 11px; opacity: .65; }
    .ls26-logo-del {
      position: absolute; top: -8px; right: -8px; z-index: 20;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(180,30,30,.88); border: 1px solid rgba(255,100,100,.35);
      color: #fff; font-size: 11px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; transition: background .2s;
    }
    .ls26-logo-del:hover { background: rgba(220,40,40,1); }
    .ls26-cover.ls26-readonly .ls26-logo-del { display: none; }

    /* ── Text content ── */
    .ls26-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 56px;
      max-width: 52%;
    }
    .ls26-badge {
      font-size: 11px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
    }
    .ls26-headline {
      font-size: clamp(1.8rem, 3.5vw, 3rem); font-weight: 700; line-height: 1.1;
      color: #0d1117; margin: 0 0 20px; max-width: 580px;
    }
    .ls26-accent { color: var(--accent); }
    .ls26-subheadline {
      font-size: 1rem; font-weight: 400;
      color: rgba(0,0,0,.50); margin: 0;
    }

    /* ── Gallery button ── */
    .ls26-gallery-btn {
      position: absolute; bottom: 80px; right: 16px; z-index: 10;
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px; color: rgba(255,255,255,.80);
      font-size: 11px; font-weight: 600; letter-spacing: .06em;
      cursor: pointer; backdrop-filter: blur(8px);
      transition: background .25s, border-color .25s, color .25s;
      font-family: inherit; user-select: none;
    }
    .ls26-gallery-btn:hover { background: rgba(var(--accent-rgb),.35); border-color: var(--accent); color: #fff; }

    /* ── Gallery overlay ── */
    .ls26-gallery-overlay {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.68); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
    }
    .ls26-gallery-popup {
      position: relative;
      background: rgba(10,10,14,.92); border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px; padding: 20px;
      box-shadow: 0 32px 96px rgba(0,0,0,.80);
    }
    .ls26-gallery-close {
      position: absolute; top: -14px; right: -14px;
      min-width: 44px; min-height: 44px; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(40,40,50,.95); border: 1px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.80); font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s; z-index: 5;
    }
    .ls26-gallery-close:hover { background: rgba(255,255,255,.20); color: #fff; }

    /* ── Carousel ── */
    .ls26-car-wrap { position: relative; width: 100%; height: auto; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 24px 80px rgba(0,0,0,.7); }
    .ls26-car-track { display: flex; height: auto; transition: transform .55s cubic-bezier(.4,0,.2,1); }
    .ls26-car-slide { flex: 0 0 100%; width: 100%; height: auto; position: relative; background: #111; }
    .ls26-car-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; pointer-events: none; }
    .ls26-car-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 18px; background: linear-gradient(transparent,rgba(0,0,0,.75)); color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-align: center; }
    .ls26-car-caption:focus { outline: none; }

    .ls26-car-prev, .ls26-car-next { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.50); border: 1px solid rgba(255,255,255,.20); color: #fff; font-size: 26px; line-height: 1; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s; z-index: 5; }
    .ls26-car-prev { left: 12px; }
    .ls26-car-next { right: 12px; }
    .ls26-car-prev:hover, .ls26-car-next:hover { background: rgba(var(--accent-rgb),.60); }

    /* Builder controls */
    .ls26-car-img-overlay { position: absolute; inset: 0; z-index: 15; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .06em; opacity: 0; transition: opacity .2s; cursor: pointer; }
    .ls26-car-slide:hover .ls26-car-img-overlay { opacity: 1; }
    .ls26-car-move { position: absolute; bottom: 10px; z-index: 20; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.30); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s, background .2s; font-family: inherit; }
    .ls26-car-slide:hover .ls26-car-move { opacity: 1; }
    .ls26-car-move--l { right: 48px; }
    .ls26-car-move--r { right: 12px; }
    .ls26-car-move:hover { background: rgba(var(--accent-rgb),.65); }

    .ls26-car-del { position: absolute; top: 8px; left: 8px; z-index: 22; width: 22px; height: 22px; border-radius: 50%; background: rgba(180,30,30,.85); border: 1px solid rgba(255,100,100,.35); color: #fff; font-size: 11px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; transition: background .2s; }
    .ls26-car-del:hover { background: rgba(220,40,40,1); }

    /* Text slide */
    .ls26-car-slide--text { flex: 0 0 100%; background: linear-gradient(135deg,#0d1117 0%,#1a1f2e 100%); display: flex; align-items: center; justify-content: center; }
    .ls26-stat-block { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 32px; width: 100%; text-align: center; }
    .ls26-stat-block .stat-number { font-size: clamp(48px,8vw,88px); font-weight: 900; letter-spacing: -.03em; line-height: 1; background: linear-gradient(135deg,var(--accent),var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: block; }
    .ls26-stat-block .stat-label { font-size: 15px; color: var(--text-muted); margin-top: 8px; font-weight: 500; }
    [contenteditable]:focus { outline: none; }

    /* Thumbnail strip */
    .ls26-thumb-strip { display: flex; gap: 6px; padding: 10px 0 4px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
    .ls26-thumb { flex: 0 0 72px; height: 46px; border-radius: 8px; border: 2px solid rgba(255,255,255,.12); background: #222; background-size: cover; background-position: center; cursor: pointer; transition: border-color .2s, opacity .2s; position: relative; overflow: hidden; user-select: none; }
    .ls26-thumb:hover { border-color: rgba(255,255,255,.35); }
    .ls26-thumb--active { border-color: var(--accent) !important; }
    .ls26-thumb--dragging { opacity: .4; }
    .ls26-thumb--text { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#0d1117,#1a1f2e); font-size: 9px; font-weight: 700; letter-spacing: .06em; color: var(--accent); text-align: center; padding: 4px; text-transform: uppercase; }
    .ls26-thumb-dragover { border-color: var(--accent); border-style: dashed; }

    /* Footer */
    .ls26-car-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px 0; }
    .ls26-autoplay-ctrl { font-size: 11px; color: rgba(255,255,255,.40); font-weight: 600; letter-spacing: .06em; user-select: none; }
    .ls26-autoplay-ctrl span { color: rgba(255,255,255,.65); min-width: 14px; display: inline-block; text-align: center; border-bottom: 1px solid rgba(255,255,255,.2); }
    .ls26-autoplay-ctrl span:focus { outline: none; border-color: var(--accent); color: #fff; }
    .ls26-add-btns { display: flex; gap: 6px; }
    .ls26-add-btn { font-size: 11px; font-weight: 700; letter-spacing: .05em; padding: 5px 12px; border-radius: 20px; cursor: pointer; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); color: rgba(255,255,255,.6); font-family: inherit; transition: background .2s, border-color .2s, color .2s; }
    .ls26-add-btn:hover { background: rgba(var(--accent-rgb),.15); border-color: var(--accent); color: var(--accent); }

    /* ── Desktop ── */
    @media(min-width:769px) {
      .ls26-customer-logo { width: clamp(150px,15vw,240px); height: clamp(150px,15vw,240px); padding: 28px; }
      .ls26-gallery-btn { bottom: 64px; right: 32px; }
      .ls26-car-wrap { width: 760px; height: 460px; }
      .ls26-car-track { height: 460px; }
      .ls26-car-slide { flex: 0 0 760px; width: 760px; height: 460px; }
      .ls26-car-slide img { object-fit: contain; }
      .ls26-car-slide--text { flex: 0 0 760px; }
    }
  </style>

  <!-- Gallery JS — self-contained -->
  <script>
  (function () {
    var idx       = 0;
    var autoTimer = null;
    var targetSlide = null;

    function getSlides()    { return Array.from(document.querySelectorAll('#ls26CarTrack > .ls26-car-slide')); }
    function getWrapWidth() { return document.getElementById('ls26CarWrap').offsetWidth; }
    function getAutoplay()  { return (parseInt(document.getElementById('ls26CarTrack').getAttribute('data-autoplay')) || 7) * 1000; }

    function goTo(i) {
      var slides = getSlides();
      idx = Math.max(0, Math.min(slides.length - 1, i));
      document.getElementById('ls26CarTrack').style.transform = 'translateX(' + (idx * -getWrapWidth()) + 'px)';
      ls26UpdateThumbs();
      var caption = slides[idx] ? slides[idx].querySelector('.ls26-car-caption') : null;
      var name = caption ? caption.textContent.trim().toLowerCase().replace(/\s+/g, '-') : 'item-' + (idx + 1);
      if (window.umami) umami.track('cover-gallery:' + name);
    }

    function startAutoplay() {
      clearInterval(autoTimer);
      autoTimer = setInterval(function () {
        var count = getSlides().length;
        goTo(idx < count - 1 ? idx + 1 : 0);
      }, getAutoplay());
    }

    function stopAutoplay() { clearInterval(autoTimer); }

    var wrap = document.getElementById('ls26CarWrap');
    wrap.addEventListener('mouseenter', stopAutoplay);
    wrap.addEventListener('mouseleave', function () {
      if (document.getElementById('ls26GalleryOverlay').style.display !== 'none') startAutoplay();
    });

    window.ls26OpenGallery = function () {
      var overlay = document.getElementById('ls26GalleryOverlay');
      overlay.style.display = 'flex';
      if (window.PB_READONLY) {
        overlay.querySelectorAll('[data-builder-only]').forEach(function (el) { el.style.display = 'none'; });
      }
      goTo(0);
      ls26BuildThumbs();
      startAutoplay();
      if (window.umami) umami.track(document.querySelector('[data-slide="ls26-cover"]') ? 'ls26-cover' : 'cover', { component: 'gallery', action: 'open' });
    };

    window.ls26CloseGallery = function () {
      document.getElementById('ls26GalleryOverlay').style.display = 'none';
      stopAutoplay();
    };

    window.ls26CarMove = function (dir) { goTo(idx + dir); };

    // ── Thumbnail strip ────────────────────────────────────────────────────
    window.ls26BuildThumbs = function () {
      var strip  = document.getElementById('ls26ThumbStrip');
      var slides = getSlides();
      strip.innerHTML = '';
      slides.forEach(function (slide, i) {
        var thumb = document.createElement('div');
        thumb.className = 'ls26-thumb' + (i === idx ? ' ls26-thumb--active' : '');
        thumb.setAttribute('data-index', i);
        var img = slide.querySelector('img');
        if (img && img.src) {
          thumb.style.backgroundImage = 'url(' + img.src + ')';
        } else {
          thumb.classList.add('ls26-thumb--text');
          var lbl = slide.querySelector('.section-label');
          thumb.textContent = lbl ? lbl.textContent.substring(0, 14) : 'Text';
        }
        thumb.addEventListener('click', function () { goTo(i); });
        thumb.draggable = true;
        thumb.addEventListener('dragstart', function (e) {
          e.dataTransfer.setData('text/plain', String(i));
          setTimeout(function () { thumb.classList.add('ls26-thumb--dragging'); }, 0);
        });
        thumb.addEventListener('dragend', function () { thumb.classList.remove('ls26-thumb--dragging'); });
        thumb.addEventListener('dragover', function (e) { e.preventDefault(); thumb.classList.add('ls26-thumb-dragover'); });
        thumb.addEventListener('dragleave', function () { thumb.classList.remove('ls26-thumb-dragover'); });
        thumb.addEventListener('drop', function (e) {
          e.preventDefault();
          thumb.classList.remove('ls26-thumb-dragover');
          var from = parseInt(e.dataTransfer.getData('text/plain'));
          var to   = i;
          if (from === to) return;
          var track     = document.getElementById('ls26CarTrack');
          var allSlides = getSlides();
          var fromSlide = allSlides[from];
          var toSlide   = allSlides[to];
          from < to ? track.insertBefore(fromSlide, toSlide.nextSibling)
                    : track.insertBefore(fromSlide, toSlide);
          goTo(0); ls26BuildThumbs(); ls26SaveCarousel();
        });
        strip.appendChild(thumb);
      });
      ls26EnsureDeleteBtns();
    };

    function ls26EnsureDeleteBtns() {
      if (window.PB_READONLY) return;
      getSlides().forEach(function (slide) {
        if (!slide.querySelector('.ls26-car-del')) {
          var btn = document.createElement('button');
          btn.className = 'ls26-car-del';
          btn.title = 'Remove';
          btn.setAttribute('data-builder-only', '');
          btn.setAttribute('contenteditable', 'false');
          btn.setAttribute('onclick', 'ls26DeleteCarSlide(this)');
          btn.textContent = '✕';
          slide.insertBefore(btn, slide.firstChild);
        }
      });
    }

    window.ls26DeleteCarSlide = function (btn) {
      var slide = btn.closest('.ls26-car-slide');
      if (!slide) return;
      var all = getSlides();
      if (all.length <= 1) {
        slide.innerHTML = '<button class="ls26-car-del" data-builder-only="" contenteditable="false">&#x2715;</button>'
          + '<img src="" alt="">'
          + '<div class="ls26-car-caption" contenteditable spellcheck="false">Image caption</div>'
          + '<div class="ls26-car-img-overlay" data-builder-only="" onclick="ls26ChangeCarImage(this)">Change Image</div>'
          + '<button class="ls26-car-move ls26-car-move--l" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,-1)">&#8249;</button>'
          + '<button class="ls26-car-move ls26-car-move--r" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,1)">&#8250;</button>';
        ls26BuildThumbs(); ls26SaveCarousel(); goTo(0); return;
      }
      slide.remove();
      goTo(0); ls26BuildThumbs(); ls26SaveCarousel();
    };

    window.ls26UpdateThumbs = function () {
      document.querySelectorAll('#ls26ThumbStrip .ls26-thumb').forEach(function (t, i) {
        t.classList.toggle('ls26-thumb--active', i === idx);
      });
    };

    // ── Autoplay value (builder only) ────────────────────────────────────
    var autoValEl = document.getElementById('ls26AutoVal');
    if (autoValEl) {
      autoValEl.addEventListener('input', function () {
        var val = parseInt(autoValEl.textContent) || 7;
        document.getElementById('ls26CarTrack').setAttribute('data-autoplay', val);
        startAutoplay();
      });
      autoValEl.addEventListener('blur', function () { ls26SaveCarousel(); });
    }

    // ── Change carousel image ─────────────────────────────────────────────
    window.ls26ChangeCarImage = function (overlay) {
      targetSlide = overlay.closest('.ls26-car-slide');
      document.getElementById('ls26-carousel-file').click();
    };

    document.getElementById('ls26-carousel-file').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file || !targetSlide) return;
      var img = targetSlide.querySelector('img');
      img.src = URL.createObjectURL(file);
      var reader = new FileReader();
      reader.onload = function (ev) {
        fetch('/api/upload-image', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, data: ev.target.result })
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.path) { img.src = data.path; ls26BuildThumbs(); ls26SaveCarousel(); }
        });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    // ── Reorder via buttons ───────────────────────────────────────────────
    window.ls26MoveCarSlide = function (btn, dir) {
      var slide = btn.closest('.ls26-car-slide');
      var all   = getSlides();
      var i     = all.indexOf(slide);
      var swap  = all[i + dir];
      if (!swap) return;
      var track = document.getElementById('ls26CarTrack');
      dir === 1 ? track.insertBefore(swap, slide) : track.insertBefore(slide, swap);
      goTo(0); ls26BuildThumbs(); ls26SaveCarousel();
    };

    // ── Add items ─────────────────────────────────────────────────────────
    window.ls26AddImage = function () {
      if (window.PB_READONLY) return;
      var input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.style.display = 'none';
      document.body.appendChild(input);
      input.addEventListener('change', function (e) {
        document.body.removeChild(input);
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          fetch('/api/upload-image', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, data: ev.target.result })
          })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.path) {
              document.getElementById('ls26CarTrack').appendChild(ls26MakeImageSlide(data.path, file.name.replace(/\.[^.]+$/, '')));
              var newIdx = getSlides().length - 1;
              ls26BuildThumbs(); ls26SaveCarousel(); goTo(newIdx);
            }
          });
        };
        reader.readAsDataURL(file);
      });
      input.click();
    };

    window.ls26AddText = function () {
      if (window.PB_READONLY) return;
      document.getElementById('ls26CarTrack').appendChild(ls26MakeTextSlide());
      ls26BuildThumbs(); ls26SaveCarousel();
      goTo(getSlides().length - 1);
    };

    function ls26MakeImageSlide(src, caption) {
      var d = document.createElement('div');
      d.className = 'ls26-car-slide';
      d.innerHTML = '<button class="ls26-car-del" data-builder-only="" contenteditable="false" onclick="ls26DeleteCarSlide(this)">&#x2715;</button>'
        + '<img src="' + src + '" alt="' + caption + '">'
        + '<div class="ls26-car-caption" contenteditable spellcheck="false">' + caption + '</div>'
        + '<div class="ls26-car-img-overlay" data-builder-only="" onclick="ls26ChangeCarImage(this)">Change Image</div>'
        + '<button class="ls26-car-move ls26-car-move--l" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,-1)">&#8249;</button>'
        + '<button class="ls26-car-move ls26-car-move--r" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,1)">&#8250;</button>';
      return d;
    }

    function ls26MakeTextSlide() {
      var d = document.createElement('div');
      d.className = 'ls26-car-slide ls26-car-slide--text';
      d.innerHTML = '<button class="ls26-car-del" data-builder-only="" contenteditable="false" onclick="ls26DeleteCarSlide(this)">&#x2715;</button>'
        + '<div class="ls26-stat-block">'
        + '<div class="section-label" contenteditable spellcheck="false">Section Title</div>'
        + '<span class="stat-number" contenteditable spellcheck="false">Key Fact</span>'
        + '<div class="stat-label" contenteditable spellcheck="false">Description text here</div>'
        + '</div>'
        + '<button class="ls26-car-move ls26-car-move--l" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,-1)">&#8249;</button>'
        + '<button class="ls26-car-move ls26-car-move--r" data-builder-only="" contenteditable="false" onclick="ls26MoveCarSlide(this,1)">&#8250;</button>';
      return d;
    }

    // ── Save carousel ─────────────────────────────────────────────────────
    function ls26SaveCarousel() {
      var autoVal = parseInt(document.getElementById('ls26CarTrack').getAttribute('data-autoplay')) || 7;
      var clone   = document.getElementById('ls26CarTrack').cloneNode(true);
      clone.querySelectorAll('.ls26-car-del').forEach(function (el) { el.remove(); });
      document.dispatchEvent(new CustomEvent('slide-carousel-save', {
        detail: {
          editKey:  'carousel-track',
          html:     clone.innerHTML,
          autoplay: String(autoVal)
        }
      }));
    }

    window.ls26SaveCarousel = ls26SaveCarousel;

    // ── Delete delegation — on the overlay (outside contenteditable track) ──
    document.getElementById('ls26GalleryOverlay').addEventListener('click', function (e) {
      if (window.PB_READONLY) return;
      var btn = e.target.closest('.ls26-car-del');
      if (!btn) return;
      e.stopPropagation();
      ls26DeleteCarSlide(btn);
    });

  })();

  // ── Mark logo as missing on init if src is empty ─────────────────────
  (function () {
    var img       = document.querySelector('.ls26-cust-img');
    if (img && !img.getAttribute('src')) {
      img.classList.add('ls26-cust-img--missing');
    }
  })();

  // ── Clear logo (called by inline onclick on delete button) ────────────
  window.ls26ClearLogo = function () {
    if (window.PB_READONLY) return;
    var container = document.querySelector('.ls26-customer-logo');
    var img       = container && container.querySelector('.ls26-cust-img');
    if (!img) return;
    img.removeAttribute('src');
    img.classList.add('ls26-cust-img--missing');
    container.style.background = '#fff';
    document.dispatchEvent(new CustomEvent('slide-image-change', {
      detail: { editKey: 'customer-logo', src: '' }
    }));
  };

  // ── Smart background detection for customer logo ──────────────────────
  function ls26DetectLogoBg(img) {
    try {
      var container = img.closest('.ls26-customer-logo');
      if (!container) return;
      var w = img.naturalWidth  || 100;
      var h = img.naturalHeight || 100;
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      var size = Math.max(1, Math.round(Math.min(w, h) * 0.05));
      var top    = ctx.getImageData(0, 0, w, size).data;
      var bottom = ctx.getImageData(0, h - size, w, size).data;
      var left   = ctx.getImageData(0, 0, size, h).data;
      var right  = ctx.getImageData(w - size, 0, size, h).data;
      var r = 0, g = 0, b = 0, a = 0, count = 0;
      [top, bottom, left, right].forEach(function (d) {
        for (var i = 0; i < d.length; i += 4) {
          r += d[i]; g += d[i+1]; b += d[i+2]; a += d[i+3]; count++;
        }
      });
      if (count === 0) return;
      r = Math.round(r / count); g = Math.round(g / count);
      b = Math.round(b / count); a = Math.round(a / count);
      container.style.background = (a < 30) ? '#fff' : 'rgb(' + r + ',' + g + ',' + b + ')';
    } catch (e) { /* cross-origin or tainted canvas */ }
  }

  (function () {
    var img = document.querySelector('.ls26-cust-img');
    if (!img) return;
    if (img.complete && img.naturalWidth) { ls26DetectLogoBg(img); }
    else { img.addEventListener('load', function () { ls26DetectLogoBg(img); }); }
  })();

  // ── Customer logo upload ───────────────────────────────────────────────
  (function () {
    var input     = document.getElementById('ls26-logo-file');
    var container = document.querySelector('.ls26-customer-logo');
    if (!input || !container) return;

    container.addEventListener('click', function (e) {
      if (window.PB_READONLY) return;
      if (e.target.closest('.ls26-logo-del')) return; // handled by inline onclick
      input.click();
    });

    input.addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var img = document.querySelector('.ls26-cust-img');
      img.src = URL.createObjectURL(file);
      img.classList.remove('ls26-cust-img--missing');
      img.addEventListener('load', function onNewLoad() {
        ls26DetectLogoBg(img);
        img.removeEventListener('load', onNewLoad);
      });
      var reader = new FileReader();
      reader.onload = function (ev) {
        fetch('/api/upload-image', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, data: ev.target.result })
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.path) {
            img.src = data.path;
            document.dispatchEvent(new CustomEvent('slide-image-change', {
              detail: { editKey: 'customer-logo', src: data.path }
            }));
          }
        });
      };
      reader.readAsDataURL(file);
    });
  })();

  // ── Slide init ────────────────────────────────────────────────────────
  (function () {
    var slide = document.currentScript.closest('[data-slide]');
    if (window.PB_READONLY) slide.classList.add('ls26-readonly');
    setTimeout(function () { if (window.PE) PE.initSlide(slide); }, 0);
  })();
  </script>

</div>

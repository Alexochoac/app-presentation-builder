<div class="slide content template14-cta pb-responsive" data-slide="template14-cta" data-slide-mode="sequence">
  <img class="cta-bg" src="/slides/uploads/image112.png" alt="" aria-hidden="true">
  <div class="slide-logo-row" data-edit="logo-row" data-managed><img src="/shared/brand/logo.svg" alt="Put A Presentation"></div>
  <div class="slide-layout">
    <header class="slide-head">
      <div class="section-label" data-edit="section-label" contenteditable="" spellcheck="false">Next Steps</div>
      <h1 class="slide-title" data-edit="headline" contenteditable="" spellcheck="false">Ready to <span class="blue">get started?</span></h1>
      <div class="divider"></div>
    </header>
    <div class="slide-body">
      <div class="cta-box anim-in">
        <p data-edit="intro" contenteditable="" spellcheck="false">A short paragraph introducing the next step you propose to the customer.</p>
        <div class="cta-steps">
          <div class="cta-step"><div class="step-num">1</div><span data-edit="step1" contenteditable="" spellcheck="false">First step in the process</span></div>
          <div class="cta-step"><div class="step-num">2</div><span data-edit="step2" contenteditable="" spellcheck="false">Second step in the process</span></div>
          <div class="cta-step"><div class="step-num">3</div><span data-edit="step3" contenteditable="" spellcheck="false">Third step in the process</span></div>
        </div>
        <div class="cta-contact">
          <div class="cta-contact-name">
            <strong data-edit="contact-name" contenteditable="" spellcheck="false">Contact Name</strong>
            <span class="cta-contact-role" data-edit="contact-title" contenteditable="" spellcheck="false">Job Title</span>
            <span class="cta-contact-addr" data-edit="contact-addr" contenteditable="" spellcheck="false">Street · City · Country</span>
            <span class="cta-contact-phone" data-edit="contact-phone" contenteditable="" spellcheck="false" data-placeholder="WhatsApp number — e.g. +43 664 123 45678">+00 000 000 000</span>
          </div>
          <div class="cta-contact-btns">
            <a class="cta-btn-wa" href="#" target="_blank" rel="noopener">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"></path><path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.554 4.103 1.523 5.83L.057 23.25a.75.75 0 0 0 .918.919l5.42-1.466A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.694 9.694 0 0 1-4.946-1.355l-.354-.212-3.658.989.989-3.658-.212-.354A9.694 9.694 0 0 1 2.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"></path></svg>
              WhatsApp
            </a>
            <a class="cta-btn-email" href="#">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
              <span data-edit="contact-email" contenteditable="" spellcheck="false" data-placeholder="you@example.com">name@example.com</span>
            </a>
          </div>
          <div class="cta-contact-warn" data-builder-only hidden></div>
        </div>
      </div>
    </div>
  </div>

  <style>
    /* Responsive model comes from the shared `pb-responsive` root class (see style.css). */
    .template14-cta .cta-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.06; pointer-events:none; z-index:0; }
    .template14-cta .cta-box { display:flex; flex-direction:column; padding-bottom:24px; max-width:var(--pb-content-max); width:100%; text-align:left; }

    .cta-contact {
      display:flex; flex-direction:column; align-items:flex-start; gap:14px;
      margin-top:24px; padding-top:20px;
      border-top:1px solid rgba(var(--accent-rgb),.2);
      flex-wrap:wrap;
    }
    .cta-contact-name { display:flex; flex-direction:column; gap:3px; }
    .cta-contact-name strong { font-size:15px; color:var(--text); }
    .cta-contact-role { font-size:13px; color:var(--text-muted); }
    .cta-contact-addr, .cta-contact-phone { font-size:12px; color:var(--text-muted); opacity:.7; }
    .cta-contact-btns { display:flex; flex-direction:column; gap:10px; }

    .cta-btn-wa, .cta-btn-email {
      display:inline-flex; align-items:center; gap:10px;
      padding:14px 20px; border-radius:100px; min-height:44px;
      font-size:14px; font-weight:600; text-decoration:none;
      transition:all .2s; white-space:nowrap;
    }
    /* Builder-only in-field placeholder when the phone is blank. The `cta-phone-empty` class is
       toggled by the script (contenteditable :empty misfires once a stray <br> is left); gated by
       [contenteditable], which the publisher strips, so it never shows in the finished deck. */
    .cta-contact-phone[contenteditable].cta-phone-empty::before,
    .cta-btn-email [contenteditable].cta-email-empty::before { content:attr(data-placeholder); color:var(--text-muted); opacity:.6; }
    /* Contact buttons disabled + a builder-only warning when their field is empty. The email button
       keeps pointer-events (its address is edited inline); dropping its href is enough to disable it. */
    .cta-btn-wa--off { opacity:.45; pointer-events:none; }
    .cta-btn-email--off { opacity:.55; }
    .cta-contact-warn { margin-top:8px; font-size:12px; font-weight:600; color:var(--accent); display:flex; align-items:center; gap:6px; }
    .cta-contact-warn[hidden] { display:none; }
    /* WhatsApp brand green — intentionally fixed, NOT a theme color (do not convert to a var) */
    .cta-btn-wa { background:rgba(37,211,102,.15); border:1px solid rgba(37,211,102,.35); color:#25d366; }
    .cta-btn-wa:hover { background:rgba(37,211,102,.25); border-color:rgba(37,211,102,.6); }
    .cta-btn-email { background:rgba(var(--accent-rgb),.12); border:1px solid rgba(var(--accent-rgb),.3); color:var(--accent); }
    .cta-btn-email:hover { background:rgba(var(--accent-rgb),.22); border-color:rgba(var(--accent-rgb),.55); }

    @media(min-width:769px){
      .cta-contact { flex-direction:row; align-items:center; gap:20px; }
      .cta-btn-wa, .cta-btn-email { font-size:13px; padding:10px 20px; min-height:unset; }
    }
  </style>

  <script>
  (function () {
    var slide   = document.currentScript.closest('.slide');
    var slideId = window.Track ? Track.slideId(slide) : 'template14-cta';

    // Keep the mailto: and wa.me links in sync with the editable contact fields.
    function sync() {
      // Email — mailto link + in-field placeholder + disabled state when blank
      var emailEl  = slide.querySelector('[data-edit="contact-email"]');
      var emailBtn = slide.querySelector('.cta-btn-email');
      var emailRaw = emailEl ? emailEl.textContent.trim() : '';
      if (emailEl) emailEl.classList.toggle('cta-email-empty', !emailRaw);
      if (emailBtn) {
        if (emailRaw) { emailBtn.href = 'mailto:' + emailRaw; emailBtn.classList.remove('cta-btn-email--off'); }
        else          { emailBtn.removeAttribute('href');     emailBtn.classList.add('cta-btn-email--off'); }
      }

      // WhatsApp — wa.me link (digits only) + in-field placeholder + disabled state when blank
      var phoneEl = slide.querySelector('[data-edit="contact-phone"]');
      var waBtn   = slide.querySelector('.cta-btn-wa');
      var raw = phoneEl ? phoneEl.textContent.trim() : '';
      var p   = raw.replace(/\D/g, '');
      if (phoneEl) phoneEl.classList.toggle('cta-phone-empty', !raw);
      if (waBtn) {
        if (p) { waBtn.href = 'https://wa.me/' + p; waBtn.classList.remove('cta-btn-wa--off'); }
        else   { waBtn.removeAttribute('href');     waBtn.classList.add('cta-btn-wa--off'); }
      }

      // One builder-only warning naming whichever contact is missing
      var warn = slide.querySelector('.cta-contact-warn');
      if (warn) {
        var missing = [];
        if (!p)        missing.push('a WhatsApp number');
        if (!emailRaw) missing.push('an email');
        if (missing.length) { warn.textContent = '⚠ Add ' + missing.join(' and ') + " above — the matching button won't work without it."; warn.hidden = false; }
        else warn.hidden = true;
      }
    }
    sync();
    slide.querySelectorAll('[data-edit="contact-email"],[data-edit="contact-phone"]').forEach(function (el) {
      el.addEventListener('input', sync);
    });

    // Tracking — via the Track helper only (never raw umami.track()).
    var waBtn = slide.querySelector('.cta-btn-wa');
    if (waBtn) waBtn.addEventListener('click', function () { if (window.Track) Track.click(slideId, 'whatsapp'); });
    var emailBtn = slide.querySelector('.cta-btn-email');
    if (emailBtn) emailBtn.addEventListener('click', function () { if (window.Track) Track.click(slideId, 'email'); });

    setTimeout(function () { if (window.PE) PE.initSlide(slide); }, 0);
  })();
  </script>
</div>

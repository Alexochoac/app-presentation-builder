<div class="slide hero template01-cover"
     data-slide="template01-cover"
     data-slide-mode="sequence">

  <!-- Full-bleed background — server injects deck.heroBg at serve time (injectDeckBranding targets img.hero-bg) -->
  <img class="hero-bg" src="" alt="Hero background">
  <div class="hero-overlay"></div>

  <!-- Brand logos — server injects live deck logos into this slot (withLiveLogos → logo-row) -->
  <div class="slide-logo-row" data-edit="logo-row" data-managed>
    <img src="/shared/brand/logo.svg" alt="Your Logo">
  </div>

  <!-- Credit line (top-right) -->
  <span class="softsolution-credit"
        data-edit="credit"
        contenteditable spellcheck="false">by YourBrand.com</span>

  <!-- Customer logo uploader — the one cover-unique feature (positioning is scoped, never themed) -->
  <div class="template01-cover-customer-logo"
       data-edit="customer-logo"
       data-edit-type="image"
       title="Click to change logo">
    <button class="template01-cover-logo-del" data-builder-only=""
            title="Remove logo" onclick="template01CoverDeleteLogo()">✕</button>
    <img class="template01-cover-cust-img" src="" alt="Customer Logo"
         onerror="this.classList.add('template01-cover-cust-img--missing')">
    <label class="template01-cover-cust-placeholder">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span>Customer Logo</span>
      <small>Click to upload</small>
    </label>
  </div>
  <!-- File input lives OUTSIDE the data-edit container so its change event never dirties the slot -->
  <input type="file" id="template01-cover-logo-file" accept="image/*" data-builder-only="" style="display:none;">

  <!-- Main hero content — composed from the standard hero scaffold (.hero-content / .brand-badge / .blue) -->
  <div class="hero-content">
    <div class="brand-badge"
         data-edit="badge"
         contenteditable spellcheck="false">Product · Solution</div>
    <h1 data-edit="headline"
        contenteditable spellcheck="false">Your Presentation <span class="blue">Headline</span></h1>
    <h2 data-edit="subheadline"
        contenteditable spellcheck="false">Proposal for [Customer] · [Name], [Title]</h2>
  </div>

  <style>
    /* Only the customer-logo uploader needs scoped rules — unique positioning a theme never touches.
       Every visible surface is driven by theme variables (--logo-bg/-border/-radius, --text-muted). */
    .template01-cover-customer-logo {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--logo-bg);
      border: 1px solid var(--logo-border);
      border-radius: var(--logo-radius);
      padding: 16px;
      width: 100px;
      height: 100px;
      margin: 8px auto 0;
      cursor: pointer;
    }
    .template01-cover-cust-img { width: 90%; height: 90%; object-fit: contain; }
    .template01-cover-cust-img--missing { display: none; }
    .template01-cover-cust-img--missing ~ .template01-cover-cust-placeholder { display: flex; }
    .template01-cover-cust-placeholder {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 100%;
      border: 2px dashed var(--logo-border);
      border-radius: calc(var(--logo-radius) - 4px);
      color: var(--text-muted);
      text-align: center;
      cursor: pointer;
    }
    .template01-cover-cust-placeholder span { font-size: 11px; font-weight: 700; }
    .template01-cover-cust-placeholder small { font-size: 9px; opacity: .65; }
    /* Delete button — builder-only control, stripped from output, intentionally not themed */
    .template01-cover-logo-del {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(180,30,30,.85);
      border: none;
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    .template01-cover-readonly .template01-cover-customer-logo { cursor: default; }

    @media (min-width: 769px) {
      .template01-cover-customer-logo {
        position: absolute;
        left: 75%;
        top: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        width: clamp(140px, 15vw, 240px);
        height: clamp(140px, 15vw, 240px);
        padding: 24px;
      }
    }
  </style>

  <script>
  (function () {
    var slide   = document.currentScript.closest('[data-slide]');
    var slideId = window.Track ? Track.slideId(slide) : (slide ? slide.getAttribute('data-slide') : '');

    /* Readonly setup */
    if (window.PB_READONLY) slide.classList.add('template01-cover-readonly');

    /* Customer logo upload (cover-unique feature) */
    var logoContainer = slide.querySelector('.template01-cover-customer-logo');
    var logoInput     = slide.querySelector('#template01-cover-logo-file');
    var custImg       = slide.querySelector('.template01-cover-cust-img');

    /* Placeholder shows only when no logo is set; a restored/uploaded src shows the image */
    if (custImg && !custImg.getAttribute('src')) {
      custImg.classList.add('template01-cover-cust-img--missing');
    }

    if (logoContainer && logoInput) {
      logoContainer.addEventListener('click', function (e) {
        if (window.PB_READONLY) return;
        if (e.target.closest('.template01-cover-logo-del')) return; // delete button handles its own click
        logoInput.click();
      });

      logoInput.addEventListener('change', function (e) {
        if (window.PB_READONLY) return;
        var file = e.target.files[0];
        if (!file) return;
        var img = slide.querySelector('.template01-cover-cust-img');
        img.src = URL.createObjectURL(file);
        img.classList.remove('template01-cover-cust-img--missing');
        var reader = new FileReader();
        reader.onload = function (ev) {
          fetch('/api/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, data: ev.target.result })
          })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.path) {
              img.src = data.path;
              document.dispatchEvent(new CustomEvent('slide-image-change', {
                detail: { editKey: 'customer-logo', src: data.path }
              }));
            }
          });
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });
    }

    window.template01CoverDeleteLogo = function () {
      if (window.PB_READONLY) return;
      var img = slide.querySelector('.template01-cover-cust-img');
      img.src = '';
      img.classList.add('template01-cover-cust-img--missing');
      document.dispatchEvent(new CustomEvent('slide-image-change', {
        detail: { editKey: 'customer-logo', src: '' }
      }));
    };

    setTimeout(function () { if (window.PE) PE.initSlide(slide); }, 0);
  })();
  </script>

</div>

<div class="slide content ls25-before-after"
     data-slide="ls25-before-after"
     data-slide-mode="sequence">

  <!-- Logo row -->
  <div class="slide-logo-row" data-edit="logo-row">
    <img src="/shared/brand/logo.svg" alt="Your Logo">
  </div>

  <div class="slide-layout">
    <header class="slide-head">
      <div class="section-label"
           data-edit="section-label"
           data-lang-key="ls25-before-after.section-label"
           contenteditable spellcheck="false">Results & Comparison</div>
      <h1 class="slide-title"
          data-edit="headline"
          data-lang-key="ls25-before-after.headline"
          contenteditable spellcheck="false">Before &amp; After — <span class="ls25-accent">See the Difference</span></h1>
      <p class="slide-subtitle"
         data-edit="subtitle"
         data-lang-key="ls25-before-after.subtitle"
         contenteditable spellcheck="false">Drag the handle or switch tabs to explore real results across different use cases.</p>
      <div class="divider"></div>
    </header>

    <div class="slide-body">

      <!-- Tabs wrapper -->
      <div class="ls-tabs" data-edit="tabs" data-track="ls25-before-after:tabs"
           style="flex:1;min-height:0;width:100%;">

        <div class="ls-tab-list">
          <button class="ls-tab active" data-panel="0">Use Case A</button>
          <button class="ls-tab" data-panel="1">Use Case B</button>
          <button class="ls-tab" data-panel="2">Use Case C</button>
        </div>

        <div class="ls-tab-panels">

          <!-- ── Panel 0: Use Case A — split compare ── -->
          <div class="ls-tab-panel active" data-panel="0">
            <div class="ls-carousel" data-counter=""
                 style="flex:1;min-height:0;width:100%;">
              <div class="ls-carousel-track">

                <!-- Compare slide: split mode -->
                <div class="ls-carousel-slide ls-compare" data-compare-mode="split">
                  <img class="ls-cmp-left"  src="" alt="Before — Use Case A" data-zoom>
                  <img class="ls-cmp-right" src="" alt="After — Use Case A"  data-zoom>
                </div>

                <!-- Regular slide -->
                <div class="ls-carousel-slide">
                  <img src="" alt="Use Case A — additional view" data-zoom>
                </div>

              </div>
            </div>
          </div>

          <!-- ── Panel 1: Use Case B — reveal compare ── -->
          <div class="ls-tab-panel" data-panel="1">
            <div class="ls-carousel" data-counter=""
                 style="flex:1;min-height:0;width:100%;">
              <div class="ls-carousel-track">

                <!-- Compare slide: reveal mode -->
                <div class="ls-carousel-slide ls-compare" data-compare-mode="reveal">
                  <img class="ls-cmp-left"  src="" alt="Before — Use Case B" data-zoom>
                  <img class="ls-cmp-right" src="" alt="After — Use Case B"  data-zoom>
                </div>

                <!-- Regular slide -->
                <div class="ls-carousel-slide">
                  <img src="" alt="Use Case B — additional view" data-zoom>
                </div>

              </div>
            </div>
          </div>

          <!-- ── Panel 2: Use Case C — regular carousel (single images) ── -->
          <div class="ls-tab-panel" data-panel="2">
            <div class="ls-carousel" data-counter=""
                 style="flex:1;min-height:0;width:100%;">
              <div class="ls-carousel-track">

                <div class="ls-carousel-slide">
                  <img src="" alt="Use Case C — image one" data-zoom>
                </div>

                <div class="ls-carousel-slide">
                  <img src="" alt="Use Case C — image two" data-zoom>
                </div>

                <div class="ls-carousel-slide">
                  <img src="" alt="Use Case C — image three" data-zoom>
                </div>

              </div>
            </div>
          </div>

        </div><!-- /ls-tab-panels -->
      </div><!-- /ls-tabs -->

    </div><!-- /slide-body -->
  </div><!-- /slide-layout -->

  <!-- Scoped styles -->
  <style>
    /*
      Layout and slide-specific styling only.
      DO NOT add CSS for any standard component classes:
      ls-tabs, ls-tab, ls-tab-list, ls-tab-panels, ls-tab-panel,
      ls-carousel, ls-carousel-track, ls-carousel-slide,
      ls-dot, ls-table-*, slide-btn, slide-tag —
      all of these are injected by the component scripts.
    */
    .ls25-before-after {
      display: flex;
      flex-direction: column;
    }

    .ls25-before-after .slide-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .ls25-before-after .slide-subtitle {
      margin-top: 4px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .ls25-before-after .ls25-accent {
      color: var(--accent);
    }

    @media (min-width: 769px) {
      .ls25-before-after .slide-layout {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
    }
  </style>

  <!-- Scoped script -->
  <script>
  (function () {
    var slide   = document.currentScript.closest('[data-slide]');
    var slideId = Track.slideId(slide);

    /* ls-tabs, ls-carousel, and compare mode are auto-initialized — no custom JS needed */

    setTimeout(function () { if (window.PE) PE.initSlide(slide); }, 0);
  })();
  </script>

</div>

    // Every carousel slot (named defaults + spares). New cards prefer a spare (x*) slot.
    var ALL_SLOTS = [
      's6-defect-scratches','s6-defect-inclusions','s6-defect-dirt','s6-defect-dust',
      's6-defect-water','s6-defect-fingerprints','s6-defect-ignore','s6-defect-edge-defects',
      's6-defect-frame-bars','s6-defect-undefined','s6-defect-coating',
      's6-defect-x0','s6-defect-x1','s6-defect-x2','s6-defect-x3','s6-defect-x4','s6-defect-x5',
      's6-defect-x6','s6-defect-x7','s6-defect-x8','s6-defect-x9','s6-defect-x10'
    ];

    var config     = [];
    var currentIdx = -1;
    var selector   = root.querySelector('#s6-selector');
    var carWrap    = root.querySelector('#s6CarWrap');
    var configEl   = root.querySelector('#s6-config');

    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    /* ── Config I/O ── */
    function loadConfig() {
      var raw = configEl ? configEl.textContent.trim() : '';
      try { config = raw ? JSON.parse(raw) : clone(DEFAULT_CONFIG); }
      catch (e) { config = clone(DEFAULT_CONFIG); }
      if (!Array.isArray(config) || !config.length) config = clone(DEFAULT_CONFIG);
    }
    function persistConfig() {
      if (!configEl) return;
      configEl.textContent = JSON.stringify(config);
      configEl.dispatchEvent(new Event('focusout', { bubbles: true }));
    }

    /* ── Carousel lookup + show/hide ── */
    function findCar(item) { return item ? root.querySelector('.s6-defect-car[data-edit="' + item.carKey + '"]') : null; }

    function showDefault() {
      root.querySelectorAll('.s6-defect-car').forEach(function (c) { c.style.display = 'none'; });
      currentIdx = -1;
      if (carWrap) {
        carWrap.style.display = '';
        if (window.Carousel) Carousel.init(carWrap);
        if (window.Lightbox) Lightbox.init(carWrap);
      }
      updateBtns();
    }
    function showDefect(idx) {
      if (idx === currentIdx) { showDefault(); return; }
      if (currentIdx >= 0) { var prev = findCar(config[currentIdx]); if (prev) prev.style.display = 'none'; }
      if (carWrap) carWrap.style.display = 'none';
      currentIdx = idx;
      var car = findCar(config[idx]);
      if (car) {
        car.style.display = '';
        if (car._lsGoTo) car._lsGoTo(0);
        if (window.Carousel) Carousel.init(car);
        if (window.Lightbox) Lightbox.init(car);
      }
      updateBtns();
    }
    function updateBtns() {
      selector.querySelectorAll('.s6-defect-btn').forEach(function (btn, i) {
        if (btn.classList.contains('s6-add-btn')) return;
        btn.classList.toggle('active', i === currentIdx);
      });
    }

    /* ── Icon element (image, or a "+" placeholder when empty) ── */
    function makeIcon(item) {
      if (item.icon) {
        var img = document.createElement('img');
        img.className = 's6-icon'; img.src = item.icon; img.alt = (item.label || '') + ' icon';
        return img;
      }
      var ph = document.createElement('span');
      ph.className = 's6-icon s6-icon-placeholder'; ph.textContent = '+';
      return ph;
    }
    function replaceIcon(iconWrap, item) {
      var old = iconWrap.querySelector('.s6-icon');
      var fresh = makeIcon(item);
      if (old) iconWrap.replaceChild(fresh, old); else iconWrap.insertBefore(fresh, iconWrap.firstChild);
    }

    /* ── Build one defect card ── */
    function makeBtn(item, idx) {
      var btn = document.createElement('button');
      btn.className = 's6-defect-btn'; btn.setAttribute('data-defect-id', item.id);

      var iconWrap = document.createElement('span');
      iconWrap.className = 's6-icon-wrap';
      iconWrap.appendChild(makeIcon(item));

      if (EDIT_MODE) {
        var ctrls = document.createElement('span');
        ctrls.className = 's6-icon-ctrls'; ctrls.setAttribute('data-builder-only', '');

        var changeBtn = document.createElement('span');
        changeBtn.className = 's6-icon-btn s6-icon-change'; changeBtn.title = 'Change image';
        changeBtn.setAttribute('role', 'button'); changeBtn.innerHTML = '&#8682;';
        changeBtn.addEventListener('click', function (e) {
          e.stopPropagation(); e.preventDefault();
          var input = document.createElement('input');
          input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
          document.body.appendChild(input);
          input.addEventListener('change', function (ev) {
            document.body.removeChild(input);
            var file = ev.target.files[0]; if (!file) return;
            var reader = new FileReader();
            reader.onload = function (re) {
              window.PBUpload(file.name, re.target.result).then(function (p) {
                if (!p) return;
                item.icon = p; replaceIcon(iconWrap, item); persistConfig();
              });
            };
            reader.readAsDataURL(file);
          });
          input.click();
        });

        var clearBtn = document.createElement('span');
        clearBtn.className = 's6-icon-btn s6-icon-del'; clearBtn.title = 'Clear image';
        clearBtn.setAttribute('role', 'button'); clearBtn.innerHTML = '&#10005;';
        clearBtn.addEventListener('click', function (e) {
          e.stopPropagation(); e.preventDefault();
          item.icon = ''; replaceIcon(iconWrap, item); persistConfig();
        });

        ctrls.appendChild(changeBtn); ctrls.appendChild(clearBtn);
        iconWrap.appendChild(ctrls);
      }
      btn.appendChild(iconWrap);

      var labelEl = document.createElement('span');
      labelEl.className = 's6-defect-label'; labelEl.textContent = item.label;
      labelEl.setAttribute('data-edit', 's6-label-' + idx);
      if (EDIT_MODE) {
        labelEl.contentEditable = 'true'; labelEl.spellcheck = false;
        labelEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); labelEl.blur(); } });
        labelEl.addEventListener('blur', function () { var v = labelEl.textContent.trim(); if (v) item.label = v; persistConfig(); });
        labelEl.addEventListener('click', function (e) { if (!window.previewLang || window.previewLang === 'en') e.stopPropagation(); });
      }
      btn.appendChild(labelEl);

      if (EDIT_MODE) {
        var cardDel = document.createElement('span');
        cardDel.className = 's6-card-del'; cardDel.setAttribute('data-builder-only', '');
        cardDel.setAttribute('role', 'button'); cardDel.title = 'Delete card'; cardDel.innerHTML = '&#10005;';
        cardDel.addEventListener('click', function (e) {
          e.stopPropagation(); e.preventDefault();
          if (!window.confirm('Delete "' + (item.label || 'this defect') + '" card?')) return;
          config.splice(idx, 1);
          renderSelector(); persistConfig();
        });
        btn.appendChild(cardDel);
      }

      btn.addEventListener('click', function () {
        if (document.activeElement && document.activeElement.isContentEditable) return;
        showDefect(idx);
        if (window.Track) Track.click(slideId, item.label);
      });

      return btn;
    }

    /* ── Find a free carousel slot for a new card (spares first) ── */
    function freeSlot() {
      var used = config.map(function (c) { return c.carKey; });
      var i, k;
      for (i = 0; i < ALL_SLOTS.length; i++) { k = ALL_SLOTS[i]; if (k.indexOf('s6-defect-x') === 0 && used.indexOf(k) === -1) return k; }
      for (i = 0; i < ALL_SLOTS.length; i++) { k = ALL_SLOTS[i]; if (used.indexOf(k) === -1) return k; }
      return null;
    }
    function clearSlot(carKey) {
      var car = root.querySelector('.s6-defect-car[data-edit="' + carKey + '"]');
      if (!car) return;
      var track = car.querySelector('.ls-carousel-track');
      if (track) track.innerHTML = '';          // truly empty — no placeholder slide
      car._lsCarouselInit = false;              // let it re-init cleanly when first shown
      // Persist the emptied slot so a reused spare never resurrects stale images on reload
      document.dispatchEvent(new CustomEvent('slide-carousel-save', {
        detail: { editKey: carKey, html: '<div class="ls-carousel-track"></div>' }
      }));
    }

    /* ── Render the full selector strip ── */
    function renderSelector() {
      currentIdx = -1;
      selector.innerHTML = '';
      config.forEach(function (item, idx) { selector.appendChild(makeBtn(item, idx)); });

      if (EDIT_MODE && config.length < MAX_CARDS) {
        var add = document.createElement('button');
        add.className = 's6-defect-btn s6-add-btn'; add.setAttribute('data-builder-only', '');
        add.title = 'Add defect type';
        var ai = document.createElement('span'); ai.className = 's6-add-icon'; ai.textContent = '+';
        var al = document.createElement('span'); al.className = 's6-defect-label'; al.textContent = 'Add';
        add.appendChild(ai); add.appendChild(al);
        add.addEventListener('click', function () {
          if (config.length >= MAX_CARDS) return;
          var slot = freeSlot(); if (!slot) return;
          clearSlot(slot);
          config.push({ id: slot, label: 'New defect', icon: '', carKey: slot });
          renderSelector(); persistConfig();
        });
        selector.appendChild(add);
      }
      showDefault();
    }

    loadConfig();
    renderSelector();
  })();
  </script>
</div>

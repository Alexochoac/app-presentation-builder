    var selector = document.getElementById('s6-selector');
    var carWrap  = document.getElementById('s6CarWrap');

    // Per-card icon editing (builder only). Hovering a defect card reveals a change/delete
    // control pair on its icon. They stopPropagation so they never trigger the card's
    // click-to-switch-carousel. Both persist via slide-image-change (data-edit image slot);
    // "delete" resets the icon to its original default.
    function wireIconControls(wrap) {
      if (window.PB_READONLY) return;
      var img        = wrap.querySelector('.s6-icon');
      var key        = wrap.getAttribute('data-edit');
      var defaultSrc = img.getAttribute('src');
      function persist(src) {
        document.dispatchEvent(new CustomEvent('slide-image-change', { detail: { editKey: key, src: src } }));
      }
      var changeBtn = wrap.querySelector('.s6-icon-change');
      var delBtn    = wrap.querySelector('.s6-icon-del');
      if (changeBtn) changeBtn.addEventListener('click', function (e) {
        e.stopPropagation(); e.preventDefault();
        var input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
        document.body.appendChild(input);
        input.addEventListener('change', function (ev) {
          document.body.removeChild(input);
          var file = ev.target.files[0]; if (!file) return;
          img.src = URL.createObjectURL(file);
          var reader = new FileReader();
          reader.onload = function (re) {
            window.PBUpload(file.name, re.target.result).then(function (p) {
              if (!p) return; img.src = p; persist(p);
            });
          };
          reader.readAsDataURL(file);
        });
        input.click();
      });
      if (delBtn) delBtn.addEventListener('click', function (e) {
        e.stopPropagation(); e.preventDefault();
        img.src = ''; persist('');   // clear the icon (empty)
      });
    }

    function updateBtns() {
      selector.querySelectorAll('.s6-defect-btn').forEach(function (btn, i) {
        btn.classList.toggle('active', i === currentDefect);
      });
    }

    function showDefault() {
      if (currentDefect >= 0) document.getElementById(DEFECTS[currentDefect].carId).style.display = 'none';
      currentDefect = -1;
      carWrap.style.display = '';
      if (window.Carousel) Carousel.init(carWrap);
      if (window.Lightbox) Lightbox.init(carWrap);
      updateBtns();
    }

    function showDefect(idx) {
      // Click active defect → deselect back to default
      if (currentDefect === idx) { showDefault(); return; }
      // Hide previous defect carousel
      if (currentDefect >= 0) document.getElementById(DEFECTS[currentDefect].carId).style.display = 'none';

      currentDefect = idx;
      carWrap.style.display = 'none';

      var car = document.getElementById(DEFECTS[idx].carId);
      car.style.display = '';
      // Reset to first slide and init if not already done
      if (car._lsGoTo) car._lsGoTo(0);
      if (window.Carousel) Carousel.init(car);
      if (window.Lightbox)  Lightbox.init(car);

      updateBtns();
    }

    // ── Attach handlers to pre-rendered buttons ──────────────────────────────
    Array.from(selector.querySelectorAll('.s6-defect-btn')).forEach(function (btn, i) {
      var wrap = btn.querySelector('.s6-icon-wrap');
      if (wrap) wireIconControls(wrap);
      btn.addEventListener('click', function () {
        showDefect(i);
        if (window.Track) {
          var lbl = btn.querySelector('.s6-defect-label');
          Track.click(Track.slideId(btn), lbl ? lbl.textContent.trim() : (DEFECTS[i] ? DEFECTS[i].name : ''));
        }
      });
    });

    showDefault();

  })();
  </script>

  <script>
  (function () { var s = document.currentScript;
    setTimeout(function () { if (window.PE && s) PE.initSlide(s.closest('.slide')); }, 0); })();
  </script>
</div>

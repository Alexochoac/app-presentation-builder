<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Presentation Builder</title>
  <link rel="stylesheet" href="/shared/app-style.css">
</head>
<body>

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <!-- Mobile Top Bar -->
  <header class="topbar-mobile">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">&#9776;</button>
    <div class="logo-icon">P</div>
    <span class="logo-text">Presentation Builder</span>
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon">P</div>
      <span class="logo-text">Presentation Builder</span>
    </div>

    <ul class="sidebar-nav">
      <li>
        <a href="/" class="sidebar-nav-item active">
          <span class="nav-icon">&#9632;</span>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="/slides" class="sidebar-nav-item">
          <span class="nav-icon">&#9654;</span>
          <span class="nav-label">Builder</span>
        </a>
      </li>
      <li>
        <a href="/settings" class="sidebar-nav-item">
          <span class="nav-icon">&#9881;</span>
          <span class="nav-label">Settings</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-logout">
      <a href="/auth/logout" class="sidebar-nav-item">
        <span class="nav-icon">&#8617;</span>
        <span class="nav-label">Log out</span>
      </a>
    </div>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar">
      <span class="toggle-icon">&#8249;</span>
    </button>
  </nav>

  <!-- App Body -->
  <div class="app-body" id="appBody">

  <!-- Main Content -->
  <main class="main">

    <!-- Finished Presentations -->
    <section class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">Finished Presentations</h2>
          <p class="panel-subtitle">Completed customer decks</p>
        </div>
        <div style="display:flex;gap:6px;">
          <button id="viewList" aria-label="List view" title="List view" style="border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;">&#9776;</button>
          <button id="viewGrid" aria-label="Grid view" title="Grid view" style="border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;">&#9632;&#9632;</button>
        </div>
      </div>

      <p class="deck-empty hidden" id="finishedEmpty">No finished presentations yet.</p>
      <ul class="finished-list" id="finishedList" style="list-style:none;padding:0;margin:0;"></ul>
    </section>

  </main>

  </div><!-- /.app-body -->

<!-- Edit Presentation Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:400px;margin:16px;">
    <h3 style="margin:0 0 16px;font-size:16px;color:var(--text);">Edit Presentation</h3>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Customer Name</span>
      <input id="editCustomerName" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Contact Name</span>
      <input id="editContactName" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Contact Title</span>
      <input id="editContactTitle" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:20px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Customer Logo <span style="color:var(--muted);">(optional — keeps current if blank)</span></span>
      <input id="editLogoFile" type="file" accept="image/*" style="width:100%;font-size:13px;color:var(--text);">
    </label>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="editCancel" style="border:1px solid var(--border);background:transparent;color:var(--text);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;">Cancel</button>
      <button id="editSave" style="border:none;background:var(--accent);color:#fff;border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;">Save</button>
    </div>
  </div>
</div>

<!-- Duplicate Presentation Modal -->
<div id="dupModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:420px;margin:16px;">
    <h3 style="margin:0 0 4px;font-size:16px;color:var(--text);">Duplicate Presentation</h3>
    <p style="margin:0 0 16px;font-size:12px;color:var(--muted);">Set new customer details for the copy.</p>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Customer Name <span style="color:#e55;">*</span></span>
      <input id="dupCustomerName" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Contact Name</span>
      <input id="dupContactName" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Contact Title</span>
      <input id="dupContactTitle" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:20px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Customer Logo <span style="color:var(--muted);">(optional — keeps original if blank)</span></span>
      <input id="dupLogoFile" type="file" accept="image/*" style="width:100%;font-size:13px;color:var(--text);">
    </label>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="dupCancel" style="border:1px solid var(--border);background:transparent;color:var(--text);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;">Cancel</button>
      <button id="dupSave" style="border:none;background:var(--accent);color:#fff;border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;">Duplicate</button>
    </div>
  </div>
</div>

  <style>
    #finishedList.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      padding-top: 8px;
    }
    #finishedList.grid-view .pres-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: stretch !important;
      border: 1px solid var(--border) !important;
      border-bottom: 1px solid var(--border) !important;
      border-radius: 10px;
      padding: 0 !important;
      overflow: hidden;
      background: var(--surface);
    }
    #finishedList.grid-view .pres-thumb {
      display: flex !important;
    }
    #finishedList.grid-view .pres-body {
      padding: 10px 12px 8px;
    }
    #finishedList.grid-view .pres-actions {
      padding: 0 12px 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    /* hide thumb in list view */
    .pres-thumb { display: none; }
    /* active toggle button */
    .view-btn-active {
      background: var(--accent) !important;
      color: #fff !important;
      border-color: var(--accent) !important;
    }
  </style>

  <script>
    (function () {
      var html = document.documentElement;
      var saved = localStorage.getItem('pb-theme');
      if (saved) html.setAttribute('data-theme', saved);
    })();

    // ── View Toggle ──────────────────────────────────────────────────
    (function () {
      var list    = document.getElementById('finishedList');
      var btnList = document.getElementById('viewList');
      var btnGrid = document.getElementById('viewGrid');
      var current = localStorage.getItem('pb-pres-view') || 'list';

      function applyView(v) {
        current = v;
        localStorage.setItem('pb-pres-view', v);
        if (v === 'grid') {
          list.classList.add('grid-view');
          btnGrid.classList.add('view-btn-active');
          btnList.classList.remove('view-btn-active');
        } else {
          list.classList.remove('grid-view');
          btnList.classList.add('view-btn-active');
          btnGrid.classList.remove('view-btn-active');
        }
      }

      btnList.addEventListener('click', function () { applyView('list'); });
      btnGrid.addEventListener('click', function () { applyView('grid'); });
      applyView(current);
    })();

    // ── Load Finished Presentations ──────────────────────────────────
    (function () {
      var umamiId = '';
      Promise.all([
        fetch('/api/presentations').then(function (r) { return r.json(); }),
        fetch('/api/settings').then(function (r) { return r.json(); })
      ])
        .then(function (results) {
          var res      = results[0];
          var settings = results[1].data || {};
          umamiId  = settings.umamiWebsiteId || '';

          var list    = document.getElementById('finishedList');
          var empty   = document.getElementById('finishedEmpty');
          var items   = (res.data || []);

          if (items.length === 0) {
            empty.classList.remove('hidden');
            return;
          }

          empty.classList.add('hidden');
          items.forEach(function (p) {
            var initials = (p.customerName || '?').trim().split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
            var thumbInner = p.customerLogoSrc
              ? '<img src="' + p.customerLogoSrc + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
              : '<span>' + initials + '</span>';
            var presUrl = 'https://app-presentation-builder.pages.dev/finished-presentations/' + p.id;
            var trackingHtml = umamiId
              ? '<div class="pres-tracking" style="font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px;">' +
                  '<span style="opacity:0.5;">Published:</span>' +
                  '<a href="' + presUrl + '" target="_blank" rel="noopener" style="color:var(--accent,#7c8cf8);text-decoration:none;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + presUrl + '">' +
                    presUrl +
                  '</a>' +
                '</div>'
              : '';
            var li = document.createElement('li');
            li.className = 'pres-item';
            li.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);';
            li.innerHTML =
              '<div class="pres-thumb" style="display:none;position:relative;align-items:center;justify-content:center;background:var(--surface-alt,var(--border));height:130px;overflow:hidden;">' +
                thumbInner +
              '</div>' +
              '<div class="pres-body" style="flex:1;min-width:0;">' +
                '<div class="pres-name" style="font-size:14px;font-weight:600;color:var(--text);">' + escDash(p.customerName) + '</div>' +
                '<div class="pres-meta" style="font-size:12px;color:var(--muted);margin-top:2px;">' +
                  (p.contactName ? escDash(p.contactName) + (p.contactTitle ? ' · ' + escDash(p.contactTitle) : '') + ' · ' : '') +
                  p.slideCount + ' slides · ' + p.createdAt +
                '</div>' +
                trackingHtml +
              '</div>' +
              '<div class="pres-actions" style="display:flex;gap:6px;flex-shrink:0;">' +
                '<a href="/view/' + p.id + '" style="border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;text-decoration:none;white-space:nowrap;">View</a>' +
                '<button class="btn-edit" data-id="' + p.id + '" style="border:1px solid var(--border);color:var(--text);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Edit</button>' +
                '<button class="btn-duplicate" data-id="' + p.id + '" style="border:1px solid var(--border);color:var(--text);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Duplicate</button>' +
                '<button class="btn-delete" data-id="' + p.id + '" style="border:1px solid #e55;color:#e55;background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Delete</button>' +
              '</div>';

            li.querySelector('.btn-edit').addEventListener('click', function () {
              openEditModal(p, li);
            });
            li.querySelector('.btn-duplicate').addEventListener('click', function () {
              openDupModal(p);
            });
            li.querySelector('.btn-delete').addEventListener('click', function () {
              var id = this.getAttribute('data-id');
              var name = li.querySelector('.pres-name').textContent;
              if (!confirm('Delete presentation for "' + name + '"? This cannot be undone.')) return;
              var btn = this;
              fetch('/api/presentations/' + id, { method: 'DELETE' })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                  if (res.success) { btn.closest('li').remove(); }
                  else { alert('Delete failed: ' + res.error); }
                })
                .catch(function () { alert('Delete failed.'); });
            });
            list.appendChild(li);
          });
        })
        .catch(function () {
          document.getElementById('finishedEmpty').classList.remove('hidden');
        });

      function escDash(str) {
        var d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
      }

      var _editTarget = null;
      function openEditModal(pres, liEl) {
        _editTarget = { pres: pres, li: liEl };
        document.getElementById('editCustomerName').value = pres.customerName || '';
        document.getElementById('editContactName').value  = pres.contactName  || '';
        document.getElementById('editContactTitle').value = pres.contactTitle || '';
        document.getElementById('editLogoFile').value = '';
        var modal = document.getElementById('editModal');
        modal.style.display = 'flex';
      }

      document.getElementById('editCancel').addEventListener('click', function () {
        document.getElementById('editModal').style.display = 'none';
      });

      document.getElementById('editSave').addEventListener('click', function () {
        if (!_editTarget) return;
        var id   = _editTarget.pres.id;
        var btn  = this;
        var file = document.getElementById('editLogoFile').files[0];

        function doSave(logoFilename, logoData) {
          btn.disabled = true;
          btn.textContent = 'Saving…';
          fetch('/api/presentations/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerName:  document.getElementById('editCustomerName').value.trim(),
              contactName:   document.getElementById('editContactName').value.trim(),
              contactTitle:  document.getElementById('editContactTitle').value.trim(),
              logoFilename:  logoFilename || '',
              logoData:      logoData     || ''
            })
          })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              btn.disabled = false;
              btn.textContent = 'Save';
              if (!res.success) { alert('Save failed: ' + res.error); return; }
              var p  = res.data;
              var li = _editTarget.li;
              li.querySelector('[style*="font-weight:600"]').textContent = p.customerName;
              var sub = li.querySelectorAll('div > div')[1];
              sub.textContent =
                (p.contactName ? p.contactName + (p.contactTitle ? ' · ' + p.contactTitle : '') + ' · ' : '') +
                p.slideCount + ' slides · ' + p.createdAt;
              if (p.customerLogoSrc) {
                var thumb = li.querySelector('.pres-thumb');
                if (thumb) thumb.innerHTML = '<img src="' + p.customerLogoSrc + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
              }
              document.getElementById('editModal').style.display = 'none';
              _editTarget = null;
            })
            .catch(function () { btn.disabled = false; btn.textContent = 'Save'; alert('Save failed.'); });
        }

        if (file) {
          var reader = new FileReader();
          reader.onload = function (e) { doSave(file.name, e.target.result); };
          reader.readAsDataURL(file);
        } else {
          doSave('', '');
        }
      });

      document.getElementById('editModal').addEventListener('click', function (e) {
        if (e.target === this) this.style.display = 'none';
      });

      // ── Duplicate Modal ────────────────────────────────────────────
      var _dupSourceId = null;

      function openDupModal(pres) {
        _dupSourceId = pres.id;
        document.getElementById('dupCustomerName').value = pres.customerName || '';
        document.getElementById('dupContactName').value  = pres.contactName  || '';
        document.getElementById('dupContactTitle').value = pres.contactTitle || '';
        document.getElementById('dupLogoFile').value = '';
        document.getElementById('dupModal').style.display = 'flex';
        document.getElementById('dupCustomerName').focus();
      }

      document.getElementById('dupCancel').addEventListener('click', function () {
        document.getElementById('dupModal').style.display = 'none';
      });

      document.getElementById('dupModal').addEventListener('click', function (e) {
        if (e.target === this) this.style.display = 'none';
      });

      document.getElementById('dupSave').addEventListener('click', function () {
        var name = document.getElementById('dupCustomerName').value.trim();
        if (!name) { document.getElementById('dupCustomerName').focus(); return; }
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Duplicating…';

        var fileInput = document.getElementById('dupLogoFile');
        var file = fileInput.files && fileInput.files[0];

        function doSubmit(logoFilename, logoData) {
          fetch('/api/presentations/' + _dupSourceId + '/duplicate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerName:  name,
              contactName:   document.getElementById('dupContactName').value.trim(),
              contactTitle:  document.getElementById('dupContactTitle').value.trim(),
              logoFilename:  logoFilename || '',
              logoData:      logoData     || ''
            })
          })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              btn.disabled = false;
              btn.textContent = 'Duplicate';
              if (!res.success) { alert('Duplicate failed: ' + res.error); return; }
              document.getElementById('dupModal').style.display = 'none';
              var p = res.data;
              var initials = (p.customerName || '?').trim().split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
              var thumbInner = p.customerLogoSrc
                ? '<img src="' + p.customerLogoSrc + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
                : '<span>' + initials + '</span>';
              var dupPresUrl = 'https://app-presentation-builder.pages.dev/finished-presentations/' + p.id;
              var dupTrackingHtml = umamiId
                ? '<div class="pres-tracking" style="font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px;">' +
                    '<span style="opacity:0.5;">Published:</span>' +
                    '<a href="' + dupPresUrl + '" target="_blank" rel="noopener" style="color:var(--accent,#7c8cf8);text-decoration:none;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + dupPresUrl + '">' +
                      dupPresUrl +
                    '</a>' +
                  '</div>'
                : '';
              var li = document.createElement('li');
              li.className = 'pres-item';
              li.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);';
              li.innerHTML =
                '<div class="pres-thumb" style="display:none;position:relative;align-items:center;justify-content:center;background:var(--surface-alt,var(--border));height:130px;overflow:hidden;">' +
                  thumbInner +
                '</div>' +
                '<div class="pres-body" style="flex:1;min-width:0;">' +
                  '<div class="pres-name" style="font-size:14px;font-weight:600;color:var(--text);">' + escDash(p.customerName) + '</div>' +
                  '<div class="pres-meta" style="font-size:12px;color:var(--muted);margin-top:2px;">' +
                    (p.contactName ? escDash(p.contactName) + (p.contactTitle ? ' · ' + escDash(p.contactTitle) : '') + ' · ' : '') +
                    p.slideCount + ' slides · ' + p.createdAt +
                  '</div>' +
                  dupTrackingHtml +
                '</div>' +
                '<div class="pres-actions" style="display:flex;gap:6px;flex-shrink:0;">' +
                  '<a href="/view/' + p.id + '" style="border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;text-decoration:none;white-space:nowrap;">View</a>' +
                  '<button class="btn-edit" data-id="' + p.id + '" style="border:1px solid var(--border);color:var(--text);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Edit</button>' +
                  '<button class="btn-duplicate" data-id="' + p.id + '" style="border:1px solid var(--border);color:var(--text);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Duplicate</button>' +
                  '<button class="btn-delete" data-id="' + p.id + '" style="border:1px solid #e55;color:#e55;background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Delete</button>' +
                '</div>';
              li.querySelector('.btn-edit').addEventListener('click', function () { openEditModal(p, li); });
              li.querySelector('.btn-duplicate').addEventListener('click', function () { openDupModal(p); });
              li.querySelector('.btn-delete').addEventListener('click', function () {
                var id = p.id;
                if (!confirm('Delete presentation for "' + p.customerName + '"? This cannot be undone.')) return;
                fetch('/api/presentations/' + id, { method: 'DELETE' })
                  .then(function (r) { return r.json(); })
                  .then(function (dr) { if (dr.success) li.remove(); else alert('Delete failed: ' + dr.error); })
                  .catch(function () { alert('Delete failed.'); });
              });
              var list = document.getElementById('finishedList');
              list.insertBefore(li, list.firstChild);
              document.getElementById('finishedEmpty').classList.add('hidden');
            })
            .catch(function () {
              btn.disabled = false;
              btn.textContent = 'Duplicate';
              alert('Duplicate failed.');
            });
        }

        if (file) {
          var reader = new FileReader();
          reader.onload = function (e) { doSubmit(file.name, e.target.result); };
          reader.readAsDataURL(file);
        } else {
          doSubmit('', '');
        }
      });
    })();

    // ── Sidebar JS ──────────────────────────────────────────────
    (function () {
      var sidebar  = document.getElementById('sidebar');
      var overlay  = document.getElementById('sidebarOverlay');
      var toggle   = document.getElementById('sidebarToggle');
      var hamburger = document.getElementById('hamburgerBtn');
      var appBody  = document.getElementById('appBody');

      // Restore desktop collapsed state
      if (localStorage.getItem('pb-sidebar-collapsed') === '1') {
        sidebar.classList.add('collapsed');
        appBody.classList.add('sidebar-collapsed');
      }

      // Desktop: collapse toggle
      toggle.addEventListener('click', function () {
        var collapsed = sidebar.classList.toggle('collapsed');
        appBody.classList.toggle('sidebar-collapsed', collapsed);
        localStorage.setItem('pb-sidebar-collapsed', collapsed ? '1' : '0');
      });

      // Mobile: open sidebar
      hamburger.addEventListener('click', function () {
        sidebar.classList.add('open');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      });

      // Mobile: close via overlay
      overlay.addEventListener('click', function () {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      });
    })();
  </script>

</body>
</html>

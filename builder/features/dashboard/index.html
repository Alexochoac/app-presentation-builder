<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Presentation Builder</title>
  <link rel="stylesheet" href="/shared/app-style.css">
</head>
<body>

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <!-- Mobile Top Bar -->
  <header class="topbar-mobile">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">&#9776;</button>
    <div class="logo-icon">P</div>
    <span class="logo-text">Presentation Builder</span>
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon">P</div>
      <span class="logo-text">Presentation Builder</span>
    </div>

    <ul class="sidebar-nav">
      <li>
        <a href="/" class="sidebar-nav-item active">
          <span class="nav-icon">&#9632;</span>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="/slides" class="sidebar-nav-item">
          <span class="nav-icon">&#9654;</span>
          <span class="nav-label">Builder</span>
        </a>
      </li>
      <li>
        <a href="/settings" class="sidebar-nav-item">
          <span class="nav-icon">&#9881;</span>
          <span class="nav-label">Settings</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-logout">
      <a href="/auth/logout" class="sidebar-nav-item">
        <span class="nav-icon">&#8617;</span>
        <span class="nav-label">Log out</span>
      </a>
    </div>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar">
      <span class="toggle-icon">&#8249;</span>
    </button>
  </nav>

  <!-- App Body -->
  <div class="app-body" id="appBody">

  <!-- Main Content -->
  <main class="main">

    <!-- Finished Presentations -->
    <section class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">Finished Presentations</h2>
          <p class="panel-subtitle">Completed customer decks</p>
        </div>
      </div>

      <p class="deck-empty hidden" id="finishedEmpty">No finished presentations yet.</p>
      <ul class="finished-list" id="finishedList" style="list-style:none;padding:0;margin:0;"></ul>
    </section>

  </main>

  </div><!-- /.app-body -->

<!-- Edit Presentation Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:400px;margin:16px;">
    <h3 style="margin:0 0 16px;font-size:16px;color:var(--text);">Edit Presentation</h3>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Customer Name</span>
      <input id="editCustomerName" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:12px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Contact Name</span>
      <input id="editContactName" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <label style="display:block;margin-bottom:20px;">
      <span style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">Contact Title</span>
      <input id="editContactTitle" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;">
    </label>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="editCancel" style="border:1px solid var(--border);background:transparent;color:var(--text);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;">Cancel</button>
      <button id="editSave" style="border:none;background:var(--accent);color:#fff;border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;">Save</button>
    </div>
  </div>
</div>

  <script>
    (function () {
      var html = document.documentElement;
      var saved = localStorage.getItem('pb-theme');
      if (saved) html.setAttribute('data-theme', saved);
    })();

    // ── Load Finished Presentations ──────────────────────────────────
    (function () {
      fetch('/api/presentations')
        .then(function (r) { return r.json(); })
        .then(function (res) {
          var list    = document.getElementById('finishedList');
          var empty   = document.getElementById('finishedEmpty');
          var items   = (res.data || []);

          if (items.length === 0) {
            empty.classList.remove('hidden');
            return;
          }

          empty.classList.add('hidden');
          items.forEach(function (p) {
            var li = document.createElement('li');
            li.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);';
            li.innerHTML =
              '<div style="flex:1;min-width:0;">' +
                '<div style="font-size:14px;font-weight:600;color:var(--text);">' + escDash(p.customerName) + '</div>' +
                '<div style="font-size:12px;color:var(--muted);margin-top:2px;">' +
                  (p.contactName ? escDash(p.contactName) + (p.contactTitle ? ' · ' + escDash(p.contactTitle) : '') + ' · ' : '') +
                  p.slideCount + ' slides · ' + p.createdAt +
                '</div>' +
              '</div>' +
              '<a href="/view/' + p.id + '" style="border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;text-decoration:none;white-space:nowrap;">View</a>' +
              '<button class="btn-edit" data-id="' + p.id + '" style="border:1px solid var(--border);color:var(--text);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Edit</button>' +
              '<button class="btn-delete" data-id="' + p.id + '" style="border:1px solid #e55;color:#e55;background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Delete</button>';

            li.querySelector('.btn-edit').addEventListener('click', function () {
              openEditModal(p, li);
            });
            li.querySelector('.btn-delete').addEventListener('click', function () {
              var id = this.getAttribute('data-id');
              var name = this.closest('li').querySelector('[style*="font-weight:600"]').textContent;
              if (!confirm('Delete presentation for "' + name + '"? This cannot be undone.')) return;
              var btn = this;
              fetch('/api/presentations/' + id, { method: 'DELETE' })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                  if (res.success) { btn.closest('li').remove(); }
                  else { alert('Delete failed: ' + res.error); }
                })
                .catch(function () { alert('Delete failed.'); });
            });
            list.appendChild(li);
          });
        })
        .catch(function () {
          document.getElementById('finishedEmpty').classList.remove('hidden');
        });

      function escDash(str) {
        var d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
      }

      var _editTarget = null;
      function openEditModal(pres, liEl) {
        _editTarget = { pres: pres, li: liEl };
        document.getElementById('editCustomerName').value = pres.customerName || '';
        document.getElementById('editContactName').value  = pres.contactName  || '';
        document.getElementById('editContactTitle').value = pres.contactTitle || '';
        var modal = document.getElementById('editModal');
        modal.style.display = 'flex';
      }

      document.getElementById('editCancel').addEventListener('click', function () {
        document.getElementById('editModal').style.display = 'none';
      });

      document.getElementById('editSave').addEventListener('click', function () {
        if (!_editTarget) return;
        var id = _editTarget.pres.id;
        var body = {
          customerName: document.getElementById('editCustomerName').value.trim(),
          contactName:  document.getElementById('editContactName').value.trim(),
          contactTitle: document.getElementById('editContactTitle').value.trim()
        };
        fetch('/api/presentations/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res.success) { alert('Save failed: ' + res.error); return; }
            var p = res.data;
            var li = _editTarget.li;
            li.querySelector('[style*="font-weight:600"]').textContent = p.customerName;
            var sub = li.querySelectorAll('div > div')[1];
            sub.textContent =
              (p.contactName ? p.contactName + (p.contactTitle ? ' · ' + p.contactTitle : '') + ' · ' : '') +
              p.slideCount + ' slides · ' + p.createdAt;
            document.getElementById('editModal').style.display = 'none';
            _editTarget = null;
          })
          .catch(function () { alert('Save failed.'); });
      });

      document.getElementById('editModal').addEventListener('click', function (e) {
        if (e.target === this) this.style.display = 'none';
      });
    })();

    // ── Sidebar JS ──────────────────────────────────────────────
    (function () {
      var sidebar  = document.getElementById('sidebar');
      var overlay  = document.getElementById('sidebarOverlay');
      var toggle   = document.getElementById('sidebarToggle');
      var hamburger = document.getElementById('hamburgerBtn');
      var appBody  = document.getElementById('appBody');

      // Restore desktop collapsed state
      if (localStorage.getItem('pb-sidebar-collapsed') === '1') {
        sidebar.classList.add('collapsed');
        appBody.classList.add('sidebar-collapsed');
      }

      // Desktop: collapse toggle
      toggle.addEventListener('click', function () {
        var collapsed = sidebar.classList.toggle('collapsed');
        appBody.classList.toggle('sidebar-collapsed', collapsed);
        localStorage.setItem('pb-sidebar-collapsed', collapsed ? '1' : '0');
      });

      // Mobile: open sidebar
      hamburger.addEventListener('click', function () {
        sidebar.classList.add('open');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      });

      // Mobile: close via overlay
      overlay.addEventListener('click', function () {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      });
    })();
  </script>

</body>
</html>

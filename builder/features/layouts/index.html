<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layouts — Presentation Builder</title>
  <link rel="stylesheet" href="/shared/app-style.css">
  <style>
    /* ── Layouts page ─────────────────────────────────────────── */

    /* Page header row */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .page-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 72px 24px;
      text-align: center;
    }
    .empty-icon {
      font-size: 48px;
      opacity: 0.3;
    }
    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }
    .empty-desc {
      font-size: 14px;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.6;
    }

    /* Layouts grid */
    .layouts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .layout-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, background 0.2s;
    }
    .layout-card:hover {
      border-color: var(--border-hov);
      background: var(--surface-hov);
    }
    .layout-card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .layout-card-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-count {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 100px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--accent-glow);
    }
    .layout-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .btn-edit {
      flex: 1;
      padding: 7px 12px;
      border-radius: var(--radius-btn);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-edit:hover {
      border-color: var(--border-hov);
      background: var(--surface-hov);
    }
    .btn-delete {
      padding: 7px 12px;
      border-radius: var(--radius-btn);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .btn-delete:hover {
      color: var(--remove-hov-fg);
      border-color: var(--remove-hov-fg);
      background: var(--remove-hov-bg);
    }

    /* ── Layout Builder ──────────────────────────────────────── */

    /* Builder top bar */
    .builder-topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--topbar-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-btn);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .btn-back:hover { color: var(--text); border-color: var(--border-hov); }

    .layout-name-input {
      flex: 1;
      min-width: 120px;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font);
      padding: 2px 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    .layout-name-input:hover,
    .layout-name-input:focus {
      border-bottom-color: var(--border-hov);
    }

    /* Viewport toggle */
    .viewport-toggle {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      padding: 3px;
      flex-shrink: 0;
    }
    .viewport-btn {
      padding: 5px 14px;
      border-radius: 100px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .viewport-btn.active {
      background: var(--nav-active);
      color: var(--text);
    }
    .viewport-btn:hover:not(.active) { color: var(--text); }

    /* Split pane */
    .builder-wrap {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* Canvas panel */
    .builder-canvas {
      width: 55%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }
    .canvas-inner {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .canvas-add-row {
      margin-top: auto;
      padding-top: 16px;
    }
    .btn-add-row {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-add-row:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* Builder row */
    .builder-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .builder-row:hover { border-color: var(--border-hov); }

    .row-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .drag-handle {
      color: var(--dim);
      font-size: 16px;
      cursor: grab;
      flex-shrink: 0;
      user-select: none;
    }
    .row-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex: 1;
    }
    .col-count-picker {
      display: flex;
      gap: 3px;
    }
    .col-count-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .col-count-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .col-count-btn:hover:not(.active) {
      color: var(--text);
      border-color: var(--border-hov);
    }
    .btn-remove-row {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-remove-row:hover {
      color: var(--remove-hov-fg);
      background: var(--remove-hov-bg);
      border-color: var(--remove-hov-fg);
    }

    /* Column drop zones */
    .row-cols {
      display: flex;
      gap: 8px;
    }
    .builder-col {
      flex: 1;
      min-height: 72px;
      background: var(--input-bg);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s, background 0.2s;
    }
    .builder-col:hover { border-color: var(--border-hov); }

    .col-add-btn {
      width: 100%;
      padding: 6px;
      background: transparent;
      border: none;
      color: var(--dim);
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
    }
    .col-add-btn:hover {
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* Component chips */
    .component-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--surface-hov);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chip-remove {
      background: transparent;
      border: none;
      color: var(--dim);
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
      font-family: var(--font);
      transition: color 0.15s;
    }
    .chip-remove:hover { color: var(--remove-hov-fg); }

    /* ── Component picker ────────────────────────────────────── */

    .picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .picker-panel {
      background: #111;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .picker-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .picker-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .picker-item {
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    .picker-item:hover {
      background: var(--surface-hov);
      border-color: var(--accent);
      color: var(--accent);
    }
    .picker-cancel {
      padding: 8px;
      border-radius: var(--radius-btn);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .picker-cancel:hover { color: var(--text); border-color: var(--border-hov); }

    /* ── Preview panel ────────────────────────────────────────── */

    .builder-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-inner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
    }

    /* Desktop preview frame */
    .preview-frame {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      min-height: 200px;
    }

    /* Phone frame */
    .preview-phone {
      width: 390px;
      max-width: 390px;
      border-radius: 44px;
      border: 3px solid var(--border-hov);
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
      padding: 52px 16px 40px;
      position: relative;
      overflow: hidden;
    }
    /* Phone notch pill */
    .preview-phone::before {
      content: '';
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 22px;
      background: var(--bg);
      border-radius: 100px;
      border: 2px solid var(--border-hov);
    }

    /* Preview rows/cols */
    .preview-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .preview-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .preview-comp {
      border-radius: 6px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 8px 6px;
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .preview-empty-col {
      flex: 1;
      min-height: 40px;
      border-radius: 6px;
      background: transparent;
      border: 1px dashed var(--border);
      opacity: 0.4;
    }

    /* Preview empty state */
    .preview-placeholder {
      text-align: center;
      color: var(--dim);
      font-size: 13px;
      padding: 40px 0;
    }

    /* ── Mobile: single pane + bottom tabs ─────────────────────── */
    .bottom-tabs {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--topbar-bg);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 300;
    }
    .bottom-tabs-inner {
      display: flex;
      height: 100%;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.15s;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* Mobile preview viewport toggle strip */
    .mobile-preview-header {
      display: none;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      justify-content: center;
    }

    /* ── Responsive ──────────────────────────────────────────── */

    @media (max-width: 768px) {
      .builder-canvas,
      .builder-preview {
        width: 100%;
        border-right: none;
      }
      .builder-wrap {
        flex-direction: column;
      }
      /* Hide/show based on active tab via JS class */
      .builder-wrap .builder-canvas.tab-hidden,
      .builder-wrap .builder-preview.tab-hidden {
        display: none;
      }
      .bottom-tabs { display: flex; }
      .mobile-preview-header { display: flex; }
      /* Push content above bottom tabs */
      #layoutBuilder { padding-bottom: 52px; }
    }

    /* Builder section fill height */
    #layoutBuilder {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .builder-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
  </style>
</head>
<body>

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <!-- Mobile Top Bar -->
  <header class="topbar-mobile">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">&#9776;</button>
    <img class="logo-icon" src="/shared/brand/icon.svg" alt="PA">
    <img class="logo-img" src="/shared/brand/logo.svg" alt="PUT.A. Presentation">
  </header>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img class="logo-icon" src="/shared/brand/icon.svg" alt="PA">
      <img class="logo-img" src="/shared/brand/logo.svg" alt="PUT.A. Presentation">
    </div>

    <ul class="sidebar-nav">
      <li>
        <a href="/" class="sidebar-nav-item">
          <span class="nav-icon">&#9632;</span>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="/builder" class="sidebar-nav-item">
          <span class="nav-icon">&#9654;</span>
          <span class="nav-label">Builder</span>
        </a>
      </li>
      <li>
        <a href="/slides" class="sidebar-nav-item active">
          <span class="nav-icon">&#9670;</span>
          <span class="nav-label">Slides</span>
        </a>
      </li>
      <li>
        <a href="/settings" class="sidebar-nav-item">
          <span class="nav-icon">&#9881;</span>
          <span class="nav-label">Settings</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-logout">
      <a href="/auth/logout" class="sidebar-nav-item">
        <span class="nav-icon">&#8617;</span>
        <span class="nav-label">Log out</span>
      </a>
      <div class="sidebar-version">v1.4.6</div>
    </div>

    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar">
      <span class="toggle-icon">&#8249;</span>
    </button>
  </nav>

  <!-- App Body -->
  <div class="app-body" id="appBody">

    <!-- ══ Section A: Layouts Home ══════════════════════════════ -->
    <div id="layoutsHome">
      <main class="main">

        <div class="page-header">
          <h1 class="page-title">Layouts</h1>
          <button class="btn-primary" onclick="createLayout()">+ New Layout</button>
        </div>

        <!-- Empty state -->
        <div class="empty-state" id="layoutsEmpty">
          <div class="empty-icon">&#9783;</div>
          <div class="empty-title">No layouts yet</div>
          <p class="empty-desc">Layouts let you define reusable row and column structures for your slides.</p>
          <button class="btn-primary" onclick="createLayout()">Create your first layout</button>
        </div>

        <!-- Grid of layout cards -->
        <div class="layouts-grid hidden" id="layoutsGrid"></div>

      </main>
    </div>

    <!-- ══ Section B: Layout Builder ════════════════════════════ -->
    <div id="layoutBuilder" class="hidden">

      <!-- Top bar -->
      <div class="builder-topbar">
        <button class="btn-back" onclick="backToLayouts()">&#8592; Back to Layouts</button>
        <input
          class="layout-name-input"
          id="layoutNameInput"
          type="text"
          value="Untitled Layout"
          aria-label="Layout name"
          onblur="saveLayoutName(this.value)"
        >
        <div class="viewport-toggle" id="viewportToggle">
          <button class="viewport-btn active" id="vpDesktop" onclick="setViewMode('desktop')">Desktop</button>
          <button class="viewport-btn" id="vpMobile" onclick="setViewMode('mobile')">Mobile</button>
        </div>
      </div>

      <!-- Builder body: canvas + preview -->
      <div class="builder-body">

        <!-- Canvas (left / edit tab) -->
        <div class="builder-canvas" id="builderCanvas">
          <div class="canvas-inner" id="canvasInner">
            <!-- Rows rendered here by renderCanvas() -->
            <div class="canvas-add-row">
              <button class="btn-add-row" onclick="addRow()">&#43; Add Row</button>
            </div>
          </div>
        </div>

        <!-- Preview (right / preview tab) -->
        <div class="builder-preview" id="builderPreview">
          <!-- Mobile-only: viewport toggle in preview pane -->
          <div class="mobile-preview-header">
            <div class="viewport-toggle">
              <button class="viewport-btn active" id="vpDesktopMobile" onclick="setViewMode('desktop')">Desktop</button>
              <button class="viewport-btn" id="vpMobileMobile" onclick="setViewMode('mobile')">Mobile</button>
            </div>
          </div>
          <div class="preview-inner" id="previewInner">
            <!-- Rendered by renderPreview() -->
          </div>
        </div>

      </div>

      <!-- Mobile bottom tab bar -->
      <div class="bottom-tabs" id="bottomTabs">
        <div class="bottom-tabs-inner">
          <button class="tab-btn active" id="tabEdit" onclick="setActiveTab('edit')">Edit</button>
          <button class="tab-btn" id="tabPreview" onclick="setActiveTab('preview')">Preview</button>
        </div>
      </div>

    </div>

  </div><!-- /.app-body -->

  <!-- Component Picker (overlay) -->
  <div class="picker-overlay hidden" id="pickerOverlay">
    <div class="picker-panel">
      <div class="picker-title">Add Component</div>
      <div class="picker-list" id="pickerList"></div>
      <button class="picker-cancel" onclick="closePicker()">Cancel</button>
    </div>
  </div>

  <script>
    (function () {
      var html = document.documentElement;
      var saved = localStorage.getItem('pb-theme');
      if (saved) html.setAttribute('data-theme', saved);
    })();

    // ── Sidebar JS ──────────────────────────────────────────────
    (function () {
      var sidebar   = document.getElementById('sidebar');
      var overlay   = document.getElementById('sidebarOverlay');
      var toggle    = document.getElementById('sidebarToggle');
      var hamburger = document.getElementById('hamburgerBtn');
      var appBody   = document.getElementById('appBody');

      if (localStorage.getItem('pb-sidebar-collapsed') === '1') {
        sidebar.classList.add('collapsed');
        appBody.classList.add('sidebar-collapsed');
      }

      toggle.addEventListener('click', function () {
        var collapsed = sidebar.classList.toggle('collapsed');
        appBody.classList.toggle('sidebar-collapsed', collapsed);
        localStorage.setItem('pb-sidebar-collapsed', collapsed ? '1' : '0');
      });

      hamburger.addEventListener('click', function () {
        sidebar.classList.add('open');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      });

      overlay.addEventListener('click', function () {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      });
    })();

    // ── State ───────────────────────────────────────────────────
    var layouts       = [];
    var currentLayout = null; // { id, name, rows: [{ cols: [{ components: [] }] }] }
    var viewMode      = 'desktop'; // 'desktop' | 'mobile'
    var activeTab     = 'edit';    // 'edit' | 'preview'

    // Picker state
    var pickerTarget = null; // { rowIdx, colIdx }

    // Save debounce timer
    var saveTimer = null;

    // Component types available in the picker
    var COMPONENT_TYPES = ['Text Block', 'Title', 'Tabs', 'Carousel', 'Table', 'List', 'Button'];

    // ── Layouts list ─────────────────────────────────────────────

    function loadLayouts() {
      fetch('/api/layouts')
        .then(function (res) { return res.json(); })
        .then(function (res) {
          layouts = (res && res.data) ? res.data : [];
          renderLayoutsGrid();
        })
        .catch(function () {
          layouts = [];
          renderLayoutsGrid();
        });
    }

    function renderLayoutsGrid() {
      var empty = document.getElementById('layoutsEmpty');
      var grid  = document.getElementById('layoutsGrid');

      if (layouts.length === 0) {
        empty.classList.remove('hidden');
        grid.classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.classList.remove('hidden');

      grid.innerHTML = '';
      for (var i = 0; i < layouts.length; i++) {
        grid.appendChild(buildLayoutCard(layouts[i]));
      }
    }

    function buildLayoutCard(layout) {
      var totalComponents = 0;
      if (layout.rows) {
        for (var r = 0; r < layout.rows.length; r++) {
          var row = layout.rows[r];
          if (row.cols) {
            for (var c = 0; c < row.cols.length; c++) {
              totalComponents += (row.cols[c].components || []).length;
            }
          }
        }
      }

      var card = document.createElement('div');
      card.className = 'layout-card';

      var name = document.createElement('div');
      name.className = 'layout-card-name';
      name.textContent = layout.name || 'Untitled Layout';

      var meta = document.createElement('div');
      meta.className = 'layout-card-meta';

      var badge = document.createElement('span');
      badge.className = 'badge-count';
      badge.textContent = totalComponents + ' component' + (totalComponents !== 1 ? 's' : '');

      meta.appendChild(badge);

      var actions = document.createElement('div');
      actions.className = 'layout-card-actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'btn-edit';
      editBtn.textContent = 'Edit';
      (function (l) {
        editBtn.addEventListener('click', function () { openBuilder(l); });
      })(layout);

      var delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.textContent = 'Delete';
      (function (l) {
        delBtn.addEventListener('click', function () { deleteLayout(l.id); });
      })(layout);

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      card.appendChild(name);
      card.appendChild(meta);
      card.appendChild(actions);

      return card;
    }

    function createLayout() {
      fetch('/api/layouts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'Untitled Layout', rows: [] })
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          openBuilder(res.data);
        })
        .catch(function (err) {
          console.warn('[layouts] Could not create layout:', err);
        });
    }

    function deleteLayout(id) {
      fetch('/api/layouts/' + id, { method: 'DELETE' })
        .then(function () { loadLayouts(); })
        .catch(function () { loadLayouts(); });
    }

    // ── Builder ──────────────────────────────────────────────────

    function openBuilder(layout) {
      currentLayout = {
        id:   layout.id,
        name: layout.name || 'Untitled Layout',
        rows: layout.rows ? JSON.parse(JSON.stringify(layout.rows)) : []
      };

      document.getElementById('layoutsHome').classList.add('hidden');
      document.getElementById('layoutBuilder').classList.remove('hidden');
      document.getElementById('layoutNameInput').value = currentLayout.name;

      activeTab = 'edit';
      applyTabClasses();
      renderCanvas();
      renderPreview();
    }

    function backToLayouts() {
      document.getElementById('layoutBuilder').classList.add('hidden');
      document.getElementById('layoutsHome').classList.remove('hidden');
      currentLayout = null;
      loadLayouts();
    }

    function saveLayoutName(name) {
      if (!currentLayout) return;
      name = name.trim() || 'Untitled Layout';
      currentLayout.name = name;
      document.getElementById('layoutNameInput').value = name;
      scheduleSave();
    }

    // ── Row / Col / Component manipulation ──────────────────────

    function addRow() {
      if (!currentLayout) return;
      currentLayout.rows.push({ cols: [{ components: [] }] });
      renderCanvas();
      renderPreview();
      scheduleSave();
    }

    function setRowCols(rowIdx, count) {
      if (!currentLayout) return;
      var row = currentLayout.rows[rowIdx];
      if (!row) return;

      var existing = row.cols || [];
      var newCols = [];
      for (var i = 0; i < count; i++) {
        newCols.push(existing[i] || { components: [] });
      }
      row.cols = newCols;

      renderCanvas();
      renderPreview();
      scheduleSave();
    }

    function removeRow(rowIdx) {
      if (!currentLayout) return;
      currentLayout.rows.splice(rowIdx, 1);
      renderCanvas();
      renderPreview();
      scheduleSave();
    }

    function addComponent(rowIdx, colIdx, type) {
      if (!currentLayout) return;
      var col = currentLayout.rows[rowIdx].cols[colIdx];
      col.components.push({ type: type });
      renderCanvas();
      renderPreview();
      scheduleSave();
    }

    function removeComponent(rowIdx, colIdx, compIdx) {
      if (!currentLayout) return;
      currentLayout.rows[rowIdx].cols[colIdx].components.splice(compIdx, 1);
      renderCanvas();
      renderPreview();
      scheduleSave();
    }

    // ── Render: Canvas ───────────────────────────────────────────

    function renderCanvas() {
      var inner = document.getElementById('canvasInner');
      inner.innerHTML = '';

      var rows = currentLayout ? currentLayout.rows : [];

      for (var r = 0; r < rows.length; r++) {
        inner.appendChild(buildRowElement(r, rows[r]));
      }

      // Add Row button always at bottom
      var addWrap = document.createElement('div');
      addWrap.className = 'canvas-add-row';
      var addBtn = document.createElement('button');
      addBtn.className = 'btn-add-row';
      addBtn.innerHTML = '&#43; Add Row';
      addBtn.addEventListener('click', addRow);
      addWrap.appendChild(addBtn);
      inner.appendChild(addWrap);
    }

    function buildRowElement(rowIdx, row) {
      var rowEl = document.createElement('div');
      rowEl.className = 'builder-row';

      // Row header
      var header = document.createElement('div');
      header.className = 'row-header';

      var handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.innerHTML = '&#8942;';
      handle.title = 'Drag to reorder (coming soon)';

      var label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = 'Row ' + (rowIdx + 1);

      var colPicker = document.createElement('div');
      colPicker.className = 'col-count-picker';

      var colCount = (row.cols || []).length;
      for (var n = 1; n <= 3; n++) {
        var btn = document.createElement('button');
        btn.className = 'col-count-btn' + (colCount === n ? ' active' : '');
        btn.textContent = n;
        btn.title = n + ' column' + (n > 1 ? 's' : '');
        (function (count) {
          btn.addEventListener('click', function () { setRowCols(rowIdx, count); });
        })(n);
        colPicker.appendChild(btn);
      }

      var removeBtn = document.createElement('button');
      removeBtn.className = 'btn-remove-row';
      removeBtn.innerHTML = '&#215;';
      removeBtn.title = 'Remove row';
      (function (ri) {
        removeBtn.addEventListener('click', function () { removeRow(ri); });
      })(rowIdx);

      header.appendChild(handle);
      header.appendChild(label);
      header.appendChild(colPicker);
      header.appendChild(removeBtn);

      // Columns
      var colsEl = document.createElement('div');
      colsEl.className = 'row-cols';

      var cols = row.cols || [];
      for (var c = 0; c < cols.length; c++) {
        colsEl.appendChild(buildColElement(rowIdx, c, cols[c]));
      }

      rowEl.appendChild(header);
      rowEl.appendChild(colsEl);

      return rowEl;
    }

    function buildColElement(rowIdx, colIdx, col) {
      var colEl = document.createElement('div');
      colEl.className = 'builder-col';

      var components = col.components || [];
      for (var i = 0; i < components.length; i++) {
        colEl.appendChild(buildChip(rowIdx, colIdx, i, components[i].type));
      }

      // "+" add button
      var addBtn = document.createElement('button');
      addBtn.className = 'col-add-btn';
      addBtn.innerHTML = '&#43;';
      addBtn.title = 'Add component';
      (function (ri, ci) {
        addBtn.addEventListener('click', function () { openPicker(ri, ci); });
      })(rowIdx, colIdx);

      colEl.appendChild(addBtn);
      return colEl;
    }

    function buildChip(rowIdx, colIdx, compIdx, type) {
      var chip = document.createElement('div');
      chip.className = 'component-chip';

      var label = document.createElement('span');
      label.textContent = type;

      var removeBtn = document.createElement('button');
      removeBtn.className = 'chip-remove';
      removeBtn.innerHTML = '&#215;';
      removeBtn.title = 'Remove component';
      (function (ri, ci, idx) {
        removeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          removeComponent(ri, ci, idx);
        });
      })(rowIdx, colIdx, compIdx);

      chip.appendChild(label);
      chip.appendChild(removeBtn);
      return chip;
    }

    // ── Render: Preview ──────────────────────────────────────────

    function renderPreview() {
      var inner = document.getElementById('previewInner');
      inner.innerHTML = '';

      var rows = (currentLayout && currentLayout.rows) ? currentLayout.rows : [];

      var frameEl = document.createElement('div');
      frameEl.className = viewMode === 'mobile' ? 'preview-phone' : 'preview-frame';

      if (rows.length === 0) {
        var ph = document.createElement('div');
        ph.className = 'preview-placeholder';
        ph.textContent = 'Add rows to see a preview';
        frameEl.appendChild(ph);
      } else {
        for (var r = 0; r < rows.length; r++) {
          frameEl.appendChild(buildPreviewRow(rows[r]));
        }
      }

      inner.appendChild(frameEl);
    }

    function buildPreviewRow(row) {
      var rowEl = document.createElement('div');
      rowEl.className = 'preview-row';

      var cols = row.cols || [];
      for (var c = 0; c < cols.length; c++) {
        rowEl.appendChild(buildPreviewCol(cols[c]));
      }

      return rowEl;
    }

    function buildPreviewCol(col) {
      var colEl = document.createElement('div');
      colEl.className = 'preview-col';

      var components = col.components || [];
      if (components.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'preview-empty-col';
        colEl.appendChild(empty);
      } else {
        for (var i = 0; i < components.length; i++) {
          var comp = document.createElement('div');
          comp.className = 'preview-comp';
          comp.textContent = components[i].type.toUpperCase();
          colEl.appendChild(comp);
        }
      }

      return colEl;
    }

    // ── Component picker ─────────────────────────────────────────

    function openPicker(rowIdx, colIdx) {
      pickerTarget = { rowIdx: rowIdx, colIdx: colIdx };

      var list = document.getElementById('pickerList');
      list.innerHTML = '';

      for (var i = 0; i < COMPONENT_TYPES.length; i++) {
        var btn = document.createElement('button');
        btn.className = 'picker-item';
        btn.textContent = COMPONENT_TYPES[i];
        (function (type) {
          btn.addEventListener('click', function () {
            addComponent(pickerTarget.rowIdx, pickerTarget.colIdx, type);
            closePicker();
          });
        })(COMPONENT_TYPES[i]);
        list.appendChild(btn);
      }

      document.getElementById('pickerOverlay').classList.remove('hidden');
    }

    function closePicker() {
      document.getElementById('pickerOverlay').classList.add('hidden');
      pickerTarget = null;
    }

    // Close picker on overlay click
    document.getElementById('pickerOverlay').addEventListener('click', function (e) {
      if (e.target === this) closePicker();
    });

    // ── View mode (desktop / mobile preview) ─────────────────────

    function setViewMode(mode) {
      viewMode = mode;

      // Main topbar toggles
      document.getElementById('vpDesktop').classList.toggle('active', mode === 'desktop');
      document.getElementById('vpMobile').classList.toggle('active', mode === 'mobile');

      // Mobile pane toggles (if they exist)
      var vpdm = document.getElementById('vpDesktopMobile');
      var vpmm = document.getElementById('vpMobileMobile');
      if (vpdm) vpdm.classList.toggle('active', mode === 'desktop');
      if (vpmm) vpmm.classList.toggle('active', mode === 'mobile');

      renderPreview();
    }

    // ── Mobile tab switching ──────────────────────────────────────

    function setActiveTab(tab) {
      activeTab = tab;
      applyTabClasses();
    }

    function applyTabClasses() {
      var canvas  = document.getElementById('builderCanvas');
      var preview = document.getElementById('builderPreview');
      var tabEdit    = document.getElementById('tabEdit');
      var tabPreview = document.getElementById('tabPreview');

      if (activeTab === 'edit') {
        canvas.classList.remove('tab-hidden');
        preview.classList.add('tab-hidden');
        tabEdit.classList.add('active');
        tabPreview.classList.remove('active');
      } else {
        canvas.classList.add('tab-hidden');
        preview.classList.remove('tab-hidden');
        tabEdit.classList.remove('active');
        tabPreview.classList.add('active');
      }
    }

    // ── Save ──────────────────────────────────────────────────────

    function scheduleSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(saveLayout, 800);
    }

    function saveLayout() {
      if (!currentLayout) return;
      fetch('/api/layouts/' + currentLayout.id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: currentLayout.name,
          rows: currentLayout.rows
        })
      }).then(function (res) {
        if (!res.ok) console.warn('[layouts] Save failed:', res.status, res.statusText);
        return res;
      }).catch(function (err) {
        console.warn('[layouts] Save error:', err);
      });
    }

    // ── Init ──────────────────────────────────────────────────────
    loadLayouts();
  </script>
</body>
</html>

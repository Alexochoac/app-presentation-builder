<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LineScanner — Builder Preview</title>
  <link rel="stylesheet" href="/slides/style.css">
  <script src="/slides/components/tracker.js"></script>
  <script src="/slides/components/lightbox.js"></script>
  <script src="/slides/components/carousel.js"></script>
  <script src="/slides/components/tabs.js"></script>
  <script src="/slides/components/list.js"></script>
  <script src="/slides/components/table.js"></script>
  <style>
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 48px; min-height: 48px;
      background: var(--surface, #111);
      border-bottom: 1px solid var(--border, #2a2a2a);
      display: flex; align-items: center;
      padding: 0 16px; z-index: 9999;
    }
    #header-left {
      display: flex; align-items: center; gap: 8px;
      flex: 1; min-width: 0;
    }
    #header-center {
      display: flex; align-items: center; gap: 6px;
    }
    #header-right {
      display: flex; align-items: center; gap: 12px;
      flex: 1; justify-content: flex-end;
    }
    #backBtn {
      display: flex; align-items: center; gap: 6px;
      background: transparent; border: none;
      color: var(--muted, #888); font-size: 13px;
      cursor: pointer; padding: 4px 8px; border-radius: 6px;
      text-decoration: none; white-space: nowrap; font-family: inherit;
    }
    #backBtn:hover { color: var(--text, #e5e5e5); background: var(--hover, #1e1e1e); }
    #presTitle {
      font-size: 14px; font-weight: 600;
      color: var(--text, #e5e5e5); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    #previewBadge {
      background: rgba(245,166,35,.15); border: 1px solid rgba(245,166,35,.35);
      color: rgba(245,166,35,.8); font-size: 10px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 100px; white-space: nowrap;
    }
    #counter {
      font-size: 13px; color: var(--muted, #888); white-space: nowrap;
    }
    #header-center .nav-arrow {
      position: static; transform: none;
      width: 28px; height: 28px; font-size: 16px; flex-shrink: 0;
    }
    #header-center .nav-arrow:active { transform: scale(.93); }
    #header-center .nav-dots {
      position: static; transform: none;
      bottom: auto; left: auto; flex-shrink: 0;
      background: none; border: none; backdrop-filter: none;
      padding: 0; gap: 4px;
    }
    #header-center .nav-dot {
      width: 22px; height: 22px; padding: 0; box-sizing: border-box;
      background: rgba(255,255,255,.12); color: rgba(255,255,255,.4);
      font-size: 10px; font-weight: 600; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .25s;
    }
    #header-center .nav-dot.active {
      background: #F5A623; color: #111;
      width: 22px; border-radius: 50%;
    }
    #header-center .nav-dot:hover:not(.active) {
      background: rgba(255,255,255,.22); color: rgba(255,255,255,.7);
    }
    #saveStatus {
      position: fixed; top: 56px; right: 80px; z-index: 9999;
      font-size: 10px; font-weight: 700; letter-spacing: .10em; text-transform: uppercase;
      color: rgba(255,255,255,.35);
      opacity: 0; transition: opacity .3s;
      pointer-events: none;
    }
    #saveStatus.saving { opacity:1; }
    #saveStatus.saved  { opacity:1; width:8px; height:8px; border-radius:50%; background:#34c759; font-size:0; }
    #saveStatus.error  { opacity:1; color:#f87171; }
    #lb-add-image {
      display:none; position:absolute; bottom:14px; right:18px;
      padding:6px 18px; border-radius:20px;
      background:rgba(245,166,35,.12); border:1px solid rgba(245,166,35,.4);
      color:#F5A623; font-size:12px; font-weight:700; letter-spacing:.05em;
      font-family:inherit; cursor:pointer; transition:all .2s; z-index:10;
    }
    #lb-add-image:hover { background:rgba(245,166,35,.25); }
    #lightbox.has-carousel #lb-add-image { display:block; }
    #unsavedModal {
      display:none; position:fixed; inset:0; z-index:99999;
      background:rgba(0,0,0,.6); align-items:center; justify-content:center;
    }
    #unsavedModal.open { display:flex; }
    #unsavedModal .modal-box {
      background:#1a1a1a; border:1px solid rgba(255,255,255,.12); border-radius:12px;
      padding:28px 32px; max-width:360px; width:90%; text-align:center;
    }
    #unsavedModal h3 { margin:0 0 8px; font-size:15px; color:#fff; font-weight:700; }
    #unsavedModal p  { margin:0 0 24px; font-size:13px; color:rgba(255,255,255,.5); line-height:1.5; }
    #unsavedModal .modal-actions { display:flex; gap:10px; justify-content:center; }
    #unsavedModal button {
      padding:8px 20px; border-radius:8px; border:none; font-size:13px;
      font-weight:700; cursor:pointer; font-family:inherit;
    }
    #unsavedModal #modalSave    { background:#F5A623; color:#111; }
    #unsavedModal #modalDiscard { background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); }
    #unsavedModal #modalCancel  { background:transparent; color:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.15); }
    body { padding-top: 48px; }
    #slidesContainer { height: calc(100dvh - 48px); }
    #presActionsWrap { position: relative; }
    #btnPresActions {
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: 1px solid var(--border, #2a2a2a);
      color: var(--text, #e5e5e5); border-radius: 8px;
      width: 34px; height: 34px;
      font-size: 18px; cursor: pointer; font-family: inherit;
    }
    #btnPresActions:hover { background: rgba(255,255,255,.06); }
    #presActionsMenu {
      display: none;
      position: absolute; top: calc(100% + 6px); left: 0;
      min-width: 200px;
      background: #111; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 4px;
      box-shadow: 0 10px 36px rgba(0,0,0,.7);
      z-index: 99999;
    }
    #presActionsMenu.open { display: block; }
    .footer-menu-item {
      display: block; width: 100%;
      padding: 8px 12px; border: none; background: transparent;
      color: rgba(255,255,255,.85); font-size: 13px; text-align: left;
      border-radius: 7px; cursor: pointer;
      font-family: inherit; white-space: nowrap;
      text-decoration: none; box-sizing: border-box;
    }
    .footer-menu-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    /* ── Translate badge (inside menu item) ── */
    #translateBadge {
      display: none;
      background: #F5A623; color: #111;
      font-size: 10px; font-weight: 800;
      border-radius: 100px; padding: 2px 7px;
      min-width: 18px; text-align: center;
    }
    #translateBadge.visible { display: inline-block; }
    #btnTranslate { display: flex; align-items: center; gap: 6px; }
    #btnTranslate:disabled { opacity: .5; cursor: default; }
    /* ── Preview language switcher ── */
    #previewLangWrap { position: relative; }
    #previewLangBtn {
      display: flex; align-items: center; gap: 5px;
      background: transparent; border: 1px solid var(--border, #2a2a2a);
      color: var(--text, #e5e5e5); border-radius: 8px;
      padding: 0 12px; height: 34px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
    }
    #previewLangBtn:hover { background: rgba(255,255,255,.06); }
    #previewLangBtn.active {
      border-color: rgba(245,166,35,.5);
      color: #F5A623;
      background: rgba(245,166,35,.08);
    }
    #previewLangMenu {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      min-width: 180px;
      background: #111; border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: 4px;
      box-shadow: 0 10px 36px rgba(0,0,0,.7);
      z-index: 99999;
    }
    #previewLangMenu.open { display: block; }
    .lang-menu-item {
      display: block; width: 100%; padding: 8px 12px;
      border: none; background: transparent;
      color: rgba(255,255,255,.85); font-size: 13px; text-align: left;
      border-radius: 7px; cursor: pointer; font-family: inherit;
    }
    .lang-menu-item:hover { background: rgba(255,255,255,.08); }
    .lang-menu-item.active { color: #F5A623; font-weight: 700; }
    #previewLangBanner {
      display: none; position: fixed; top: 48px; left: 0; right: 0;
      background: rgba(245,166,35,.12); border-bottom: 1px solid rgba(245,166,35,.3);
      color: #F5A623; font-size: 12px; font-weight: 600; text-align: center;
      padding: 6px; z-index: 9998; letter-spacing: .02em;
    }
    #previewLangBanner.visible { display: block; }
    /* ── Translation popover ── */
    #translationPanel {
      display: none; position: fixed;
      top: 56px; right: 16px; width: 320px;
      background: #1a1a1a; border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.7);
      z-index: 99998; max-height: calc(100dvh - 80px);
      overflow-y: auto;
    }
    #translationPanel.open { display: block; }
    #translationPanel h4 {
      margin: 0 0 12px; font-size: 13px; font-weight: 700;
      color: #e5e5e5; display: flex; align-items: center; justify-content: space-between;
    }
    #translationPanel h4 button {
      background: none; border: none; color: rgba(255,255,255,.4);
      font-size: 16px; cursor: pointer; padding: 0; line-height: 1;
    }
    .trans-lang-row {
      margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.06); padding-bottom: 12px;
    }
    .trans-lang-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .trans-lang-label {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,.4);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }
    .trans-dirty-dot {
      display: inline-block; width: 6px; height: 6px;
      background: #F5A623; border-radius: 50;
    }
    .trans-current {
      width: 100%; background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1); border-radius: 6px;
      color: #e5e5e5; font-size: 12px; padding: 7px 10px;
      font-family: inherit; resize: vertical; min-height: 48px;
      box-sizing: border-box;
    }
    .trans-current:focus { outline: none; border-color: rgba(245,166,35,.5); }
    .trans-restore-btn {
      background: none; border: none; color: rgba(245,166,35,.7);
      font-size: 11px; cursor: pointer; padding: 4px 0; font-family: inherit;
    }
    .trans-restore-btn:hover { color: #F5A623; }
    .trans-placeholder { font-size: 12px; color: rgba(255,255,255,.25); font-style: italic; }
    #tc-table th { position:sticky;top:0;background:#1a1a1a;color:rgba(255,255,255,.5);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1); }
    #tc-table td { padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top; }
    #tc-table tr:hover td { background:rgba(255,255,255,.03); }
    .tc-slide-header td { background:#1a1a1a;color:rgba(255,255,255,.5);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px; }
    .tc-cell-en { color:rgba(255,255,255,.7);max-width:280px;word-break:break-word; }
    .tc-cell-lang { min-width:180px; }
    .tc-cell-lang textarea { width:100%;background:transparent;border:1px solid transparent;border-radius:6px;color:#e5e5e5;font-size:12px;font-family:inherit;resize:vertical;min-height:36px;padding:4px 6px;line-height:1.4; }
    .tc-cell-lang textarea:focus { outline:none;border-color:rgba(255,255,255,.2);background:#1a1a1a; }
    .tc-cell-lang textarea.dirty { border-color:#F5A623 !important; }
    .tc-cell-lang textarea.missing { border-color:#f87171 !important; }
    .tc-field-key { color:rgba(255,255,255,.3);font-size:11px;font-family:monospace; }
    .slide-logo-row img { height: 28px !important; }
    .slide-logo-ls { height: 26px !important; }
    .slide-logo-sep { height: 26px !important; }
  </style>
</head>
<body>

  <div class="glow-orb a"></div>
  <div class="glow-orb b"></div>

  <div id="header">
    <div id="header-left">
      <a id="backBtn" href="#" onclick="handleBack(); return false;">&#8592; Back</a>
      <div id="presTitle">Builder Preview</div>
      <div id="presActionsWrap">
        <button id="btnPresActions" onclick="document.getElementById('presActionsMenu').classList.toggle('open')" title="Menu">&#9776;</button>
        <div id="presActionsMenu">
          <button class="footer-menu-item" onclick="window.location.href='/slides?create'">&#128196; Create Presentation</button>
          <button class="footer-menu-item" onclick="window.location.href='/slides?replace'">&#8635; Replace Presentation</button>
          <hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:4px 0;">
          <button class="footer-menu-item" onclick="document.getElementById('presActionsMenu').classList.remove('open');openTranslationSettings()">&#9881; Translation Settings</button>
        </div>
      </div>
      <div id="previewLangWrap">
        <button id="previewLangBtn" onclick="document.getElementById('previewLangMenu').classList.toggle('open')" title="Preview language">
          <span id="previewLangFlag">&#127760;</span> <span id="previewLangLabel">EN</span> &#9662;
        </button>
        <div id="previewLangMenu"></div>
      </div>
    </div>
    <div id="header-center">
      <button class="nav-arrow prev hidden" id="btnPrev">&#8249;</button>
      <div class="nav-dots" id="navDots"></div>
      <button class="nav-arrow next hidden" id="btnNext">&#8250;</button>
    </div>
    <div id="header-right">
      <div id="previewBadge">Preview</div>
      <div id="counter"></div>
    </div>
  </div>

  <div class="slides-container" id="slidesContainer"></div>
  <div id="saveStatus"></div>
  <div id="previewLangBanner">Editing in <span id="previewLangBannerName"></span> — type directly into any field, changes auto-save</div>

  <!-- Translation settings modal -->
  <div id="translationSettingsModal" style="
    display:none; position:fixed; inset:0; z-index:99999;
    background:rgba(0,0,0,.6); align-items:center; justify-content:center;">
    <div style="
      background:#1a1a1a; border:1px solid rgba(255,255,255,.12); border-radius:14px;
      padding:28px 28px 24px; width:400px; max-width:92vw; max-height:90vh; overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <div style="font-size:15px;font-weight:700;color:#e5e5e5;">&#127760; Translation Settings</div>
        <button onclick="closeTranslationSettings()" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:0;">&#10005;</button>
      </div>

      <div style="margin-bottom:8px;">
        <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;">Active Languages</div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input id="tsLangInput" type="text" placeholder="Search and add a language…"
            style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#111;color:#e5e5e5;font-size:13px;font-family:inherit;"
            oninput="filterTsLangs(this.value)" onfocus="showTsDropdown()" onblur="setTimeout(hideTsDropdown,150)">
        </div>
        <div id="tsLangDropdown" style="display:none;background:#111;border:1px solid rgba(255,255,255,.12);border-radius:8px;max-height:150px;overflow-y:auto;margin-bottom:8px;"></div>
        <div id="tsActiveLangs" style="display:flex;flex-wrap:wrap;gap:6px;min-height:10px;"></div>
      </div>

      <p id="tsError" style="display:none;color:#f87171;font-size:12px;margin:8px 0 0;"></p>

      <button id="btnOpenTC" onclick="saveAndOpenTC()" style="width:100%;padding:10px 18px;border-radius:8px;border:1px solid rgba(245,166,35,.3);background:transparent;color:#F5A623;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <span id="tcBtnLabel">&#128196; Open Translation Center &rarr;</span>
        <span id="translateBadge" style="background:#F5A623;color:#111;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;display:none;"></span>
      </button>
      <div style="display:flex;gap:8px;margin-top:20px;">
        <button onclick="closeTranslationSettings()" style="flex:0 0 auto;padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Cancel</button>
        <button onclick="saveTranslationSettings()" id="tsSaveBtn" style="flex:1;padding:8px 18px;border-radius:8px;border:none;background:#F5A623;color:#111;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">Save</button>
      </div>
    </div>
  </div>

  <!-- Translation panel (per-field) -->
  <div id="translationPanel">
    <h4>Translations <button onclick="closeTranslationPanel()">&#10005;</button></h4>
    <div id="translationPanelBody"></div>
  </div>

  <!-- Translation Center -->
  <div id="translationCenter" style="display:none;position:fixed;inset:0;z-index:99998;background:#111;flex-direction:column;">
    <div id="tc-header" style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;">
      <button onclick="closeTranslationCenter()" style="background:none;border:none;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;padding:0;line-height:1;">&#8592;</button>
      <div style="font-size:15px;font-weight:700;color:#e5e5e5;flex:1;">&#127760; Translation Center</div>
      <button id="btnTranslateAll" onclick="handleTranslateAllClick()" style="padding:8px 20px;border-radius:8px;border:none;background:#F5A623;color:#111;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">
        Translate Missing &amp; Changed <span id="translateAllBadge" style="display:none;background:#111;color:#F5A623;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;"></span>
      </button>
    </div>
    <div style="padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;">
      <input id="tcSearch" type="text" placeholder="Filter fields…" oninput="filterTcRows(this.value)"
        style="width:100%;max-width:360px;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#1a1a1a;color:#e5e5e5;font-size:13px;font-family:inherit;">
    </div>
    <div id="tc-table-wrap" style="flex:1;overflow:auto;padding:0 20px 20px;">
      <div id="tc-loading" style="padding:40px;text-align:center;color:rgba(255,255,255,.4);">Loading…</div>
      <table id="tc-table" style="display:none;width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;">
        <thead id="tc-thead"></thead>
        <tbody id="tc-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox">
    <div id="lb-inner">
      <button id="lb-close">&#10005;</button>
      <button id="lb-prev" class="lb-nav-btn">&#8249;</button>
      <div id="lb-stage">
        <img id="lb-img" src="" alt="">
        <div id="lb-cap"></div>
      </div>
      <button id="lb-next" class="lb-nav-btn">&#8250;</button>
      <div id="lb-thumbs"></div>
      <button id="lb-add-image" title="Add image to this carousel">+ Add Image</button>
    </div>
  </div>

  <div id="unsavedModal">
    <div class="modal-box">
      <h3>Unsaved Changes</h3>
      <p>Your last edit may not have saved yet.<br>Save before leaving?</p>
      <div class="modal-actions">
        <button id="modalSave">Save &amp; Back</button>
        <button id="modalDiscard">Discard</button>
        <button id="modalCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script>
  // ── Lightbox "Add Image" button ──────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function () {
    var lbAddImg = document.getElementById('lb-add-image');
    if (lbAddImg) {
      lbAddImg.addEventListener('click', function () {
        if (window.Lightbox) Lightbox.triggerAddImage();
      });
    }
  });

  // ── Slide list ──────────────────────────────────────────────────────────────
  // Populated async from /api/deck before init runs
  var SLIDES = [];

  async function loadDeck() {
    const res  = await fetch('/api/deck');
    if (!res.ok) throw new Error('GET /api/deck returned ' + res.status);
    const deck = await res.json();
    if (!deck.data || !deck.data.slides) throw new Error('Unexpected deck response: ' + JSON.stringify(deck));
    if (deck.accentCss) {
      var accentStyle = document.createElement('style');
      accentStyle.textContent = deck.accentCss;
      document.head.appendChild(accentStyle);
    }
    return deck.data.slides
      .filter(function(s) { return s.visible; })
      .map(function(s) {
        return {
          id: s.id,
          file: '/slides/' + s.id + '.html',
          name: s.name || s.id.replace(/^deck-/, ''),
          librarySlideId: s.librarySlideId || null
        };
      });
  }

  // ── State ───────────────────────────────────────────────────────────────────
  var current        = 0;
  var slideEls       = [];
  var loaded         = {};   // { index: htmlString }
  var slideStartTime = null;

  // ── Fetch a slide HTML fragment ──────────────────────────────────────────────
  function fetchSlide(index) {
    if (loaded[index]) return Promise.resolve(loaded[index]);
    return fetch(SLIDES[index].file)
      .then(function (r) { return r.text(); })
      .then(function (html) { loaded[index] = html; return html; });
  }

  // ── Inject a slide into the container ───────────────────────────────────────
  function injectSlide(index, html) {
    if (slideEls[index]) return slideEls[index];
    var frag = document.createRange().createContextualFragment(html);
    var el   = frag.querySelector('.slide');
    if (!el) {
      el = document.createElement('div');
      el.className = 'slide';
      el.appendChild(frag);
    }
    document.getElementById('slidesContainer').appendChild(el);
    slideEls[index] = el;
    if (window.Lightbox) Lightbox.init(el);
    if (window.Carousel) Carousel.init(el);
    if (window.Tabs)    Tabs.init(el);
    if (window.List)    List.init(el);
    if (window.LSTable) LSTable.init(el);
    if (typeof previewLang !== 'undefined' && previewLang !== 'en') {
      setTimeout(function () { applyPreviewLang(previewLang); }, 50);
    }
    return el;
  }

  // ── Track analytics ──────────────────────────────────────────────────────────
  function trackEnter(index) {
    slideStartTime = Date.now();
    if (window.umami) umami.track('slide:' + SLIDES[index].name);
  }

  function trackExit(index) {
    if (slideStartTime === null) return;
    var seconds = Math.round((Date.now() - slideStartTime) / 1000);
    slideStartTime = null;
    if (window.umami && seconds > 0) {
      umami.track('slide:' + SLIDES[index].name + ':time', { seconds: seconds });
    }
  }

  // ── Navigate to a slide ──────────────────────────────────────────────────────
  function goTo(index, direction) {
    if (index < 0 || index >= SLIDES.length) return;
    var prevIndex = current;

    // Track exit of previous slide
    trackExit(prevIndex);

    // Animate out
    if (slideEls[prevIndex]) {
      slideEls[prevIndex].classList.add(direction === 1 ? 'exit-left' : 'exit-right');
      slideEls[prevIndex].classList.remove('active');
    }

    current = index;

    // Show new slide (already preloaded)
    fetchSlide(index).then(function (html) {
      var el = injectSlide(index, html);

      // Reset entry animations
      el.querySelectorAll('.anim-in').forEach(function (node) {
        node.style.animation = 'none';
        node.offsetHeight; // reflow
        node.style.animation = '';
      });

      setTimeout(function () {
        if (slideEls[prevIndex]) slideEls[prevIndex].classList.remove('exit-left', 'exit-right');
      }, 700);

      el.classList.add('active');
      trackEnter(index);
      updateNav();

      // Preload next slide in background
      if (index + 1 < SLIDES.length) fetchSlide(index + 1);
    });
  }

  // ── Update nav UI ────────────────────────────────────────────────────────────
  function updateNav() {
    var btnPrev = document.getElementById('btnPrev');
    var btnNext = document.getElementById('btnNext');
    btnPrev.classList.toggle('hidden', current === 0);
    btnNext.classList.toggle('hidden', current === SLIDES.length - 1);
    var txt = (current + 1) + ' / ' + SLIDES.length;
    document.getElementById('counter').textContent = txt;
    document.querySelectorAll('.nav-dot').forEach(function (dot, i) {
      dot.classList.toggle('active', i === current);
    });
  }

  // ── Build nav dots ───────────────────────────────────────────────────────────
  function buildDots() {
    var container = document.getElementById('navDots');
    SLIDES.forEach(function (_, i) {
      var dot = document.createElement('div');
      dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
      dot.textContent = String(i + 1);
      dot.addEventListener('click', function () { goTo(i, i > current ? 1 : -1); });
      container.appendChild(dot);
    });
  }

  // ── Button handlers ──────────────────────────────────────────────────────────
  document.getElementById('btnPrev').addEventListener('click', function () { goTo(current - 1, -1); });
  document.getElementById('btnNext').addEventListener('click', function () { goTo(current + 1,  1); });

  // ── Keyboard ─────────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    if (e.target.isContentEditable) return;
    if (['BUTTON', 'A', 'INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ')     { e.preventDefault(); goTo(current + 1,  1); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'Backspace') { e.preventDefault(); goTo(current - 1, -1); }
  });

  // ── Touch swipe ──────────────────────────────────────────────────────────────
  var touchStartX = 0;
  var touchStartY = 0;
  document.addEventListener('touchstart', function (e) {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    var dx = touchStartX - e.changedTouches[0].clientX;
    var dy = touchStartY - e.changedTouches[0].clientY;
    // Only trigger if horizontal swipe is dominant and far enough
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      goTo(dx > 0 ? current + 1 : current - 1, dx > 0 ? 1 : -1);
    }
  });

  // ── Carousel save (any slide dispatches slide-carousel-save) ─────────────
  document.addEventListener('slide-carousel-save', function (e) {
    var slideDef = SLIDES[current];
    var editKey  = e.detail.editKey || 'carousel-track';
    var body     = { slide: slideDef.file.replace('/slides/', '').replace('.html', ''), edits: {} };
    if (e.detail.html != null) body.edits[editKey] = e.detail.html;
    if (e.detail.autoplay != null) {
      body.attrs = {};
      body.attrs[editKey] = { 'data-autoplay': e.detail.autoplay };
      body.edits['__attr:' + editKey + ':data-autoplay'] = String(e.detail.autoplay);
    }
    console.log('[carousel-save] slideDef:', JSON.stringify({ id: slideDef.id, librarySlideId: slideDef.librarySlideId }));
    console.log('[carousel-save] body.edits:', JSON.stringify(body.edits));
    showSaveStatus('saving');
    var carFetch;
    if (slideDef.librarySlideId) {
      carFetch = fetch('/api/deck/slides/' + slideDef.id + '/edits', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ edits: body.edits })
      });
    } else {
      carFetch = fetch('/api/save', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body)
      });
    }
    carFetch
      .then(function (r) { return r.json(); })
      .then(function (d) {
        console.log('[carousel-save] API response:', JSON.stringify(d));
        showSaveStatus(d.ok ? 'saved' : 'error');
        if (d.ok) delete loaded[current];
      })
      .catch(function (err) {
        console.error('[carousel-save] fetch error:', err);
        showSaveStatus('error');
      });
  });

  // ── Image change (dispatched by slides after upload) ─────────────────────
  document.addEventListener('slide-image-change', function (e) {
    var slideDef = SLIDES[current];
    showSaveStatus('saving');
    var imgFetch;
    if (slideDef.librarySlideId) {
      var imgEdits = {};
      imgEdits[e.detail.editKey] = e.detail.src;
      imgFetch = fetch('/api/deck/slides/' + slideDef.id + '/edits', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ edits: imgEdits })
      });
    } else {
      var filename = slideDef.file.replace('/slides/', '').replace('.html', '');
      imgFetch = fetch('/api/save-image-src', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ slide: filename, editKey: e.detail.editKey, src: e.detail.src })
      });
    }
    imgFetch
      .then(function (r) { return r.json(); })
      .then(function (data) { showSaveStatus(data.ok ? 'saved' : 'error'); })
      .catch(function ()   { showSaveStatus('error'); });
  });

  // ── Auto-save ────────────────────────────────────────────────────────────────
  var saveTimer      = null;
  var saveStatus     = document.getElementById('saveStatus');
  var dirtyEditKeys  = new Set();

  function showSaveStatus(state) {
    saveStatus.className = state;
    saveStatus.textContent = state === 'saving' ? 'Saving…' : state === 'error' ? 'Save failed' : '';
    // error fades after a moment; saved dot stays until next edit
    if (state === 'error') setTimeout(function () { saveStatus.className = ''; }, 3000);
  }

  function doSave() {
    var slideEl  = slideEls[current];
    var slideDef = SLIDES[current];
    if (!slideEl || !slideDef) return Promise.resolve();

    var edits = {};
    slideEl.querySelectorAll('[data-edit][contenteditable]').forEach(function (el) {
      edits[el.getAttribute('data-edit')] = el.innerHTML;
    });

    // Also save [data-edit] containers whose children were edited (e.g. list items)
    dirtyEditKeys.forEach(function(key) {
      if (edits[key]) return; // already saved by standard path
      var container = slideEl.querySelector('[data-edit="' + key + '"]');
      if (!container) return;
      var clone = container.cloneNode(true);
      clone.querySelectorAll('[data-builder-only]').forEach(function(n) { n.remove(); });
      edits[key] = clone.innerHTML;
    });
    dirtyEditKeys.clear();

    if (Object.keys(edits).length === 0) return Promise.resolve();

    showSaveStatus('saving');

    var fetchPromise;
    if (slideDef.librarySlideId) {
      // Library-backed slide — save edits via deck slide id (server routes to library)
      fetchPromise = fetch('/api/deck/slides/' + slideDef.id + '/edits', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ edits: edits })
      });
    } else {
      // Hardcoded HTML slide — save to file
      var filename = slideDef.file.replace('/slides/', '').replace('.html', '');
      fetchPromise = fetch('/api/save', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ slide: filename, edits: edits })
      });
    }

    return fetchPromise
    .then(function (r) { return r.json(); })
    .then(function (data) {
      showSaveStatus(data.ok ? 'saved' : 'error');
    })
    .catch(function () { showSaveStatus('error'); });
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1500);
  }

  // Flush pending save on page unload (handles Ctrl+R / close-tab)
  window.addEventListener('beforeunload', function () {
    if (saveTimer !== null && previewLang === 'en') {
      clearTimeout(saveTimer);
      saveTimer = null;
      doSave();
    }
  });

  // Listen for edits anywhere in the slides container
  document.getElementById('slidesContainer').addEventListener('input', function (e) {
    var el = e.target;
    while (el) {
      if (el.hasAttribute('data-edit')) {
        dirtyEditKeys.add(el.getAttribute('data-edit'));
        break;
      }
      el = el.parentElement;
    }
    scheduleSave();
  });

  // ── Init ─────────────────────────────────────────────────────────────────────
  loadDeck().then(function (slides) {
    SLIDES = slides;

    buildDots();

    // Load slide 0, preload slide 1
    fetchSlide(0).then(function (html) {
      injectSlide(0, html);
      slideEls[0].classList.add('active');
      trackEnter(0);
      updateNav();
      if (SLIDES.length > 1) fetchSlide(1);
    }).catch(function (err) {
      document.getElementById('slidesContainer').innerHTML =
        '<div style="color:#f87171;padding:40px;font-family:monospace">Failed to load slide: ' + err.message + '</div>';
    });
  }).catch(function (err) {
    document.getElementById('slidesContainer').innerHTML =
      '<div style="color:#f87171;padding:40px;font-family:monospace">Failed to load deck: ' + err.message + '</div>';
  });
  // ── Back with unsaved-changes guard ──────────────────────────────────────────
  var lastSaveState = '';
  var origShowSaveStatus = showSaveStatus;
  showSaveStatus = function(state) {
    lastSaveState = state;
    origShowSaveStatus(state);
  };

  function handleBack() {
    var hasPending = saveTimer !== null;
    var hasError   = lastSaveState === 'error';
    if (!hasPending && !hasError) { history.back(); return; }
    document.getElementById('unsavedModal').classList.add('open');
  }

  document.getElementById('modalCancel').addEventListener('click', function () {
    document.getElementById('unsavedModal').classList.remove('open');
  });

  document.getElementById('modalDiscard').addEventListener('click', function () {
    clearTimeout(saveTimer);
    saveTimer = null;
    history.back();
  });

  document.getElementById('modalSave').addEventListener('click', function () {
    document.getElementById('unsavedModal').classList.remove('open');
    clearTimeout(saveTimer);
    saveTimer = null;
    doSave().then(function () { history.back(); }).catch(function () { history.back(); });
  });

  document.addEventListener('click', function (e) {
    var wrap = document.getElementById('presActionsWrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('presActionsMenu').classList.remove('open');
    }
    var langWrap = document.getElementById('previewLangWrap');
    if (langWrap && !langWrap.contains(e.target)) {
      document.getElementById('previewLangMenu').classList.remove('open');
    }
    // Close translation panel when clicking outside
    var panel = document.getElementById('translationPanel');
    if (panel && panel.classList.contains('open') && !panel.contains(e.target)) {
      panel.classList.remove('open');
    }
  });

  // ── Translation UI ────────────────────────────────────────────────────────────
  var translationsData = null;

  function loadTranslations() {
    return fetch('/api/translations')
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.success) {
          translationsData = res.data;
          updateTranslateBadge();
          buildLangMenu();
        }
      })
      .catch(function () {});
  }

  function updateTranslateBadge() {
    var badge = document.getElementById('translateBadge');
    if (!badge) return;
    if (!translationsData) { badge.style.display = 'none'; return; }
    var count = 0;
    var langs = (translationsData.languages || []).filter(function (l) { return l !== 'en'; });
    Object.values(translationsData.fields || {}).forEach(function (field) {
      langs.forEach(function (lang) {
        if (!field[lang] || !field[lang].current || field[lang].dirty) count++;
      });
    });
    Object.values(translationsData.slides || {}).forEach(function (slideFields) {
      Object.values(slideFields).forEach(function (field) {
        langs.forEach(function (lang) {
          if (typeof field[lang] === 'object' && (!field[lang].current || field[lang].dirty)) count++;
        });
      });
    });
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline' : 'none';
  }

  function saveAndOpenTC() {
    var btn = document.getElementById('btnOpenTC');
    var label = document.getElementById('tcBtnLabel');
    var errEl = document.getElementById('tsError');
    if (btn && btn.disabled) return;
    errEl.style.display = 'none';
    if (btn) btn.disabled = true;
    if (label) label.textContent = 'Saving…';

    if (!_tsActiveLangs.includes('en')) _tsActiveLangs.unshift('en');
    fetch('/api/translations/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ languages: _tsActiveLangs, defaultLanguage: 'en', favorites: _tsActiveLangs.filter(function(c){ return c !== 'en'; }) })
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.success) throw new Error(res.error || 'Failed to save');
      translationsData = res.data;
      buildLangMenu();
      openTranslationCenter();
    })
    .catch(function(err){
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      if (btn) btn.disabled = false;
      if (label) label.textContent = '&#128196; Open Translation Center →';
    });
  }

  function openTranslationPanel(fieldKey) {
    if (!translationsData) { loadTranslations().then(function () { openTranslationPanel(fieldKey); }); return; }
    var langs = (translationsData.languages || []).filter(function (l) { return l !== 'en'; });
    var fields = translationsData.fields || {};
    var slideId = SLIDES[current] && SLIDES[current].librarySlideId;
    var slideStore = (translationsData.slides && slideId && translationsData.slides[slideId]) || {};
    var body = document.getElementById('translationPanelBody');

    if (langs.length === 0) {
      body.innerHTML = '<p style="font-size:12px;color:rgba(255,255,255,.35);">No languages configured. Add languages in deck translation settings.</p>';
      document.getElementById('translationPanel').classList.add('open');
      return;
    }

    var html = '';
    langs.forEach(function (lang) {
      // Per-slide entry takes priority; fall back to global
      var entry = (slideStore[fieldKey] && slideStore[fieldKey][lang]) || (fields[fieldKey] && fields[fieldKey][lang]);
      var current = entry && entry.current ? entry.current : '';
      var previous = entry && entry.previous ? entry.previous : null;
      var dirty = entry && entry.dirty;
      var sid = slideId || '';
      html += '<div class="trans-lang-row" data-lang="' + lang + '">';
      html += '<div class="trans-lang-label">' + lang.toUpperCase();
      if (dirty) html += ' <span class="trans-dirty-dot" title="Outdated"></span>';
      html += '</div>';
      if (current) {
        html += '<textarea class="trans-current" data-field="' + fieldKey + '" data-lang="' + lang + '" data-slide="' + sid + '" rows="2">' + current + '</textarea>';
      } else {
        html += '<div class="trans-placeholder">Not yet translated</div>';
        html += '<textarea class="trans-current" data-field="' + fieldKey + '" data-lang="' + lang + '" data-slide="' + sid + '" rows="2" placeholder="Type correction…"></textarea>';
      }
      if (previous) {
        html += '<button class="trans-restore-btn" data-field="' + fieldKey + '" data-lang="' + lang + '" data-slide="' + sid + '" onclick="restoreTranslation(this)" title="' + previous + '">&#8635; Restore: ' + previous.substring(0, 40) + (previous.length > 40 ? '…' : '') + '</button>';
      }
      html += '</div>';
    });

    body.innerHTML = html;

    // Save on blur — include slideId so translation is stored per-slide
    body.querySelectorAll('.trans-current').forEach(function (ta) {
      ta.addEventListener('blur', function () {
        var fk  = ta.getAttribute('data-field');
        var lg  = ta.getAttribute('data-lang');
        var sid = ta.getAttribute('data-slide') || null;
        fetch('/api/translations/field', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fieldKey: fk, language: lg, value: ta.value, slideId: sid || undefined })
        }).then(function (r) { return r.json(); })
          .then(function (res) { if (res.success) loadTranslations().then(function () { applyPreviewLang(previewLang); }); });
      });
    });

    document.getElementById('translationPanel').classList.add('open');
  }

  function restoreTranslation(btn) {
    var fk  = btn.getAttribute('data-field');
    var lg  = btn.getAttribute('data-lang');
    var sid = btn.getAttribute('data-slide') || null;
    fetch('/api/translations/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fieldKey: fk, language: lg, slideId: sid || undefined })
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.success) { loadTranslations().then(function () { openTranslationPanel(fk); }); }
      });
  }

  function closeTranslationPanel() {
    document.getElementById('translationPanel').classList.remove('open');
  }

  // Hook: clicking a [data-edit] field shows translation panel
  document.getElementById('slidesContainer').addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== this) {
      if (el.hasAttribute('data-edit') && el.hasAttribute('contenteditable')) {
        openTranslationPanel(el.getAttribute('data-edit'));
        return;
      }
      el = el.parentElement;
    }
  });

  // ── Preview language switcher ─────────────────────────────────────────────
  var previewLang = 'en';
  var enSnapshot = {};

  var LANG_FLAGS = {
    en: '🇬🇧', es: '🇪🇸', fr: '🇫🇷', de: '🇩🇪', it: '🇮🇹',
    pt: '🇵🇹', nl: '🇳🇱', ja: '🇯🇵', zh: '🇨🇳', ko: '🇰🇷',
    ar: '🇸🇦', ru: '🇷🇺', pl: '🇵🇱', sv: '🇸🇪', da: '🇩🇰',
    fi: '🇫🇮', nb: '🇳🇴', tr: '🇹🇷', cs: '🇨🇿', hu: '🇭🇺',
    ro: '🇷🇴', el: '🇬🇷', he: '🇮🇱', hi: '🇮🇳', th: '🇹🇭'
  };
  function langFlag(code) { return LANG_FLAGS[code] || '🌐'; }

  function snapshotEnglish() {
    slideEls.forEach(function (slideEl, idx) {
      if (!slideEl) return;
      slideEl.querySelectorAll('[data-edit][contenteditable]').forEach(function (el) {
        var snapKey = idx + '/' + el.getAttribute('data-edit');
        if (!enSnapshot[snapKey]) enSnapshot[snapKey] = el.innerHTML;
      });
    });
  }

  function buildLangMenu() {
    if (!translationsData) return;
    var langs = translationsData.languages || ['en'];
    var menu = document.getElementById('previewLangMenu');
    menu.innerHTML = '';
    langs.forEach(function (code) {
      var btn = document.createElement('button');
      btn.className = 'lang-menu-item' + (code === previewLang ? ' active' : '');
      btn.textContent = langFlag(code) + ' ' + code.toUpperCase();
      btn.onclick = function () {
        document.getElementById('previewLangMenu').classList.remove('open');
        setPreviewLang(code);
      };
      menu.appendChild(btn);
    });
  }

  function setPreviewLang(lang) {
    if (previewLang === 'en' && lang !== 'en') snapshotEnglish();
    previewLang = lang;
    var isEn = lang === 'en';

    // Update button label + flag + style
    document.getElementById('previewLangFlag').textContent = langFlag(lang);
    document.getElementById('previewLangLabel').textContent = lang.toUpperCase();
    document.getElementById('previewLangBtn').classList.toggle('active', !isEn);

    // Show/hide banner
    var banner = document.getElementById('previewLangBanner');
    if (!isEn) {
      var langObj = (_tsAllLangs || []).find(function (l) { return l.code === lang; });
      document.getElementById('previewLangBannerName').textContent = langObj ? langObj.name : lang.toUpperCase();
      banner.classList.add('visible');
    } else {
      banner.classList.remove('visible');
    }

    // Update all visible [data-edit] fields
    applyPreviewLang(lang);
    buildLangMenu();
  }

  function applyPreviewLang(lang) {
    var fields = translationsData && translationsData.fields ? translationsData.fields : {};
    slideEls.forEach(function (slideEl, idx) {
      if (!slideEl) return;
      var libSlideId = SLIDES[idx] && SLIDES[idx].librarySlideId;
      var slideStore = (translationsData && translationsData.slides && libSlideId && translationsData.slides[libSlideId]) || {};
      slideEl.querySelectorAll('[data-edit]').forEach(function (el) {
        var key     = el.getAttribute('data-edit');
        var snapKey = idx + '/' + key;
        if (!el.hasAttribute('contenteditable')) return;
        if (lang === 'en') {
          if (enSnapshot[snapKey] !== undefined) el.innerHTML = enSnapshot[snapKey];
          el.contentEditable = 'true';
        } else {
          var entry = slideStore[key] && slideStore[key][lang];
          if (!entry) {
            var globalEntry = fields[key] && fields[key][lang];
            var globalEn    = fields[key] && (fields[key]['en'] || '');
            var slideEn     = enSnapshot[snapKey] !== undefined ? enSnapshot[snapKey] : el.innerHTML;
            if (globalEntry && globalEn && slideEn.trim() === globalEn.trim()) {
              entry = globalEntry;
            }
          }
          if (entry && entry.current) el.innerHTML = entry.current;
        }
      });
    });
  }

  // Save non-English field on blur → translations store
  document.getElementById('slidesContainer').addEventListener('focusout', function (e) {
    if (previewLang === 'en') return;
    var el = e.target;
    if (!el.hasAttribute('data-edit') || !el.hasAttribute('contenteditable')) return;
    // Find which loaded slide owns this element (avoids wrong save if focus moves between slides)
    var ownerIdx = slideEls.findIndex(function (se) { return se && se.contains(el); });
    var slideId = ownerIdx >= 0 && SLIDES[ownerIdx] && SLIDES[ownerIdx].librarySlideId;
    if (!slideId) return;
    var fieldKey = el.getAttribute('data-edit');
    var value = el.innerHTML;
    fetch('/api/translations/field', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slideId: slideId, fieldKey: fieldKey, language: previewLang, value: value })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.success) loadTranslations();
    });
  });

  // Block autosave when previewing a non-English language
  var _origScheduleSave = scheduleSave;
  scheduleSave = function () {
    if (previewLang !== 'en') return;
    _origScheduleSave();
  };

  // Close lang menu on outside click
  document.addEventListener('click', function (e) {
    var wrap = document.getElementById('previewLangWrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('previewLangMenu').classList.remove('open');
    }
  });

  // Load translations on init
  loadTranslations();

  // ── Translation Settings modal ────────────────────────────────────────────
  var _tsAllLangs = [];
  var _tsActiveLangs = [];

  function openTranslationSettings() {
    var modal = document.getElementById('translationSettingsModal');
    modal.style.display = 'flex';

    // Load all languages + current settings in parallel
    Promise.all([
      fetch('/api/languages').then(function (r) { return r.json(); }),
      fetch('/api/translations').then(function (r) { return r.json(); })
    ]).then(function (results) {
      var langsRes = results[0];
      var transRes = results[1];
      if (langsRes.success) _tsAllLangs = langsRes.data;
      var current = transRes.success ? transRes.data : { languages: ['en'] };
      _tsActiveLangs = (current.languages || ['en']).slice();

      renderTsActiveLangs();
    }).catch(function () {
      document.getElementById('tsError').textContent = 'Failed to load settings.';
      document.getElementById('tsError').style.display = 'block';
    });
  }

  function closeTranslationSettings() {
    document.getElementById('translationSettingsModal').style.display = 'none';
    document.getElementById('tsLangInput').value = '';
    hideTsDropdown();
  }

  function renderTsActiveLangs() {
    var container = document.getElementById('tsActiveLangs');
    container.innerHTML = '';
    _tsActiveLangs.forEach(function (code) {
      var lang = _tsAllLangs.find(function (l) { return l.code === code; });
      var tag = document.createElement('span');
      tag.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.3);color:#F5A623;font-size:12px;font-weight:600;padding:3px 10px;border-radius:100px;';
      tag.textContent = lang ? lang.name : code;
      if (code !== 'en') {
        var rm = document.createElement('button');
        rm.textContent = '×';
        rm.style.cssText = 'background:none;border:none;color:#F5A623;cursor:pointer;padding:0;font-size:14px;line-height:1;';
        rm.onclick = function () {
          _tsActiveLangs = _tsActiveLangs.filter(function (c) { return c !== code; });
          renderTsActiveLangs();
        };
        tag.appendChild(rm);
      }
      container.appendChild(tag);
    });
  }

  function filterTsLangs(query) { showTsDropdown(query); }

  function showTsDropdown(query) {
    var dd = document.getElementById('tsLangDropdown');
    var q = (query || document.getElementById('tsLangInput').value || '').toLowerCase();
    var filtered = _tsAllLangs.filter(function (l) {
      return !_tsActiveLangs.includes(l.code) && (l.name.toLowerCase().includes(q) || l.code.includes(q));
    }).slice(0, 30);
    dd.innerHTML = '';
    filtered.forEach(function (l) {
      var item = document.createElement('div');
      item.textContent = l.name + ' (' + l.code + ')';
      item.style.cssText = 'padding:8px 12px;font-size:13px;cursor:pointer;color:#e5e5e5;';
      item.onmouseenter = function () { this.style.background = 'rgba(255,255,255,.08)'; };
      item.onmouseleave = function () { this.style.background = ''; };
      item.onmousedown = function (e) {
        e.preventDefault();
        _tsActiveLangs.push(l.code);
        renderTsActiveLangs();
        document.getElementById('tsLangInput').value = '';
        hideTsDropdown();
      };
      dd.appendChild(item);
    });
    dd.style.display = filtered.length > 0 ? 'block' : 'none';
  }

  function hideTsDropdown() {
    var dd = document.getElementById('tsLangDropdown');
    if (dd) dd.style.display = 'none';
  }

  function saveTranslationSettings() {
    var btn = document.getElementById('tsSaveBtn');
    var errEl = document.getElementById('tsError');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Saving…';

    // Always include English
    if (!_tsActiveLangs.includes('en')) _tsActiveLangs.unshift('en');

    fetch('/api/translations/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ languages: _tsActiveLangs, defaultLanguage: 'en', favorites: _tsActiveLangs.filter(function (c) { return c !== 'en'; }) })
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.success) throw new Error(res.error || 'Failed to save');
      translationsData = res.data;
      updateTranslateBadge();
      buildLangMenu();
      closeTranslationSettings();
    })
    .catch(function (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    })
    .finally(function () {
      btn.disabled = false;
      btn.textContent = 'Save';
    });
  }

  // Close settings modal on backdrop click
  document.getElementById('translationSettingsModal').addEventListener('click', function (e) {
    if (e.target === this) closeTranslationSettings();
  });

  // ── Translation Center ────────────────────────────────────────────────────
  var tcRows = [];

  function openTranslationCenter() {
    closeTranslationSettings();
    var el = document.getElementById('translationCenter');
    el.style.display = 'flex';
    loadTranslationCenter();
  }

  function closeTranslationCenter() {
    document.getElementById('translationCenter').style.display = 'none';
  }

  function loadTranslationCenter() {
    document.getElementById('tc-loading').style.display = 'block';
    document.getElementById('tc-table').style.display = 'none';
    fetch('/api/translations/fields-summary')
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.success) throw new Error(res.error || 'Failed');
        tcRows = res.rows;
        renderTcTable(tcRows);
      })
      .catch(function(err){
        document.getElementById('tc-loading').textContent = 'Error loading: ' + err.message;
      });
  }

  function renderTcTable(rows) {
    var activeLangs = (translationsData && translationsData.languages || []).filter(function(l){ return l !== 'en'; });

    // Build header
    var thead = document.getElementById('tc-thead');
    var headerCells = '<th>Slide / Field</th><th>English</th>';
    activeLangs.forEach(function(lang){ headerCells += '<th>' + lang.toUpperCase() + '</th>'; });
    thead.innerHTML = '<tr>' + headerCells + '</tr>';

    // Filter out non-translatable rows (large HTML blobs, tiny values, pure numbers)
    rows = rows.filter(function(row) {
      var v = row.en || '';
      // Skip large HTML blobs (tabs component, carousels, etc.)
      if (v.length > 400) return false;
      // Skip if plain text is less than 3 characters after stripping tags
      var plain = stripHtmlTags(v).trim();
      if (plain.length < 3) return false;
      // Skip purely numeric values
      if (/^\d+[\d,+%°\.]*$/.test(plain)) return false;
      return true;
    });

    // Build body
    var tbody = document.getElementById('tc-tbody');
    var html = '';
    var lastSlide = null;
    var totalDirtyMissing = 0;

    rows.forEach(function(row) {
      if (row.slideId !== lastSlide) {
        lastSlide = row.slideId;
        html += '<tr class="tc-slide-header"><td colspan="' + (2 + activeLangs.length) + '">' + (row.slideTitle || row.slideId) + '</td></tr>';
      }
      var sid = escHtml(row.slideId);
      var fk  = escHtml(row.fieldKey);
      html += '<tr>';
      html += '<td class="tc-field-key">' + fk + '</td>';
      var enPlain = stripHtmlTags(row.en || '').trim();
      html += '<td class="tc-cell-en"><textarea class="tc-en-edit" data-slide-id="' + sid + '" data-field-key="' + fk + '" rows="2" style="width:100%;background:transparent;border:1px solid transparent;border-radius:6px;color:rgba(255,255,255,.8);font-size:12px;font-family:inherit;resize:vertical;min-height:36px;padding:4px 6px;line-height:1.4;">' + escHtml(enPlain) + '</textarea></td>';
      activeLangs.forEach(function(lang) {
        var entry = row.langs && row.langs[lang];
        var val = entry && entry.current || '';
        var cls = !val ? 'missing' : (entry && entry.dirty ? 'dirty' : '');
        if (cls) totalDirtyMissing++;
        var valPlain = stripHtmlTags(val);
        html += '<td class="tc-cell-lang"><textarea class="' + cls + '" data-slide-id="' + sid + '" data-field-key="' + fk + '" data-lang="' + lang + '" rows="2">' + escHtml(valPlain) + '</textarea></td>';
      });
      html += '</tr>';
    });

    tbody.innerHTML = html;
    document.getElementById('tc-loading').style.display = 'none';
    document.getElementById('tc-table').style.display = 'table';

    // Update badge
    var badge = document.getElementById('translateAllBadge');
    if (totalDirtyMissing > 0) {
      badge.textContent = totalDirtyMissing;
      badge.style.display = 'inline';
    } else {
      badge.style.display = 'none';
    }

    // Wire non-English textarea save on blur
    tbody.querySelectorAll('textarea:not(.tc-en-edit)').forEach(function(ta) {
      ta.dataset.originalVal = ta.value; // store displayed (stripped) value for change detection
      ta.addEventListener('blur', function() {
        var slideId  = ta.dataset.slideId;
        var fieldKey = ta.dataset.fieldKey;
        var lang     = ta.dataset.lang;
        if (!slideId || !fieldKey || !lang) return;
        var val = ta.value.trim();
        if (val === (ta.dataset.originalVal || '').trim()) return; // no change — don't overwrite
        fetch('/api/translations/field', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slideId: slideId, fieldKey: fieldKey, language: lang, value: val })
        }).then(function(){
          ta.classList.remove('dirty','missing');
          if (!translationsData.slides) translationsData.slides = {};
          if (!translationsData.slides[slideId]) translationsData.slides[slideId] = {};
          if (!translationsData.slides[slideId][fieldKey]) translationsData.slides[slideId][fieldKey] = {};
          translationsData.slides[slideId][fieldKey][lang] = { current: val, previous: null, dirty: false };
          updateTranslateBadge();
        });
      });
    });

    // Wire English textarea save on blur
    tbody.querySelectorAll('textarea.tc-en-edit').forEach(function(ta) {
      ta.addEventListener('blur', function() {
        var slideId  = ta.dataset.slideId;
        var fieldKey = ta.dataset.fieldKey;
        if (!slideId || !fieldKey) return;
        var val = ta.value;
        var originalVal = ta.dataset.originalEn;
        if (val === originalVal) return; // no change
        fetch('/api/library/' + slideId + '/edits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ edits: { [fieldKey]: val } })
        }).then(function() {
          ta.dataset.originalEn = val;
          // Mark all language cells for this field as dirty
          var langCells = tbody.querySelectorAll('textarea[data-slide-id="' + slideId + '"][data-field-key="' + fieldKey + '"]:not(.tc-en-edit)');
          langCells.forEach(function(lt) { lt.classList.add('dirty'); });
        });
      });
      // Store original value for change detection
      ta.dataset.originalEn = ta.value;
    });
  }

  function filterTcRows(query) {
    var q = query.toLowerCase();
    var filtered = q ? tcRows.filter(function(r){
      return r.fieldKey.toLowerCase().includes(q) || (r.en||'').toLowerCase().includes(q) || (r.slideTitle||'').toLowerCase().includes(q);
    }) : tcRows;
    renderTcTable(filtered);
  }

  function handleTranslateAllClick() {
    var btn = document.getElementById('btnTranslateAll');
    if (!btn || btn.disabled) return;
    var langs = (translationsData && translationsData.languages || []).filter(function(l){ return l !== 'en'; });
    if (langs.length === 0) { alert('No additional languages configured.'); return; }

    // Show progress bar area
    var progressEl = document.getElementById('tc-translate-progress');
    if (!progressEl) {
      progressEl = document.createElement('div');
      progressEl.id = 'tc-translate-progress';
      progressEl.style.cssText = 'padding:10px 20px;background:#1a1a1a;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.6);display:flex;gap:16px;align-items:center;flex-shrink:0;';
      document.getElementById('tc-header').insertAdjacentElement('afterend', progressEl);
    }

    btn.disabled = true;
    var slides = tcRows.reduce(function(acc, r) {
      if (!acc.find(function(s){ return s.id === r.slideId; })) acc.push({ id: r.slideId, title: r.slideTitle });
      return acc;
    }, []);

    var done = 0, failed = 0, total = slides.length;

    function updateProgress(currentTitle) {
      progressEl.innerHTML =
        (currentTitle ? '<span>&#9654; ' + escHtml(currentTitle) + '</span>' : '') +
        '<span style="color:#4ade80;">&#10003; Done: ' + done + '</span>' +
        '<span style="color:rgba(255,255,255,.4);">Pending: ' + (total - done - failed) + '</span>' +
        (failed ? '<span style="color:#f87171;">&#10007; Failed: ' + failed + '</span>' : '');
    }

    function processNext(idx) {
      if (idx >= slides.length) {
        // All done
        return fetch('/api/translations').then(function(r){ return r.json(); }).then(function(res){
          if (res.success) translationsData = res.data;
          btn.disabled = false;
          updateProgress(null);
          var doneMsg = '<span style="color:#4ade80;font-weight:700;">&#10003; All done!</span>';
          if (failed > 0) {
            doneMsg += ' <span style="color:#f87171;">(' + failed + ' batch(es) failed — check API key)</span>';
          }
          progressEl.innerHTML += doneMsg;
          loadTranslationCenter();
          updateTranslateBadge();
        });
      }
      var slide = slides[idx];
      updateProgress(slide.title);
      // Collect fields for this slide from tcRows
      var sourceFields = {};
      tcRows.filter(function(r){ return r.slideId === slide.id; }).forEach(function(r){ sourceFields[r.fieldKey] = r.en; });
      fetch('/api/translations/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slideId: slide.id, sourceFields: sourceFields, languages: langs })
      })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (res.success && res.data) { translationsData = res.data; }
        done++;
        if (res.failed > 0) { failed += res.failed; }
      })
      .catch(function(){ failed++; })
      .finally(function(){ processNext(idx + 1); });
    }

    updateProgress(slides[0] && slides[0].title);
    processNext(0);
  }

  function stripHtmlTags(html) {
    return html.replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').trim();
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  </script>

</body>

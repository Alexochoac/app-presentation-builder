services:
  builder:
    build: ./builder
    ports:
      - "3000:3000"
    env_file:
      - ./builder/.env.prod
    volumes:
      - ./builder/data:/app/data
      - ./builder/features/slides/uploads:/app/features/slides/uploads
      - ./finished-presentations:/finished-presentations

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: change-this-to-a-random-secret
    depends_on:
      - umami-db
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  umami-db-data:
